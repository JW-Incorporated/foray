<!doctype html>
<!--
  4a "Clarity" prototype, round 4. Hash routes: #/home #/mini #/now-playing #/search #/library #/foray #/onboarding.
  URL parameters (for the screenshot harness; put them before the hash):
    ?theme=light|dark    sets data-theme on <html> before first paint (first statement of clarity.js).
                         Without it the page follows the system scheme; the in-app Appearance control still works.
    ?state=<name>        forces the seeded data into one condition:
      firstrun           Today, no stat line, lead eyebrow "Picked to start", why-lines are first-run reasons
      midlisten          Today with the Resume section second; the lead capsule reads "Resume"; Foray detail "Resume at 9:40"
      offline            Today with saved badges, unsaved rows muted + aria-disabled, the one EmptyState line "Show saved"
      loading            Today skeleton: 1 lead + 3 rows, same geometry
      find-empty         #/search with "fusion" typed and no matches (subject row underneath)
      np-buffering       #/now-playing, elapsed clock replaced by the word "buffering"
      np-end             #/now-playing three seconds from the end: Up next line risen into the title slot
      foray-unavailable  #/foray greyed strip, "Not available right now; the shows are still here"
      foray-unnarrated   #/foray no hatched gaps, "No narration yet"
  Example: index.html?state=offline#/home
  Playback is simulated; no audio is loaded. Data: data.json (mirrored in data.js so file:// works).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>4a Clarity prototype</title>
<link rel="stylesheet" href="clarity.css">
</head>
<body>

  </defs>
</svg>

<a class="skip" href="#view">Skip to content</a>

<div class="frame" id="frame">
  <main id="view" tabindex="-1"></main>
</div>

<div class="find-dock" id="findDock" hidden></div>

<div class="dockwrap" id="dockwrap">
  <div class="dock" id="dock">
    <div class="mini" id="mini" hidden></div>
    <nav class="tabbar" aria-label="Main">
      <a class="tab" href="#/home" data-tab="home"><svg class="i"><use href="#i-calendar"/></svg><span>Today</span></a>
      <a class="tab" href="#/search" data-tab="search"><svg class="i"><use href="#i-search"/></svg><span>Find</span></a>
      <a class="tab" href="#/library" data-tab="library"><svg class="i"><use href="#i-library"/></svg><span>Library</span></a>
    </nav>
  </div>
</div>

<div class="scrim" id="scrim" hidden></div>
<section class="np" id="np" role="dialog" aria-modal="true" aria-label="Now playing" hidden></section>
<section class="sheet" id="you" role="dialog" aria-modal="true" aria-label="You" hidden></section>
<div id="menuHost"></div>
<div class="undo" id="undo" role="status" aria-live="polite" hidden></div>

<script src="data.js"></script>
<script src="clarity.js"></script>
</body>
</html>
