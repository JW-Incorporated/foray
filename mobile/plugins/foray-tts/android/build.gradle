/* The `foray-tts` Capacitor plugin's Android library module.
 *
 * WHAT THIS IS. Same mechanism `foray-audio/android/build.gradle` documents in
 * full: Capacitor's CLI reads `../package.json`'s `capacitor.android.src`,
 * finds this directory, and writes the include/implementation lines into the
 * GENERATED `mobile/android/` on every `cap add android` / `cap sync`. See
 * `docs/android-native-code.md` for why hand-written native code lives here
 * rather than in the gitignored `mobile/android/`.
 *
 * ONE DEPENDENCY, AND IT IS NOT NEW TO THE BUILD: `project(':capacitor-android')`
 * for the `Plugin`/`PluginCall` base classes -- already a module of every
 * generated Capacitor project, exactly as `foray-audio`'s module notes.
 *
 * NO MEDIA3, UNLIKE `foray-audio`. This plugin does not touch a foreground
 * service, a notification or a lock-screen session -- `android.speech.tts.TextToSpeech`
 * is a plain framework class the Activity/Context already has access to, and
 * synthesis for a fixture-length utterance (§5.7's ~4,500-character estimate)
 * finishes well inside Android's normal process-priority window, so nothing
 * here needs to survive being backgrounded the way Foray playback does.
 */

apply plugin: 'com.android.library'

android {
    namespace = "ai.jwlabs.foura.tts"
    compileSdk = project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36
    defaultConfig {
        minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 24
        targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 36
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    lintOptions {
        abortOnError = false
    }
    compileOptions {
        /* Matches foray-audio's own module: capacitor-android compiles at 21
           and Capacitor 8 requires JDK 21 outright (docs/android-shell-build.md
           §1.2). One toolchain across both hand-written modules. */
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation project(':capacitor-android')
    /* ONNX Runtime, for K-01's measurement engine (KokoroOrtProbeEngine.java).
     * MIT-licensed, already carried in docs/legal/third-party-notices.md.
     *
     * PINNED EXACTLY, not with a `+` or a range: the number this card exists
     * to produce is a TIMING, and a measurement whose runtime version is not
     * in the diff is not a measurement. The version matches the `onnxruntime`
     * pin in tools/narration/requirements.txt to within a patch, so K-03's
     * audition renders through the same generation of the graph the phone runs.
     *
     * `onnxruntime-android` is the mobile package: it carries arm64-v8a,
     * armeabi-v7a, x86 and x86_64 .so files, and the ~16 MB in the size budget
     * (test/release-gates.test.js) is what Play's per-ABI split ships.
     *
     * NOT sherpa-onnx: its TTS API takes TEXT and runs a GPL-3 text front end
     * on it internally, which is the one dependency deck §4 exists to keep off
     * the phone. ORT takes tensors and has no opinion about text.
     *
     * THAT FRONT END IS NOT NAMED IN THIS FILE ON PURPOSE:
     * test/release-gates.test.js greps this very file for the three names it
     * travels under, comments included, because a manifest is the only way one
     * reaches a shipped binary. A gate a comment can break is a gate that
     * works. See docs/legal/third-party-notices.md, "What is deliberately NOT
     * here", for the names and the argument. */
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.20.0'
}
