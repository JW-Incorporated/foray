/* The `foray-audio` Capacitor plugin's Android library module.
 *
 * WHAT THIS IS. Capacitor's CLI reads `../package.json`'s `capacitor.android.src`,
 * finds this directory, and writes two lines into the GENERATED project on every
 * `cap add android` / `cap sync`:
 *
 *     mobile/android/capacitor.settings.gradle  ->  include ':foray-audio'
 *                                                   project(':foray-audio').projectDir = …
 *     mobile/android/app/capacitor.build.gradle ->  implementation project(':foray-audio')
 *
 * That is the whole reason this file lives here and not in `mobile/android/`:
 * those two generated files are rewritten from the plugin list every sync, so a
 * regenerated platform re-consumes this module with no patch step and nothing for
 * a human to run. See docs/android-native-code.md.
 *
 * DELIBERATELY MODELLED ON `node_modules/@capacitor/app/android/build.gradle`.
 * The version-resolution shape — `project.hasProperty('x') ? rootProject.ext.x : <fallback>`
 * — is Capacitor's, not ours, and it is copied rather than improved for one
 * reason: those `rootProject.ext` values come from the generated
 * `mobile/android/variables.gradle`, so this module tracks whatever the app is
 * built against (compileSdk 36, minSdk 24, targetSdk 36 as of Capacitor 8.5.0)
 * instead of pinning a second, drifting set. The fallbacks only apply if someone
 * builds this module standalone, which nothing in this repo does.
 *
 * TWO DEPENDENCIES, AND NEITHER IS NEW TO THE BUILD:
 *   - project(':capacitor-android')  — the `Plugin`/`PluginCall` base classes.
 *     Already a module of every generated Capacitor project.
 *   - androidx.appcompat            — for `NotificationCompat`, `ServiceCompat`
 *     and `ContextCompat`, which appcompat exposes as `api` on `androidx.core`.
 *     Already pulled in by capacitor-android and by every bundled plugin, and
 *     asking for it by the same coordinate they use adds no new Maven artefact.
 *
 * AND SINCE #27, TWO MEDIA3 DEPENDENCIES, WHICH ARE NEW MAVEN ARTEFACTS — the
 * first this module has added, so they are named individually with what each is
 * for. #244's own comment here said Media3 was "the right answer for the NEXT
 * piece" and that declaring it then "would be a dependency with no caller"; this
 * is that piece, and it has callers.
 *
 *   - androidx.media3:media3-session  — `MediaSession`, the object that publishes a
 *     platform media session for the lock screen and the media panel to read, and
 *     `MediaStyleNotificationHelper`, which stamps that session's token onto our
 *     notification so the system pairs the two. This is the artefact #27 cannot be
 *     built without: `navigator.mediaSession` is switched off in Android WebView at
 *     the engine level (docs/research/mp1-background-audio.md §5.4), so the whole
 *     surface is native.
 *   - androidx.media3:media3-common   — `SimpleBasePlayer`, which is the documented
 *     base class for "a player that supports only a subset of commands" and is
 *     what lets a Media3 session read a state we hold rather than a player we own.
 *     Also `Player`, `MediaMetadata` and `PlaybackParameters`.
 *
 * `media3-common` arrives transitively through `media3-session` and is declared
 * ANYWAY, because `WebViewPlayer.java` imports it directly and a module should ask
 * for what it compiles against rather than inherit it. Same version, one place.
 *
 * AND SINCE A-25 (docs/plans/android-assessment.md §5.4, Track A1), MEDIA3-EXOPLAYER
 * AND THE ENGINE CORE, because the native engine now has a deck:
 *
 *   - androidx.media3:media3-exoplayer  — `ExoPlayer`, the player behind
 *     `engine/ExoDeck.java`, the Android twin of iOS's AVDeck. Until A-25 this header
 *     said the opposite ("a second, real audio pipeline in a process whose whole design
 *     is that the page owns the one that exists"), and that stays true of the JS lane:
 *     the deck is wired to nothing until A-26's MediaSessionService drives it in native
 *     mode, behind the A-20 contract gate (mobile/ENGINE_DEFAULT.json: android `native` since A-31).
 *     It brings media3-extractor, -decoder, -container and -datasource (the progressive
 *     MP3/WAV path) and androidx.exifinterface.
 *   - project(':foray-engine-core-jvm') — the engine's pure-JVM core (A-21..A-24): the
 *     deck speaks its DeckCommand / DeckEvent vocabulary and runs its out-point reducer.
 *     Not a Maven artefact: the sibling module `cap add android` already includes.
 *
 * STILL NOT MEDIA3-UI: ~1 MB of `PlayerView` for a notification we build with
 * `NotificationCompat`.
 *
 * AND FOR THE TESTS ONLY (A-25): androidx.media3:media3-test-utils and
 * media3-test-utils-robolectric (`TestExoPlayerBuilder`, `FakeClock`,
 * `RobolectricUtil`), the card's named harness, at the one Media3 version. They depend
 * on Robolectric 4.16, so the Robolectric line below says 4.16 rather than let Gradle
 * quietly lift 4.14.1 under it.
 *
 * WHAT COMES IN BEHIND THEM, stated because a transitive dependency is still a
 * dependency: `media3-common` exposes `com.google.guava:guava` (33.3.1-android) as
 * `api`, and it is unavoidable rather than chosen — `SimpleBasePlayer`'s own abstract
 * methods return `ListenableFuture`, so the type is in the contract we implement.
 * `media3-session` also brings `media3-datasource` and `media3-container`, which is
 * where its default `BitmapLoader` lives. Guava-android is the large one; the APK
 * cost of all of it is measured in docs/android-native-code.md §4.
 *
 * THE JS LANE'S SERVICE IS NOT A `MediaSessionService`, and that is a design decision
 * rather than a dependency one — PlaybackKeepAliveService.onBind's comment is the argument.
 * THE NATIVE ENGINE'S IS (A-26, `ForayPlaybackService`): there the engine owns the audio, so
 * Media3 owning the foreground lifecycle is the point, not a risk. Same media3-session
 * artefact; nothing new is declared for it.
 *
 * NO `buildscript { }` BLOCK, unlike @capacitor/app's copy of this file, which
 * pins `com.android.tools.build:gradle:8.13.0` for its own standalone `./gradlew
 * build`. This module is only ever built as a subproject of the generated app, so
 * `com.android.library` resolves from the root project's classpath and a second
 * AGP pin here would be a version to forget to bump.
 */

ext {
    androidxAppCompatVersion = project.hasProperty('androidxAppCompatVersion') ? rootProject.ext.androidxAppCompatVersion : '1.7.1'
    /* PINNED HERE, unlike appcompat above, and the difference is deliberate. The
       Capacitor-shaped `rootProject.ext` lookup exists so a module tracks whatever the
       generated project was built against — but the generated `variables.gradle` has no
       Media3 entry to track, so a `hasProperty` dance would be a fallback pretending to
       be a lookup. `cap add android` would also silently change this number on a
       Capacitor upgrade if it ever gained one, which for a library that owns the lock
       screen is a thing to notice rather than inherit.

       1.11.0, read from Google's Maven `maven-metadata.xml` as the current `<release>`
       on 2026-08-18 — not from memory, because the wrong Media3 version is a build
       failure with a resolution error rather than anything about media.

       AND IT IS A PLAIN ASSIGNMENT, because the first version of this WAS the
       `hasProperty` dance the paragraph above argues against — a review pass pointed out
       that the comment and the code disagreed. Two things wrong with the dance here: a
       future `variables.gradle` entry would silently move the Media3 version of the
       module that owns the lock screen, and `-Pmedia3Version=1.9.0` on the command line
       makes `hasProperty` true while `rootProject.ext.media3Version` does not exist, so
       an override fails with `MissingPropertyException` instead of working. The appcompat
       line above keeps the dance on purpose: that value DOES exist in the generated
       project, and tracking it is the point. */
    media3Version = '1.11.0'
}

/* A-25: the NE-25a click tracks the ExoDeck measurements play, read IN PLACE from the iOS
   test fixtures (the same files the iOS InOutPointMeasurementTests measure), as the JVM core
   reads player/parity/ in place: nothing is copied into this module. */
def forayClickTracks = file('../ios/Tests/ForayAudioPluginTests/Fixtures/ClickTracks')

/* A-41: THE ENGINE'S TWO BUNDLED FILES, read IN PLACE from the repo into the app's assets, so
   there is one copy of each: the seam jingle (player/assets/interlude-placeholder.wav, the web's
   own, which engine/InterludePlayer.java plays after hashing it against its pin) and the
   pronunciation lexicon (mobile/plugins/foray-tts/lexicon/hard-terms.json, which
   engine/SpeechLexicon.java parses). Each directory holds only that file, and each lands at the
   assets' root. The repo root is the first ancestor of this directory (canonical, so a symlinked
   module still walks the real checkout) that holds the jingle, as the JVM core finds
   player/parity/. With no checkout around it (nothing in this repo builds that way) there are no
   such assets, and the engine runs with no jingle and no lexicon, which each says in a row. */
def forayRepoRoot = {
    for (def dir = projectDir.canonicalFile; dir != null; dir = dir.parentFile) {
        if (new File(dir, 'player/assets/interlude-placeholder.wav').isFile()) return dir
    }
    return null
}()
def forayEngineAssets = forayRepoRoot == null ? [] : [
    new File(forayRepoRoot, 'player/assets'),
    new File(forayRepoRoot, 'mobile/plugins/foray-tts/lexicon'),
]

apply plugin: 'com.android.library'

android {
    namespace = "ai.jwlabs.foura.audio"
    compileSdk = project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36
    defaultConfig {
        minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 24
        targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 36
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    lintOptions {
        abortOnError = false
    }
    sourceSets {
        main {
            assets.srcDirs += forayEngineAssets
        }
    }
    compileOptions {
        /* 21 because capacitor-android compiles at 21 and Capacitor 8 requires JDK
           21 outright (docs/android-shell-build.md §1.2: JDK 17 dies at
           `invalid source release: 21`). Matching it keeps one toolchain. */
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    /* M5 (full-repo-review-report.md, 2026-08-31): before this, CI's only Android
       coverage was `tools/mobile/shell-invariants.test.mjs` (source-shape/JS-bridge)
       plus `android-build.yml` compiling this module into an APK. Neither ever
       EXECUTES a line of ForayAudioPlugin/PlaybackKeepAliveService/NowPlayingHub —
       a JVM-level unit test module (Robolectric) is what lets that native lifecycle
       code actually run, on the same ubuntu-latest runner that already builds it,
       with no emulator and no new CI infra. `includeAndroidResources` is required
       for Robolectric to resolve this module's own `R` class (strings.xml) and to
       read its AndroidManifest.xml permission/service declarations under test. */
    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
            /* A-25: the click tracks are an INPUT of the unit-test task (a fixture-only change
               reruns it) and reach the tests as a system property. The ExoDeck tests hold a
               real ExoPlayer each; the heap is raised from Gradle's 512 MB default for them. */
            all { test ->
                test.systemProperty 'foray.clicktracks.dir', forayClickTracks.path
                test.inputs.dir(forayClickTracks).withPropertyName('forayClickTracks').withPathSensitivity(PathSensitivity.RELATIVE)
                test.maxHeapSize = '2g'
            }
        }
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation project(':capacitor-android')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.media3:media3-session:$media3Version"
    implementation "androidx.media3:media3-common:$media3Version"
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation project(':foray-engine-core-jvm')

    /* JVM unit tests only (src/test), not instrumentation — no emulator/device
       needed, so these run in the same `assembleDebug`-hosting CI job. Versions
       picked as of 2026-08-31 (mavenCentral()/google() `maven-metadata.xml`
       `<release>`), same sourcing discipline as the `media3Version` comment above:
       the wrong version is a resolution error, not a test failure, so it is looked
       up rather than remembered. */
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.16"
    testImplementation "androidx.test:core:1.6.1"
    testImplementation "androidx.test.ext:junit:1.2.1"
    testImplementation "androidx.media3:media3-test-utils:$media3Version"
    testImplementation "androidx.media3:media3-test-utils-robolectric:$media3Version"
}
