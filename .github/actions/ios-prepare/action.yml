name: "ios-prepare"
description: >-
  The iOS inject sequence, once: the edits `npx cap add ios` does not make to
  the generated project (seam jingle, background audio, encryption
  declaration, privacy manifest, app icon, splash) with every second opinion
  on each, the SwiftUI-scaffold guard, the Xcode container detection, and the
  MinimumOSVersion patch on the resolved SwiftPM tree. Run by BOTH iOS build
  paths - ios-build.yml (PR-time, unsigned) and .github/actions/ios-archive
  (release.yml's TestFlight archive) - so the two can no longer drift
  (CH2-16, T2-01). Holds no secret and takes no input.
  CALLER CONTRACT - before `uses:` this action the caller has checked out the
  repo, set up Node 22, generated the iOS project (mobile/'s add:ios script),
  and put ART (a log directory that exists) and SPM_DIR (the one resolved
  SwiftPM tree every later xcodebuild must share) in $GITHUB_ENV. This action
  leaves the generated project's paths (IOS_DIR, INFO_PLIST and the icon and
  splash catalogs) and the detected Xcode container (XC_FLAG, XC_PATH,
  XC_TOOLCHAIN) in $GITHUB_ENV for the caller's build steps.

# WHY THIS FILE EXISTS. Until CH2-16 the sequence below lived twice: inline in
# ios-build.yml and hand-copied into ios-archive, whose header claimed it had
# been "factored out". The copies had already drifted - the PlistBuddy reads of
# UIBackgroundModes and ITSAppUsesNonExemptEncryption, the `test -d` on both
# asset catalogs and the `python3 -m json.tool` reads of both Contents.json
# existed only on the PR path, so the build that reaches TestFlight ran the
# weaker checks. That is the shape of release run 34739630705: a green PR
# build and an altool rejection. One file now; a fix here reaches both paths.
#
# ART IS UPLOADED AS AN ARTIFACT on both paths (ios-ci on the PR build,
# ios-release on the release run). Nothing here holds a secret, so the evidence
# copies below (the edited Info.plist, the privacy manifest, the icon manifest)
# are safe there; tools/mobile/release-workflow.test.mjs pins that no secret
# reaches $ART.

runs:
  using: "composite"
  steps:
    - name: Name the generated project, and check the caller's contract
      # ONE place the generated project's paths are written down, derived from
      # IOS_DIR rather than retyped, and the two variables this action needs
      # from its caller asserted rather than assumed: an unset SPM_DIR would let
      # the MinimumOSVersion patch below resolve into a directory no build reads.
      shell: bash
      run: |
        set -euo pipefail
        : "${ART:?the caller sets ART, its log directory, before ios-prepare}"
        : "${SPM_DIR:?the caller sets SPM_DIR, the one resolved SwiftPM tree, before ios-prepare}"
        test -d "$ART"
        IOS_DIR=mobile/ios
        {
          echo "IOS_DIR=$IOS_DIR"
          echo "INFO_PLIST=$IOS_DIR/App/App/Info.plist"
          echo "APPICONSET=$IOS_DIR/App/App/Assets.xcassets/AppIcon.appiconset"
          echo "SPLASHSET=$IOS_DIR/App/App/Assets.xcassets/Splash.imageset"
        } >> "$GITHUB_ENV"

    - name: Put the seam jingle in the app (NE-34)
      # NOT a SwiftPM resource: a `resources:` on a plugin target makes a
      # resource-bundle target, and the signed archive fails on it
      # ("ForayAudio_ForayAudioPlugin does not support provisioning profiles",
      # release run 36535801479), which the unsigned PR build never sees.
      # Copied into the public/ folder reference instead; see the script's
      # header.
      shell: bash
      run: |
        set -euo pipefail
        node tools/mobile/inject-interlude.mjs mobile/ios/App/App/public
        node tools/mobile/inject-interlude.mjs mobile/ios/App/App/public --check

    - name: Which Xcode container did Capacitor generate?
      # `-workspace` (CocoaPods) or `-project` (SwiftPM), chosen by a tested
      # function rather than assumed. Every Capacitor guide - and HUMAN-ACTIONS.md
      # #16 as first written - assumes a workspace; 8.x does not make one.
      id: xc
      shell: bash
      run: |
        set -euo pipefail
        node tools/mobile/ios-ci.mjs xcode-container "$IOS_DIR" | tee "$ART/xcode-container.txt"
        sed -n 's/^xc_flag=/XC_FLAG=/p; s/^xc_path=/XC_PATH=/p; s/^xc_toolchain=/XC_TOOLCHAIN=/p' \
          "$ART/xcode-container.txt" >> "$GITHUB_ENV"

    - name: Assert the generated project did NOT land on the SwiftUI scaffold
      # #209's invariant 2, checked against reality instead of against config.
      # `ios/` is a separate target that `ios-kit` compiles; two iOS codebases
      # in one directory is the failure the whole scaffold exists to avoid.
      shell: bash
      run: |
        set -euo pipefail
        for bad in ios/App/App ios/App/Podfile ios/App/App.xcodeproj ios/capacitor.config.json; do
          if [ -e "$bad" ]; then echo "Capacitor generated into the SwiftUI scaffold: $bad"; exit 1; fi
        done
        test -f ios/ForayKit/Package.swift

    - name: Add UIBackgroundModes -> audio, and have Apple's parser check it
      # MP1 §7.3: this is the ENTIRE iOS background-audio requirement. WebKit
      # sets the AVAudioSession category itself for an audible <audio> element,
      # so there is no plugin, no AppDelegate edit and no Swift. Capacitor has
      # no config option for the key, so something has to edit the generated
      # plist - and that something is a unit-tested pure function
      # (tools/mobile/inject-background-audio.test.mjs, all of it runnable
      # without a Mac) rather than a sed a regex change could silently no-op.
      #
      # THREE independent confirmations, because the failure is invisible: the
      # function re-parses its own output, `plutil -lint` says the file is still
      # valid, and PlistBuddy - Apple's own reader - prints the value.
      #
      # NE-17: the bare run also writes ForayEngineDefault (from
      # mobile/ENGINE_DEFAULT.json) and `--check` prints it into the log; no
      # `--engine-default` override, ever.
      shell: bash
      run: |
        set -euo pipefail
        node tools/mobile/inject-background-audio.mjs "$INFO_PLIST"
        plutil -lint "$INFO_PLIST"
        /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$INFO_PLIST" | tee "$ART/uibackgroundmodes.txt"
        grep -q "audio" "$ART/uibackgroundmodes.txt"
        node tools/mobile/inject-background-audio.mjs "$INFO_PLIST" --check

    - name: Declare no non-exempt encryption, and have Apple's parser check it
      # Apple, to the founder, verbatim on 2026-09-03: "Since your build doesn't
      # contain encryption, you can specify this in the information property list
      # (Info.plist) in your Xcode project to avoid answering encryption questions
      # with each app submission." This is that key.
      #
      # The answer is legitimately "none": the only crypto call in shipped code is
      # `crypto.subtle.digest("SHA-256", ...)` in sw.js -- a HASH, for cache
      # integrity, using WebKit's implementation -- HTTPS is the OS's, the root
      # package.json declares zero dependencies, and nothing under mobile/ links a
      # crypto library. The reasoning lives beside the key in
      # tools/mobile/inject-background-audio.mjs, and a test asserts it is still
      # there, because `false` stops being true the day the app gains real crypto.
      #
      # SAME THREE CONFIRMATIONS as the step above, for the same reason: the
      # function re-parses its own output, `plutil -lint` says the file is still
      # valid, and PlistBuddy -- Apple's own reader -- prints the value, which the
      # grep pins EXACTLY (`true` is the opposite legal declaration). `--check`
      # then re-reads it through our parser. A missing key is not a build failure;
      # it is a questionnaire that comes back on every upload, forever, with
      # nothing anywhere saying why.
      shell: bash
      run: |
        set -euo pipefail
        node tools/mobile/inject-background-audio.mjs "$INFO_PLIST" --encryption false
        plutil -lint "$INFO_PLIST"
        /usr/libexec/PlistBuddy -c "Print :ITSAppUsesNonExemptEncryption" "$INFO_PLIST" \
          | tee "$ART/its-app-uses-non-exempt-encryption.txt"
        grep -qx "false" "$ART/its-app-uses-non-exempt-encryption.txt"
        node tools/mobile/inject-background-audio.mjs "$INFO_PLIST" --check --encryption false
        cp "$INFO_PLIST" "$ART/Info.plist"

    - name: Add the privacy manifest (Required Reason APIs), and have Apple's parser check it
      # Issue #948. App Store Connect rejects a SUBMISSION whose binary uses a
      # Required Reason API that no PrivacyInfo.xcprivacy declares (ITMS-91053);
      # TestFlight only emails a warning, so a build can reach testers and still
      # be unsubmittable. `cap add ios` generates no manifest. This writes one
      # (UserDefaults CA92.1, system boot time 35F9.1, and
      # the collected data types of docs/legal/data-safety.md Part B) and adds it
      # to the app target's Copy Bundle Resources phase in project.pbxproj -- a
      # file the project does not reference never reaches App.app. Not a SwiftPM
      # resource: that breaks the signed archive (see inject-interlude above).
      # The evidence for each category lives in tools/mobile/inject-privacy-
      # manifest.mjs and its test re-greps the plugin Swift on every run.
      #
      # Same three confirmations as the plist steps above: the function re-parses
      # its own pbxproj edit, `plutil -lint` (Apple's parser) reads both files,
      # and `--check` reads them back. The BUILT bundle (ios-build.yml) and the
      # ARCHIVE (ios-archive) are each checked after their own build.
      shell: bash
      run: |
        set -euo pipefail
        node tools/mobile/inject-privacy-manifest.mjs "$IOS_DIR/App"
        plutil -lint "$IOS_DIR/App/App/PrivacyInfo.xcprivacy"
        plutil -lint "$IOS_DIR/App/App.xcodeproj/project.pbxproj"
        node tools/mobile/inject-privacy-manifest.mjs "$IOS_DIR/App" --check
        cp "$IOS_DIR/App/App/PrivacyInfo.xcprivacy" "$ART/PrivacyInfo.xcprivacy"

    - name: Put the REAL app icon in the generated asset catalog
      # WHY THIS STEP EXISTS. Nothing wired 4a's icon into the bundle: `cap add
      # ios` generates Capacitor's placeholder AppIcon.appiconset and the build
      # archived it as-is, so a build reached TestFlight on 2026-09-03 wearing
      # it. Capacitor has no config option for the icon, so something has to
      # write into the generated project -- and that something is a unit-tested
      # pure function (tools/mobile/inject-app-icon.test.mjs, all of it runnable
      # on Windows with no Mac) rather than a `cp` to a filename that can stop
      # matching in silence.
      #
      # IT IS ALSO THE STORE LISTING. Apple removed App Store Connect's
      # icon-upload field in Xcode 14; the public product page's icon is now
      # EXTRACTED from the uploaded binary's asset catalog. There is no dashboard
      # fallback and no way to fix a build already uploaded, so a silent no-op
      # here ships a listing with no icon of ours.
      #
      # `--check` IS NOT `test -f`, and that distinction is the whole step. The
      # placeholder exists at exactly the declared filename and is also
      # 1024x1024, so any existence check passes on the bug. `--check` compares
      # bytes against icon-1024.png.
      shell: bash
      run: |
        set -euo pipefail
        test -d "$APPICONSET"
        node tools/mobile/inject-app-icon.mjs "$APPICONSET"
        # A SECOND, INDEPENDENT PARSER on the manifest we just read, the way
        # PlistBuddy is the second opinion on the Info.plist above.
        #
        # NOT `plutil -lint`, AND RUN 33819135977 IS WHY. This line used to be
        # `plutil -lint "$APPICONSET/Contents.json"` with a comment claiming
        # "plutil -lint reads JSON too". It does not: it parses as a property
        # list and answered `(Unexpected character { at line 1)`, exit 1, on a
        # Contents.json Xcode itself wrote. `python3 -m json.tool` is on every
        # macOS runner and is genuinely a different implementation from the
        # Node parser that wrote the file.
        python3 -m json.tool "$APPICONSET/Contents.json" > /dev/null
        node tools/mobile/inject-app-icon.mjs "$APPICONSET" --check
        cp "$APPICONSET/Contents.json" "$ART/AppIcon-Contents.json"
        ls -l "$APPICONSET" | tee "$ART/appiconset.txt"

    - name: Put the REAL splash screen in the generated asset catalog
      # Same bug as the icon, one imageset over: `cap add ios` generates
      # Capacitor's placeholder Splash.imageset and every build to 2026090603
      # opened on it. tools/mobile/inject-splash.mjs renders the 4a wordmark on
      # the app's own ground into every file the imageset's Contents.json
      # declares; `--check` compares BYTES, because the placeholder exists at
      # the right name and size. Pure functions, tested on Windows
      # (tools/mobile/inject-splash.test.mjs).
      shell: bash
      run: |
        set -euo pipefail
        test -d "$SPLASHSET"
        node tools/mobile/inject-splash.mjs ios "$SPLASHSET"
        python3 -m json.tool "$SPLASHSET/Contents.json" > /dev/null
        node tools/mobile/inject-splash.mjs ios "$SPLASHSET" --check
        ls -l "$SPLASHSET" | tee "$ART/splashset.txt"

    - name: Give the embedded ONNX Runtime framework the MinimumOSVersion Apple requires
      # ONNX RUNTIME IS GONE SINCE CH-20 (founder ruling on issue #1076: the
      # Kokoro probe, its only caller, left the app), so there is no thin
      # plist left to patch today and `patch` reports every slice "already
      # declares". The step and `verify` stay, under this name (the workflow
      # tests pin it): Capacitor's and Cordova's xcframeworks are still
      # embedded, and the next binary dependency with a thin plist should go
      # red here rather than at `altool`.
      #
      # THE STEP THAT WOULD HAVE SAVED RELEASE RUN 34739630705 (build
      # 2026091315, main @ ad732eb). It compiled, archived, exported - and died
      # in `xcrun altool --upload-app`:
      #
      #   Missing Info.plist value. A value for the key 'MinimumOSVersion' in
      #   bundle App.app/Frameworks/onnxruntime.framework is required. (90360)
      #
      # The key was absent from Microsoft's own xcframework slice, not from our
      # embed - see `tools/mobile/ios-embedded-frameworks.mjs` for the evidence,
      # for why patching a binary dependency's metadata is a WORKAROUND, and for
      # the two things that would remove it. The PR-time build ran this step and
      # was green all the way to Apple, because it never archives; the archive
      # runs it here too now, from the same file.
      #
      # BEFORE any xcodebuild build, on the RESOLVED SwiftPM artifact, because
      # at that moment nothing is signed: Xcode then embeds an already-correct
      # plist and signs it itself. Patching the built bundle instead would break
      # the framework's seal and the app's with it.
      shell: bash
      run: |
        set -euo pipefail
        xcodebuild "$XC_FLAG" "$XC_PATH" -scheme App \
          -clonedSourcePackagesDirPath "$SPM_DIR" \
          -resolvePackageDependencies > "$ART/spm-resolve.log" 2>&1 \
          || { tail -50 "$ART/spm-resolve.log"; exit 1; }
        # Read the deployment target off the project rather than hardcoding it: a
        # framework may declare an OLDER floor than the app but never a newer one,
        # and the verify steps after each build assert exactly that relationship.
        xcodebuild "$XC_FLAG" "$XC_PATH" -scheme App -configuration Release \
          -sdk iphoneos -clonedSourcePackagesDirPath "$SPM_DIR" \
          -showBuildSettings > "$ART/build-settings.txt" 2>/dev/null
        # `head -1` takes the scheme's own target, which xcodebuild prints first.
        # If that ever stops being true the value lands too HIGH and the verify
        # step says so by name - it is not a silent wrong answer.
        MIN_OS=$(sed -n 's/^ *IPHONEOS_DEPLOYMENT_TARGET = //p' "$ART/build-settings.txt" | head -1)
        test -n "$MIN_OS"
        echo "IPHONEOS_DEPLOYMENT_TARGET is $MIN_OS"
        # The failure mode worth printing for: the patcher REFUSES to report
        # success when it found nothing to patch, and the only reason that
        # happens is the resolved artifact not being where we pointed it. Print
        # the tree so the next reader can see where Xcode actually put it.
        node tools/mobile/ios-embedded-frameworks.mjs patch "$SPM_DIR" --min-os "$MIN_OS" \
          | tee "$ART/framework-plist-patch.txt" \
          || { echo "::group::$SPM_DIR"; find "$SPM_DIR" -maxdepth 4 -type d; echo "::endgroup::"; exit 1; }
        # Apple's own parser on our output, the second opinion every other plist
        # edit in this action gets.
        find "$SPM_DIR" -name Info.plist -path "*.framework/*" -print0 | xargs -0 -n1 plutil -lint
