name: "release-facts"
description: >-
  Fetch, into files in the workspace, every fact the release watchdog
  (release-watch.yml) and the release trigger (release-trigger.yml) judge:
  release.yml's run history (runs.json), what main holds that the stores do
  not (commits.txt, in parseGitLog's format), and the OTHER workflow's pulse
  (peer-workflow.json, peer-runs.json). `for: watch` adds the newest completed
  release's jobs and summary-job log (jobs.json, summary.log - G2); `for:
  trigger` adds main's own state at the commit a dispatch would build
  (main-runs.json, main-status.json, main-checks.json) and, for each failed
  release since the last success, its jobs and any iOS-gate refusal's log
  (run-jobs/ - issue #745). Every fetch is retried,
  and one that still fails fails the step, except the summary log and the
  ios-checks logs (below).
  CALLER CONTRACT - the caller has checked out the repo with fetch-depth 0
  (the commits walk is `git log <last released commit>..origin/main`) and set
  up Node; tools/release/watch-release.mjs is read from that checkout.
inputs:
  for:
    description: "`watch` (release-watch.yml) or `trigger` (release-trigger.yml). Names the peer too: each watches the other."
    required: true
  token:
    description: "A token that can read Actions runs, statuses and check runs - the caller's GITHUB_TOKEN."
    required: true

# WHY THIS FILE EXISTS (CH2-34a, T2-21). Until docs/roadmap/code-health-2.md's
# CH2-34a the two workflows carried this preamble twice - the same retry()/
# fetch() helpers, the same release history and commits walk, the same peer
# fetches - and a change to one copy (a longer backoff, a new endpoint) would
# not reach the other. One file now. The sticky issue they both maintain has
# one write path too: `watch-release.mjs --mode issue --apply`.
#
# No `npm ci`: watch-release.mjs has no dependencies and makes no network
# calls while it judges. Everything it reads is fetched here into a file, so
# every verdict is a pure function of these files. A fetch that fails after its
# retries fails the step - "I could not tell" is not a verdict and must never
# reach the issue dressed up as one.

runs:
  using: "composite"
  steps:
    - name: Fetch the release history, the waiting commits and the peer's pulse
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ github.repository }}
        FOR: ${{ inputs.for }}
      run: |
        set -euo pipefail

        case "$FOR" in
          watch)   PEER=release-trigger.yml ;;
          trigger) PEER=release-watch.yml ;;
          *)       echo "::error::release-facts: input 'for' must be watch or trigger, not '$FOR'"; exit 1 ;;
        esac

        retry() {
          local n=1 max=4 delay=5
          until "$@"; do
            if [ $n -ge $max ]; then return 1; fi
            echo "attempt $n/$max failed, retrying in ${delay}s..." >&2
            sleep $delay; n=$((n + 1)); delay=$((delay * 3))
          done
        }
        fetch() { retry gh api "$1" > "$2"; }

        # No branch filter: a tag-triggered run's head_branch is the tag.
        fetch "repos/$REPO/actions/workflows/release.yml/runs?per_page=30" runs.json

        if [ "$FOR" = watch ]; then
          # The newest completed run's jobs, and its summary job's log - the
          # only place the per-store outcome is readable (see parseOutcome()).
          #
          # THE LOG IS THE ONE FETCH ALLOWED TO FAIL. Actions keeps logs for 90
          # days; the run history and jobs list outlive them. After a quiet
          # stretch (a pause, or only data commits, which never release) the
          # newest release's log is gone for good, and a fatal fetch would turn
          # the watchdog red every hour - and then raise WATCHDOG_BROKEN - over a
          # log that will never come back. An empty log is a reading, not a
          # guess: divergentGate() falls back to the store jobs' conclusions.
          echo '{"jobs":[]}' > jobs.json
          : > summary.log
          if RUN=$(node tools/release/watch-release.mjs --mode latest-completed --runs runs.json); then
            fetch "repos/$REPO/actions/runs/$RUN/jobs" jobs.json
            SUMMARY=$(jq -r '.jobs[] | select(.name == "summary" and .conclusion != "skipped") | .id' jobs.json | head -n1)
            if [ -n "$SUMMARY" ]; then
              if ! fetch "repos/$REPO/actions/jobs/$SUMMARY/logs" summary.log; then
                echo "::warning::the summary job's log (job $SUMMARY) is unreadable — expired past log retention? G2 reads job conclusions instead."
                : > summary.log
              fi
            fi
          fi
        fi

        # What main holds that the stores do not. No successful release on
        # record leaves this empty, and G3 says so in its own words.
        : > commits.txt
        if SHA=$(node tools/release/watch-release.mjs --mode last-success --runs runs.json); then
          git log --first-parent --diff-merges=first-parent --no-renames --name-only \
            --format='%x1e%H %cI %s' "$SHA..origin/main" > commits.txt
        fi

        if [ "$FOR" = trigger ]; then
          # main's own state, at the commit a dispatch would build.
          HEAD_SHA=$(git rev-parse origin/main)
          fetch "repos/$REPO/actions/runs?head_sha=$HEAD_SHA&per_page=50" main-runs.json
          fetch "repos/$REPO/commits/$HEAD_SHA/status" main-status.json
          # ci-release-6: ci.yml is judged by protect-main's REQUIRED checks on
          # this SHA, not by its whole-run conclusion (an advisory ios-kit or
          # playwright failure turns the run red and used to hold every release).
          fetch "repos/$REPO/commits/$HEAD_SHA/check-runs?per_page=100" main-checks.json

          # Issue #745: the jobs of every release run since the last success that
          # did not succeed, so the retry budget can leave out a run the iOS gate
          # refused (ios-checks failed, so the macOS ios job was skipped and no
          # macOS minute was spent). Then, for each such refusal, the ios-checks
          # job's log: it says whether main had moved past the run's commit
          # (superseded). Which runs and which jobs is decided by
          # watch-release.mjs, never by a jq filter here. A refusal's log may be
          # gone (retention) and that is not fatal: the run then reads as a plain
          # refusal, never as superseded. Into run-jobs/<run>.json and
          # run-jobs/<run>.ios-checks.log.
          mkdir -p run-jobs
          FAILED=$(node tools/release/watch-release.mjs --mode failed-since-success --runs runs.json)
          for RUN in $FAILED; do
            fetch "repos/$REPO/actions/runs/$RUN/jobs" "run-jobs/$RUN.json"
          done
          REFUSALS=$(node tools/release/watch-release.mjs --mode gate-refusals --runs runs.json --run-jobs run-jobs)
          for REFUSAL in $REFUSALS; do
            RUN=${REFUSAL%%:*}
            JOB=${REFUSAL#*:}
            if ! fetch "repos/$REPO/actions/jobs/$JOB/logs" "run-jobs/$RUN.ios-checks.log"; then
              echo "::warning::the ios-checks log of release run $RUN (job $JOB) is unreadable; that run counts as refused at the iOS gate, not superseded."
              rm -f "run-jobs/$RUN.ios-checks.log"
            fi
          done
        fi

        # The two workflows watch each other (watch-release.mjs's header):
        # the peer's state (disabled?) and its newest successful scheduled runs.
        fetch "repos/$REPO/actions/workflows/$PEER" peer-workflow.json
        fetch "repos/$REPO/actions/workflows/$PEER/runs?event=schedule&status=success&per_page=5" peer-runs.json
