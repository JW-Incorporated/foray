name: "ios-archive"
description: >-
  Build, sign (if configured) and upload the iOS shell to TestFlight, using a
  version pair supplied by the caller rather than $(run_number). Factored out
  of ios-build.yml for R-03 (docs/release-lockstep-plan.md) so release.yml and
  the PR-time CI job share one implementation instead of two copies drifting.
  DOES NOT run the simulator/out-point/seam probes — those are ios-build.yml's
  CI concern (see its own header), not release.yml's; a release run's job is
  to ship a build, not to re-measure background-audio behaviour on every tag.
  Callers must `actions/checkout` before invoking this action.

inputs:
  marketing_version:
    description: "X.Y.Z, from tools/mobile/version.mjs marketing-version"
    required: true
  build_number:
    description: "Integer YYYYMMDDnn, from tools/mobile/version.mjs build-number"
    required: true
  ios_dist_cert_p12_base64:
    required: true
  ios_dist_cert_password:
    required: true
  ios_provisioning_profile_base64:
    required: true
  apple_team_id:
    required: true
  app_store_connect_key_id:
    required: true
  app_store_connect_issuer_id:
    required: true
  app_store_connect_private_key_base64:
    required: true
  lab:
    description: >-
      "true" builds the 4a Lab variant (Redesign 2026, docs/redesign-2026/PLAN.md):
      a SEPARATE app, bundle id ai.jwlabs.foura.lab, name "4a Lab", LAB icon, and a
      web bundle that never writes to production. Only .github/workflows/lab-build.yml
      passes it. Anything else leaves the real build exactly as it was.
    required: false
    default: "false"
  app_id:
    description: >-
      The bundle id the provisioning profile and ExportOptions are keyed on. The
      default is the real app's. With lab=true it MUST be ai.jwlabs.foura.lab
      (and with lab=false it MUST be the default): the consistency step below
      refuses a mismatch rather than archive one app under the other's profile.
    required: false
    default: "ai.jwlabs.foura"
  app_name:
    description: >-
      The home-screen name of a lab build ("4a Lab", "4a Tactile", "4a Ambient").
      Only meaningful with lab=true, where it MUST be a "4a <Word>" lab name; with
      lab=false it MUST be left at its default (the consistency step refuses
      anything else). lab-build.yml computes it from the ref and checks that this
      action declares the input, so an older ref fails loudly instead of building
      the wrong name.
    required: false
    default: "4a Lab"

outputs:
  state:
    description: "ready | absent | partial — see tools/mobile/ios-ci.mjs signingReadiness()"
    value: ${{ steps.signing.outputs.state }}
  uploaded:
    description: "true iff the archive/export/upload step actually ran and succeeded"
    value: ${{ steps.upload.outputs.uploaded || steps.upload_absent.outputs.uploaded }}

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Toolchain versions (the first thing to read when this breaks)
      shell: bash
      run: |
        set -euo pipefail
        echo "ART=$RUNNER_TEMP/ios-release" >> "$GITHUB_ENV"
        # A SwiftPM tree at a path this action chooses, rather than one Xcode
        # derives from a hash of the project path: the MinimumOSVersion patch
        # below has to find the downloaded onnxruntime.xcframework, and "wherever
        # DerivedData put it" is not a location a build step can assert against.
        echo "SPM_DIR=$RUNNER_TEMP/ios-spm" >> "$GITHUB_ENV"
        mkdir -p "$RUNNER_TEMP/ios-release"
        { sw_vers; xcodebuild -version; } | tee "$RUNNER_TEMP/ios-release/toolchain.txt"

    - name: Install the shell's dependencies
      # `npm ci`, against the committed mobile/package-lock.json (ci-release-12),
      # exactly as every Android path already does. `npm install` resolves a
      # second tree whenever package.json and the lock disagree, and this is the
      # build a listener installs.
      shell: bash
      working-directory: mobile
      run: |
        set -euo pipefail
        npm ci --no-audit --no-fund

    - name: Lab variant - which app is this? (refuses a lab/app_id mismatch)
      # Runs for BOTH values of `lab` so a real build cannot be handed the lab id
      # and a lab build cannot be handed the real one. With lab=true it then
      # rewrites the CHECKED-OUT mobile/capacitor.config.json (appId, appName) and
      # sets FORAY_LAB=1 for every later step, which is what makes prepare-webdir
      # ship the lab flag. With lab=false it touches nothing.
      shell: bash
      env:
        LAB: ${{ inputs.lab }}
        APP_ID_IN: ${{ inputs.app_id }}
        APP_NAME_IN: ${{ inputs.app_name }}
      run: |
        set -euo pipefail
        case "$LAB" in
          true)
            case "$APP_ID_IN" in
              ai.jwlabs.foura.lab|ai.jwlabs.foura.lab.tactile) ;;
              *) echo "::error::lab=true must build a lab app id (ai.jwlabs.foura.lab or ai.jwlabs.foura.lab.tactile), got app_id '$APP_ID_IN'"; exit 1 ;;
            esac
            node tools/mobile/lab-variant.mjs apply-config mobile/capacitor.config.json --app-id "$APP_ID_IN" --app-name "$APP_NAME_IN"
            echo "FORAY_LAB=1" >> "$GITHUB_ENV"
            ;;
          false)
            if [ "$APP_ID_IN" != "ai.jwlabs.foura" ]; then
              echo "::error::lab=false must build ai.jwlabs.foura, got app_id '$APP_ID_IN'"; exit 1
            fi
            if [ "$APP_NAME_IN" != "4a Lab" ]; then
              echo "::error::lab=false takes no app_name, got '$APP_NAME_IN'"; exit 1
            fi
            ;;
          *) echo "::error::lab must be 'true' or 'false', got '$LAB'"; exit 1 ;;
        esac

    - name: Build the webDir and generate the iOS project
      shell: bash
      working-directory: mobile
      run: |
        set -euo pipefail
        npm run add:ios 2>&1 | tee "$ART/cap-add-ios.log"

    - name: Lab variant - read the identity back out of the generated project
      if: inputs.lab == 'true'
      # Same "green and wrong" guard as the version read-back below: a config edit
      # that did not reach the Xcode project would archive the REAL bundle id under
      # the lab profile. Every PRODUCT_BUNDLE_IDENTIFIER the project declares for the
      # app target must be the lab id, none may be the real one, the display name
      # must be the requested lab name, and the web bundle must carry the flag.
      shell: bash
      env:
        APP_ID_IN: ${{ inputs.app_id }}
        APP_NAME_IN: ${{ inputs.app_name }}
      run: |
        set -euo pipefail
        : "${APP_ID_IN:?}" "${APP_NAME_IN:?}"
        PBX=mobile/ios/App/App.xcodeproj/project.pbxproj
        grep -qF "PRODUCT_BUNDLE_IDENTIFIER = $APP_ID_IN;" "$PBX"           || { echo "::error::the generated project does not declare $APP_ID_IN"; exit 1; }
        if grep -q 'PRODUCT_BUNDLE_IDENTIFIER = ai.jwlabs.foura;' "$PBX"; then
          echo "::error::the generated project still declares the REAL bundle id ai.jwlabs.foura"; exit 1
        fi
        DISPLAY_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" mobile/ios/App/App/Info.plist)
        [ "$DISPLAY_NAME" = "$APP_NAME_IN" ] || { echo "::error::CFBundleDisplayName is '$DISPLAY_NAME', not '$APP_NAME_IN'"; exit 1; }
        grep -q '__FORAY_LAB__' mobile/ios/App/App/public/foray-lab.js           || { echo "::error::the lab bundle has no foray-lab.js flag"; exit 1; }
        grep -q 'foray-lab.js' mobile/ios/App/App/public/index.html           || { echo "::error::index.html does not load foray-lab.js"; exit 1; }

    - name: Fetch the Kokoro weights and put them in the app (K-01/K-06)
      # The same step `.github/workflows/ios-build.yml` runs, and for the same reasons — see that
      # file's copy of this comment. This is the release path: it is what puts
      # the weights into the build a founder actually installs, which is the
      # whole point of K-01 and of HUMAN-ACTIONS.md #45.
      shell: bash
      run: |
        set -euo pipefail
        node tools/mobile/fetch-models.mjs --check
        node tools/mobile/fetch-models.mjs --fetch ios
        node tools/mobile/inject-models.mjs ios mobile/ios/App/App/public
        node tools/mobile/inject-models.mjs ios mobile/ios/App/App/public --check

    - name: Put the seam jingle in the app (NE-34)
      # NOT a SwiftPM resource: a `resources:` on a plugin target makes a
      # resource-bundle target, and this action's signed archive fails on it
      # ("ForayAudio_ForayAudioPlugin does not support provisioning profiles",
      # release run 36535801479). Copied into the public/ folder reference
      # instead, like the weights above; see the script's header.
      shell: bash
      run: |
        set -euo pipefail
        node tools/mobile/inject-interlude.mjs mobile/ios/App/App/public
        node tools/mobile/inject-interlude.mjs mobile/ios/App/App/public --check

    - name: Which Xcode container did Capacitor generate?
      id: xc
      shell: bash
      run: |
        set -euo pipefail
        node tools/mobile/ios-ci.mjs xcode-container mobile/ios | tee "$ART/xcode-container.txt"
        sed -n 's/^xc_flag=/XC_FLAG=/p; s/^xc_path=/XC_PATH=/p; s/^xc_toolchain=/XC_TOOLCHAIN=/p' \
          "$ART/xcode-container.txt" >> "$GITHUB_ENV"

    - name: Assert the generated project did NOT land on the SwiftUI scaffold
      shell: bash
      run: |
        set -euo pipefail
        for bad in ios/App/App ios/App/Podfile ios/App/App.xcodeproj ios/capacitor.config.json; do
          if [ -e "$bad" ]; then echo "Capacitor generated into the SwiftUI scaffold: $bad"; exit 1; fi
        done
        test -f ios/ForayKit/Package.swift

    - name: Add UIBackgroundModes -> audio, and have Apple's parser check it
      shell: bash
      run: |
        set -euo pipefail
        node tools/mobile/inject-background-audio.mjs mobile/ios/App/App/Info.plist
        plutil -lint mobile/ios/App/App/Info.plist
        node tools/mobile/inject-background-audio.mjs mobile/ios/App/App/Info.plist --check

    - name: Declare no non-exempt encryption, and have Apple's parser check it
      shell: bash
      run: |
        set -euo pipefail
        node tools/mobile/inject-background-audio.mjs mobile/ios/App/App/Info.plist --encryption false
        plutil -lint mobile/ios/App/App/Info.plist
        node tools/mobile/inject-background-audio.mjs mobile/ios/App/App/Info.plist --check --encryption false

    - name: Add the privacy manifest (Required Reason APIs), and have Apple's parser check it
      # Issue #948: THIS is the path App Store review sees. A binary that uses a
      # Required Reason API without a declaring PrivacyInfo.xcprivacy is rejected
      # at submission (ITMS-91053); TestFlight only warns. Same step as
      # ios-build.yml's; the evidence is in tools/mobile/inject-privacy-manifest.mjs.
      shell: bash
      run: |
        set -euo pipefail
        node tools/mobile/inject-privacy-manifest.mjs mobile/ios/App
        plutil -lint mobile/ios/App/App/PrivacyInfo.xcprivacy
        plutil -lint mobile/ios/App/App.xcodeproj/project.pbxproj
        node tools/mobile/inject-privacy-manifest.mjs mobile/ios/App --check

    - name: Put the REAL app icon in the generated asset catalog
      shell: bash
      run: |
        set -euo pipefail
        node tools/mobile/inject-app-icon.mjs mobile/ios/App/App/Assets.xcassets/AppIcon.appiconset
        node tools/mobile/inject-app-icon.mjs mobile/ios/App/App/Assets.xcassets/AppIcon.appiconset --check

    - name: Lab variant - replace the icon with today's icon wearing a LAB band
      if: inputs.lab == 'true'
      shell: bash
      run: |
        set -euo pipefail
        node tools/mobile/lab-variant.mjs icon "$RUNNER_TEMP/lab-icon-1024.png"
        node tools/mobile/inject-app-icon.mjs mobile/ios/App/App/Assets.xcassets/AppIcon.appiconset --source "$RUNNER_TEMP/lab-icon-1024.png"
        node tools/mobile/inject-app-icon.mjs mobile/ios/App/App/Assets.xcassets/AppIcon.appiconset --check --source "$RUNNER_TEMP/lab-icon-1024.png"

    - name: Put the REAL splash screen in the generated asset catalog
      shell: bash
      run: |
        set -euo pipefail
        node tools/mobile/inject-splash.mjs ios mobile/ios/App/App/Assets.xcassets/Splash.imageset
        node tools/mobile/inject-splash.mjs ios mobile/ios/App/App/Assets.xcassets/Splash.imageset --check

    - name: Give the embedded ONNX Runtime framework the MinimumOSVersion Apple requires
      # THIS IS THE PATH THAT FAILED. Release run 34739630705 (build 2026091315,
      # main @ ad732eb) archived and exported cleanly and then died in
      # `xcrun altool --upload-app`:
      #
      #   Missing Info.plist value. A value for the key 'MinimumOSVersion' in
      #   bundle App.app/Frameworks/onnxruntime.framework is required. (90360)
      #
      # The key is absent from Microsoft's own xcframework slice — see
      # `tools/mobile/ios-embedded-frameworks.mjs` for the evidence, for why
      # patching a binary dependency's metadata is a WORKAROUND, and for the two
      # things that would remove it.
      #
      # `ios-build.yml` runs the same step, and running it there is not enough:
      # that workflow builds but never archives and never uploads, so it was
      # green for this defect all the way to Apple. The founder's TestFlight
      # artifact comes from HERE.
      #
      # BEFORE the archive, deliberately: nothing is signed yet, so Xcode embeds
      # an already-correct plist and signs it itself. Patching the archive would
      # break the framework's seal and the app's with it.
      shell: bash
      run: |
        set -euo pipefail
        xcodebuild "$XC_FLAG" "$XC_PATH" -scheme App \
          -clonedSourcePackagesDirPath "$SPM_DIR" \
          -resolvePackageDependencies > "$ART/spm-resolve.log" 2>&1 \
          || { tail -50 "$ART/spm-resolve.log"; exit 1; }
        # Read the deployment target off the project rather than hardcoding it: a
        # framework may declare an OLDER floor than the app but never a newer one,
        # and the verify step below asserts exactly that relationship.
        xcodebuild "$XC_FLAG" "$XC_PATH" -scheme App -configuration Release \
          -sdk iphoneos -clonedSourcePackagesDirPath "$SPM_DIR" \
          -showBuildSettings > "$ART/build-settings.txt" 2>/dev/null
        # `head -1` takes the scheme's own target, which xcodebuild prints first.
        # If that ever stops being true the value lands too HIGH and the verify
        # step below says so by name — it is not a silent wrong answer.
        MIN_OS=$(sed -n 's/^ *IPHONEOS_DEPLOYMENT_TARGET = //p' "$ART/build-settings.txt" | head -1)
        test -n "$MIN_OS"
        echo "IPHONEOS_DEPLOYMENT_TARGET is $MIN_OS"
        # The failure mode worth printing for: the patcher REFUSES to report
        # success when it found nothing to patch, and the only reason that
        # happens is the resolved artifact not being where we pointed it. Print
        # the tree so the next reader can see where Xcode actually put it.
        node tools/mobile/ios-embedded-frameworks.mjs patch "$SPM_DIR" --min-os "$MIN_OS" \
          | tee "$ART/framework-plist-patch.txt" \
          || { echo "::group::$SPM_DIR"; find "$SPM_DIR" -maxdepth 4 -type d; echo "::endgroup::"; exit 1; }
        # Apple's own parser on our output, the second opinion every other plist
        # edit in this action gets.
        find "$SPM_DIR" -name Info.plist -path "*.framework/*" -print0 | xargs -0 -n1 plutil -lint

    - name: Is signing configured?
      id: signing
      shell: bash
      env:
        IOS_DIST_CERT_P12_BASE64: ${{ inputs.ios_dist_cert_p12_base64 }}
        IOS_DIST_CERT_PASSWORD: ${{ inputs.ios_dist_cert_password }}
        IOS_PROVISIONING_PROFILE_BASE64: ${{ inputs.ios_provisioning_profile_base64 }}
        APPLE_TEAM_ID: ${{ inputs.apple_team_id }}
        APP_STORE_CONNECT_KEY_ID: ${{ inputs.app_store_connect_key_id }}
        APP_STORE_CONNECT_ISSUER_ID: ${{ inputs.app_store_connect_issuer_id }}
        APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ inputs.app_store_connect_private_key_base64 }}
      # `state=absent` exits 0 and stops the upload below; `state=partial` exits
      # 1 and fails this whole job — see tools/mobile/ios-ci.mjs signingReadiness().
      run: node tools/mobile/ios-ci.mjs signing-gate

    # THREE STEPS, NOT ONE, AND NONE OF THE SECRET-HOLDING ONES WRITES INTO $ART
    # (round-3 review of ci-release-13). $ART is uploaded as an artifact, and on
    # this PUBLIC repo any signed-in user can download it. GitHub masks secrets in
    # the console log only, never in artifact files, and never a transformed
    # (e.g. base64-decoded) value. So a process whose environment holds the p12,
    # its password or the App Store Connect key must not write anything that
    # lands under $ART:
    #   1. archive and sign     - certificate + profile, no ASC key, no $ART
    #   2. verify the archive   - NO secrets; its report goes into $ART
    #   3. export and upload    - ASC key only; altool's log is written OUTSIDE
    #                             $ART, and step 4 copies a redacted version in.
    # Each step also holds only the credentials it uses. The keychain made in
    # step 1 stays unlocked (-lut 3600) and on the search list for step 3's export.
    - name: Archive and sign (certificate and profile; no App Store Connect key)
      id: archive
      if: steps.signing.outputs.ready == 'true'
      shell: bash
      env:
        IOS_DIST_CERT_P12_BASE64: ${{ inputs.ios_dist_cert_p12_base64 }}
        IOS_DIST_CERT_PASSWORD: ${{ inputs.ios_dist_cert_password }}
        IOS_PROVISIONING_PROFILE_BASE64: ${{ inputs.ios_provisioning_profile_base64 }}
        APPLE_TEAM_ID: ${{ inputs.apple_team_id }}
        MARKETING_VERSION: ${{ inputs.marketing_version }}
        BUILD_NUMBER: ${{ inputs.build_number }}
        APP_ID: ${{ inputs.app_id }}
      run: |
        set -euo pipefail
        KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
        KEYCHAIN_PASSWORD=$(uuidgen)
        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
        security set-keychain-settings -lut 3600 "$KEYCHAIN"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
        echo "$IOS_DIST_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
        security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$IOS_DIST_CERT_PASSWORD" \
          -T /usr/bin/codesign -A
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
        security list-keychains -d user -s "$KEYCHAIN"

        PROFILES="$HOME/Library/MobileDevice/Provisioning Profiles"
        mkdir -p "$PROFILES"
        echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILES/foray.mobileprovision"
        security cms -D -i "$PROFILES/foray.mobileprovision" > "$RUNNER_TEMP/profile.plist"
        export PROFILE_UUID
        PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/profile.plist")

        XC_PROFILES="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
        mkdir -p "$XC_PROFILES"
        cp "$PROFILES/foray.mobileprovision" "$XC_PROFILES/$PROFILE_UUID.mobileprovision"

        node -e '
          const fs = require("node:fs");
          fs.writeFileSync(process.argv[1],
            `<?xml version="1.0" encoding="UTF-8"?>\n` +
            `<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n` +
            `<plist version="1.0"><dict>` +
            `<key>method</key><string>app-store-connect</string>` +
            `<key>teamID</key><string>${process.env.APPLE_TEAM_ID}</string>` +
            `<key>uploadSymbols</key><true/>` +
            `<key>signingStyle</key><string>manual</string>` +
            `<key>provisioningProfiles</key><dict>` +
            `<key>${process.env.APP_ID}</key><string>${process.env.PROFILE_UUID}</string>` +
            `</dict>` +
            `</dict></plist>\n`);
        ' "$RUNNER_TEMP/ExportOptions.plist"
        plutil -lint "$RUNNER_TEMP/ExportOptions.plist"

        # BUILD_NUMBER COMES FROM tools/mobile/version.mjs, NOT run_number.run_attempt.
        # R-02's whole point is one release-time integer shared with Android's
        # versionCode; a per-run counter here would reintroduce the exact
        # "two workflows, two numbers" defect R-02 retired. Refusing 1/1.* stays
        # as a floor: ios-build.yml's own history (ERROR -19232) is why a build
        # number this low can never be safely re-uploaded.
        case "$BUILD_NUMBER" in 1|1.*) echo "::error::refusing to archive at build number $BUILD_NUMBER"; exit 1 ;; esac

        xcodebuild "$XC_FLAG" "$XC_PATH" -scheme App -configuration Release \
          -sdk iphoneos -destination 'generic/platform=iOS' \
          -archivePath "$RUNNER_TEMP/Foray.xcarchive" \
          -clonedSourcePackagesDirPath "$SPM_DIR" \
          CODE_SIGN_STYLE=Manual \
          MARKETING_VERSION="$MARKETING_VERSION" \
          CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
          DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
          PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
          CODE_SIGN_IDENTITY="Apple Distribution" \
          archive | tail -20

        # READ BOTH VERSION FIELDS BACK OUT OF THE ARCHIVE, with Apple's own
        # parser, exactly as ios-build.yml's original step does for
        # CFBundleVersion — a build-setting override that silently does not
        # reach the bundle is this repo's "green and wrong" failure shape.
        ARCHIVED_PLIST="$RUNNER_TEMP/Foray.xcarchive/Products/Applications/App.app/Info.plist"
        test -f "$ARCHIVED_PLIST"
        BUILT_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$ARCHIVED_PLIST")
        BUILT_MARKETING=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$ARCHIVED_PLIST")
        if [ "$BUILT_VERSION" != "$BUILD_NUMBER" ]; then
          echo "::error::CFBundleVersion in the archive is '$BUILT_VERSION', not '$BUILD_NUMBER'."
          exit 1
        fi
        if [ "$BUILT_MARKETING" != "$MARKETING_VERSION" ]; then
          echo "::error::CFBundleShortVersionString in the archive is '$BUILT_MARKETING', not '$MARKETING_VERSION'."
          exit 1
        fi

    - name: Read the embedded frameworks back out of the archive (no secrets in this step)
      if: steps.signing.outputs.ready == 'true'
      shell: bash
      run: |
        set -euo pipefail
        # READ THE EMBEDDED FRAMEWORKS BACK OUT OF THE ARCHIVE, for the same
        # reason the two version fields are read back above: a step that edits a
        # build input and silently does not reach the bundle is this repo's
        # "green and wrong" failure shape, and for THIS input the place it
        # surfaces is 90 seconds into `altool`, after a full archive and export.
        # Every key App Store Connect requires of an embedded framework is
        # asserted here, on the bundle that is about to be uploaded.
        node tools/mobile/ios-embedded-frameworks.mjs verify \
          "$RUNNER_TEMP/Foray.xcarchive/Products/Applications/App.app" \
          | tee "$ART/embedded-frameworks.txt"

    - name: Read the privacy manifest back out of the archive (no secrets in this step)
      if: steps.signing.outputs.ready == 'true'
      shell: bash
      run: |
        set -euo pipefail
        # Issue #948, on the bundle that is about to be uploaded: the manifest is
        # at the root of App.app and declares what tools/mobile/inject-privacy-
        # manifest.mjs declares. A project edit that did not reach the archive
        # surfaces here, not in App Store review.
        node tools/mobile/inject-privacy-manifest.mjs --bundle \
          "$RUNNER_TEMP/Foray.xcarchive/Products/Applications/App.app" \
          | tee "$ART/privacy-manifest-bundle.txt"

    - name: Export and upload to TestFlight (App Store Connect key only)
      id: upload
      if: steps.signing.outputs.ready == 'true'
      shell: bash
      env:
        APP_STORE_CONNECT_KEY_ID: ${{ inputs.app_store_connect_key_id }}
        APP_STORE_CONNECT_ISSUER_ID: ${{ inputs.app_store_connect_issuer_id }}
        APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ inputs.app_store_connect_private_key_base64 }}
      run: |
        set -euo pipefail
        mkdir -p "$HOME/.appstoreconnect/private_keys"
        echo "$APP_STORE_CONNECT_PRIVATE_KEY_BASE64" | base64 --decode \
          > "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

        xcodebuild -exportArchive \
          -archivePath "$RUNNER_TEMP/Foray.xcarchive" \
          -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
          -exportPath "$RUNNER_TEMP/export" | tail -20
        # RETRY THE UPLOAD, AND ONLY THE UPLOAD.
        #
        # FOUNDER, 2026-09-22: "these releases are usually quite rocky and fail
        # on a somewhat regular basis." Three of the first twenty-four release
        # runs failed and ALL THREE were partial — one store got the build and
        # the other did not. The one with a readable cause is run 35672098914:
        # the archive was built, signed, exported and version-verified, and then
        # Apple's ingestion server answered
        #
        #   CREATE BUILD (ASSET_UPLOAD): received status code 500 (500)
        #
        # once. A single 500 from someone else's server threw away a completed
        # archive, failed the release, and left Play on a build TestFlight never
        # received — which nobody noticed for sixteen hours.
        #
        # The archive already exists by this line, so another attempt costs
        # seconds rather than a rebuild. That is the whole reason the retry
        # belongs HERE and not around the job.
        #
        # WHY THE DECISION IS A MODULE. "Retry three times" is the wrong rule: a
        # binary Apple REFUSES — duplicate build number, bad entitlement, invalid
        # signature — is refused three more times, and the real reason ends up as
        # the fourth copy of itself in the log. `tools/release/upload-retry.mjs`
        # holds that discrimination and is tested against the verbatim output
        # above; the loop stays here so a reader of the run log can see it.
        #
        # THE PARSE IS `sed`, NOT `eval`. Evaluating a child process's stdout as
        # shell is not something this repo should start doing inside the one step
        # a signing key passes through, and the three values are numbers and one
        # lower-case word.
        #
        # FAILS CLOSED, DELIBERATELY. If the classifier cannot run at all, RETRY
        # is empty, the `!= 1` test fires, and the step behaves exactly as it did
        # before this block existed. A broken retry must not be able to invent a
        # successful upload, and `while [ "$attempt" -le 5 ]` is a hard ceiling in
        # case the module ever stops saying no.
        # OUTSIDE $ART: this step holds the ASC key. The next step copies a
        # redacted version in, from a step that holds nothing.
        UPLOAD_LOG="$RUNNER_TEMP/altool-upload.log"
        attempt=1
        uploaded=no
        while [ "$attempt" -le 5 ]; do
          echo "--- xcrun altool --upload-app: attempt $attempt"
          set +e
          xcrun altool --upload-app -f "$RUNNER_TEMP/export/App.ipa" -t ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            2>&1 | tee "$UPLOAD_LOG"
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -eq 0 ]; then
            uploaded=yes
            break
          fi
          VERDICT=$(node tools/release/upload-retry.mjs classify "$UPLOAD_LOG" "$attempt" || true)
          RETRY=$(printf '%s' "$VERDICT" | sed -n 's/.*RETRY=\([01]\).*/\1/p')
          REASON=$(printf '%s' "$VERDICT" | sed -n 's/.*REASON=\([a-z]*\).*/\1/p')
          WAIT=$(printf '%s' "$VERDICT" | sed -n 's/.*SLEEP=\([0-9]*\).*/\1/p')
          if [ "$RETRY" != "1" ]; then
            echo "::error::TestFlight upload failed on attempt $attempt and will not be retried (${REASON:-unclassified}). See altool-upload.log in this job's artifacts."
            exit 1
          fi
          echo "::warning::TestFlight upload failed on attempt $attempt (${REASON:-unclassified}); retrying in ${WAIT:-60}s."
          sleep "${WAIT:-60}"
          attempt=$((attempt + 1))
        done
        if [ "$uploaded" != "yes" ]; then
          echo "::error::TestFlight upload did not succeed within the attempt budget."
          exit 1
        fi
        echo "uploaded=true" >> "$GITHUB_OUTPUT"

    - name: Copy a redacted altool log into the release logs (no secrets in this step)
      if: always() && steps.signing.outputs.ready == 'true'
      shell: bash
      # Drops any PEM block and blanks every run of 40+ base64 characters: the
      # shapes a leaked .p8 or its base64 would take. altool's own output
      # (status lines, UUIDs, Apple's error text) survives, which is what the
      # upload step's "see altool-upload.log" needs.
      run: |
        set -uo pipefail
        LOG="$RUNNER_TEMP/altool-upload.log"
        if [ -f "$LOG" ]; then
          sed -E -e '/-----BEGIN [A-Z ]*PRIVATE KEY-----/,/-----END [A-Z ]*PRIVATE KEY-----/d' \
                 -e 's#[A-Za-z0-9+/=]{40,}#[redacted]#g' "$LOG" > "$ART/altool-upload.log"
        fi

    - name: Record 'not uploaded' when signing was not ready
      id: upload_absent
      if: steps.signing.outputs.ready != 'true'
      shell: bash
      run: echo "uploaded=false" >> "$GITHUB_OUTPUT"

    # ci-release-13: the upload step's error tells the reader to "see
    # altool-upload.log in this job's artifacts", and until this step there
    # were no artifacts. `if: always()` because the failing run is the one
    # whose logs matter. $ART ($RUNNER_TEMP/ios-release) holds ONLY logs and
    # text reports: the .p12, the keychain, the provisioning profile, the
    # ExportOptions plist and the App Store Connect .p8 are all written
    # elsewhere ($RUNNER_TEMP/*, $HOME/.appstoreconnect) and never into it.
    # tools/mobile/release-workflow.test.mjs pins that nothing secret is
    # written under $ART. Short retention: these are for the morning after.
    - name: Keep the release logs (altool-upload.log, toolchain, SwiftPM resolve)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ios-release-logs-${{ github.run_attempt }}
        path: ${{ runner.temp }}/ios-release
        if-no-files-found: ignore
        retention-days: 14
