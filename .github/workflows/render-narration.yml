# Render Foray narration centrally — NO credentials, NO upload.
#
# docs/plans/spark-central-narration-assessment.md §3.2 and §5 Phase 1 (rulings
# D1-D11 accepted by the founder 2026-09-28). Kokoro-82M fp32 on the CPU renders
# every narration line of the named Forays in Heart and Echo, loudness-normalized
# and encoded AAC-LC .m4a 64 kbps mono (tools/narration/render-foray.py), and the
# output directory + manifest is uploaded as a workflow ARTIFACT (30 days).
#
# WHAT THIS WORKFLOW NEVER DOES: write to R2. Rendering needs no secret, so it
# may run here; the upload to the public `foray-narration` bucket happens only on
# a machine where the founder placed a write token (the PC in Phase 1), with
# tools/narration/upload-narration.mjs, which refuses to run under CI. This file
# references no `secrets.*`, and its token is read-only (`contents: read`).
# espeak-ng (GPL) runs here, server-side, and never enters an app build.
#
# Triggers:
#   - workflow_dispatch: `forays` = comma-separated Foray ids, or @drafts
#     (every narrated draft); `smoke` renders the 2 shortest lines only.
#   - push to render/**: renders @drafts, so a branch named render/<anything>
#     is a one-command re-render before this file reaches the default branch
#     (render/<anything>-smoke renders --smoke only).
#
# The founder's PC is memory-constrained, which is why renders run here and not
# there. Why Heart and Echo are two matrix legs: each loads its own ~1.3 GB fp32
# session and they halve the wall time; the `collect` job merges both into the
# one `narration-render` artifact upload-narration.mjs and stamp-narration.mjs
# read (manifests are per voice, keys are per voice, so nothing collides).

name: render-narration

on:
  workflow_dispatch:
    inputs:
      forays:
        description: "Comma-separated Foray ids from data/forays.json, or @drafts"
        required: true
        default: "@drafts"
      smoke:
        description: "Smoke only: the 2 shortest lines of the first Foray"
        type: boolean
        default: false
  push:
    branches:
      - "render/**"

permissions:
  contents: read

concurrency:
  group: render-narration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: render (${{ matrix.voice }})
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        voice: [af_heart, am_echo]
    env:
      # Inputs reach the shell through env, never through ${{ }} in a script.
      FORAYS: ${{ inputs.forays || '@drafts' }}
      # A render/** branch whose name ends in -smoke runs --smoke too.
      SMOKE: ${{ (inputs.smoke || endsWith(github.ref_name, '-smoke')) && '--smoke' || '' }}
      VOICE: ${{ matrix.voice }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System tools (espeak-ng, ffmpeg)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg
          ffmpeg -hide_banner -encoders 2>/dev/null | grep -E '^ A\S* aac ' || { echo "ffmpeg has no native aac encoder"; exit 1; }

      - name: Model pins are consistent (no download)
        run: node tools/mobile/fetch-models.mjs --check

      - name: Weights cache (fp32 model + voices, sha256-checked on use)
        uses: actions/cache@v4
        with:
          path: data-local/narration-weights
          key: narration-weights-${{ hashFiles('tools/mobile/fetch-models.mjs', 'tools/narration/render-profile.json') }}

      - name: Python deps (uv; CPU torch so misaki's spaCy extra does not pull CUDA)
        run: |
          python -m pip install --quiet uv
          uv venv --seed --python 3.12 .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          uv pip install --python .venv/bin/python --quiet torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install --python .venv/bin/python --quiet -r tools/narration/requirements.txt

      - name: Check
        run: python tools/narration/render-foray.py --check

      - name: Render
        run: |
          set -o pipefail
          mkdir -p out
          python tools/narration/render-foray.py \
            --forays "$FORAYS" --voices "$VOICE" $SMOKE \
            --out out --manifest "out/manifest-$VOICE.json" 2>&1 | tee "out/render-$VOICE.log"

      - name: Summary
        if: always()
        run: |
          if [ -f "out/manifest-$VOICE.json" ]; then
            python tools/narration/render-foray.py --report "out/manifest-$VOICE.json" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No manifest was written for $VOICE." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload artifact (this voice)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: narration-${{ matrix.voice }}
          path: out/
          if-no-files-found: warn
          retention-days: 30

  collect:
    name: collect (narration-render)
    needs: render
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: narration-*
          merge-multiple: true
          path: narration-render

      - name: List
        run: |
          find narration-render -type f -name '*.m4a' | wc -l
          du -sh narration-render || true
          ls -la narration-render

      - uses: actions/upload-artifact@v4
        with:
          name: narration-render
          path: narration-render
          if-no-files-found: error
          retention-days: 30
