# One policy, both merge paths.
#
# WHY (2026-08-16). The allow/deny path lists lived inside
# `automerge-nightly.yml`, so they described what the Actions auto-merge job
# would do and nothing else. On 2026-08-16 two PRs were merged from a laptop
# with `gh pr merge` and a founder token and walked straight past the deny-list
# — not by defeating it, but because on that path there was nothing to defeat.
# The policy is now `tools/ci/path-policy.mjs`, and this workflow reports it as
# a status check on EVERY pull request, so the same rule is visible on every
# route to `main`.
#
# ── BE HONEST ABOUT WHAT THIS BUYS ───────────────────────────────────────────
#
# A required status check constrains automation and ordinary merges. It does
# NOT stop a repo admin with a token: both founders have admin, and admin
# override of a required check is a supported GitHub operation. So this is
# VISIBILITY AND CONSISTENCY, not a lock. Anyone who bypasses it leaves a
# visible trace on the PR instead of leaving none.
#
# And the corollary, stated rather than hidden: the check is satisfied by a
# LABEL (`founder-approved`), and an agent with write access to this repo can
# apply a label. So if an agent can satisfy it, it is not a guardrail against
# an agent — it is a guardrail against an ACCIDENT, and a record of intent. The
# thing that actually makes it a founder gate is that the founders are the ones
# who agree to apply it and agents are instructed not to. That is a norm with a
# receipt, not a wall. Anything stronger needs a human-only signal a token
# cannot produce (a CODEOWNERS review from a protected team, or a merge queue
# fed by a separate identity), and that is a bigger change than this one — see
# the recommendation in the PR that introduced this file.
#
# ── HOW IT BEHAVES ───────────────────────────────────────────────────────────
#
#   CLEAN       the PR touches nothing in DENIED_PREFIXES -> green.
#   APPROVED    it does, and carries `founder-approved` -> green.
#   UNAPPROVED  it does, and does not.
#                 - default: GREEN, with a loud summary. Report-only.
#                 - with repo variable PATH_POLICY_ENFORCE set: RED.
#
# Report-only is the shipped default deliberately. Landing this enforcing would
# turn every in-flight `.github/`, `CLAUDE.md` and `docs/adr/` PR red on the day
# it merged, before anyone had agreed the check should block — and a red check
# nobody agreed to is how a check gets ignored. The owner flips one repo
# variable to make it bite (HUMAN-ACTIONS.md #1), and marks it required in the
# same sitting. Until then it is a report, and it says so on its own face.
#
# NOTE it is deliberately NOT a job inside `ci.yml`. This must re-evaluate when
# a label is added or removed — that is the whole approval mechanism — and
# adding `labeled`/`unlabeled` to ci.yml's triggers would re-run the macOS
# `ios-kit` job on every label change.
#
# UNLISTED paths (neither allowed nor denied) are NOT a failure here. They mean
# "auto-merge will not touch this", which is normal for most human PRs; failing
# on them would block ordinary work for no safety gain.

name: path-policy

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: path-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  path-policy:
    runs-on: ubuntu-latest
    steps:
      # The policy is read from the BASE, not from this PR, for the same reason
      # automerge-nightly.yml does it: a PR must not be able to rewrite the rule
      # that judges it. `tools/ci/` is a DENIED path precisely so that rewriting
      # it requires a human merge first.
      - name: Check out the policy from the base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: tools/ci
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Gather PR facts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # REST + --paginate: `gh pr view --json files` truncates at 100.
          gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename' > changed-files.txt
          # Read labels live rather than from the event payload — a PR opened
          # before the founder labels it must go green on the `labeled` re-run.
          gh pr view "$PR" --repo "$REPO" --json labels --jq '.labels[].name' > pr-labels.txt

      - name: Evaluate
        env:
          ENFORCE: ${{ vars.PATH_POLICY_ENFORCE }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          enforce=""
          case "$(printf '%s' "${ENFORCE:-}" | tr '[:upper:]' '[:lower:]')" in
            ""|false|0|no|off) enforce="" ;;
            *) enforce="--enforce" ;;
          esac
          node tools/ci/path-policy.mjs check \
            --files-from changed-files.txt \
            --labels-from pr-labels.txt \
            --pr "$PR" \
            $enforce \
            --summary "$GITHUB_STEP_SUMMARY"
