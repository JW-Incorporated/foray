# Auto-merge bot CONTENT PRs once their required checks pass — and, when it
# does not, say plainly why.
#
# Why this exists (2026-07-24): content PRs used to sit open awaiting a human
# merge, and in Swift2 the cloud agents babysat them with hourly self-check-in
# sessions — ~69% of ALL scheduled agent token spend, ~144 sessions/day whose
# entire output was "still open, still green, re-arm in 1h". Auto-merge deletes
# the thing they were waiting for, at zero token cost. See CLAUDE.md § Never
# babysit your own PR.
#
# THE SAFETY MODEL IS PATH-BASED, NOT BRANCH-NAME-BASED (starter-kit, 2026-08-11).
# This file previously gated on `startsWith(github.head_ref, 'nightly/')` alone,
# which was wrong in two directions and both mattered:
#   - Too loose: a bot can name its branch anything. Any PR from a `nightly/*`
#     branch auto-merged on green REGARDLESS of what it touched — app.js, CI
#     workflows, backend/. A bot cannot make app code look like a data file,
#     but it can absolutely name a branch `nightly/`.
#   - Too tight: the classification runners open `classify/*` branches, so their
#     PRs never auto-merged at all. PR #86 sat open for 8 days for this reason.
# Gating on paths fixes both. If a PR touches even one file outside
# ALLOWED_PREFIXES, this job does nothing and the PR waits for a human — the
# fail-safe direction.
#
# This only ENABLES auto-merge. `protect-main` still requires `backend` and
# `data-and-site` to pass, so a red PR never merges.
#
# Two escape hatches, both needed before a large fan-out:
#   - Label a PR `hold` or `founder-decision` to stop that one.
#   - Set repo variable AUTOMERGE_FREEZE to halt ALL of it instantly, with no
#     PR and no deploy needed. This is the kill switch for a runaway army.
#
# ── WHAT CHANGED ON 2026-08-16, AND WHY ──────────────────────────────────────
#
# 1. THE JOB IS NO LONGER CALLED `enable-automerge`. PR #175 reported a GREEN
#    check named `enable-automerge` while auto-merge was never armed — the name
#    promised an action and delivered a job status, which is worse than no check
#    at all because it reads as reassurance. The job is now `automerge-decision`
#    and its FIRST line of output is ARMED or NOT ARMED, with the reason.
#    Renaming a check is a visible event: `enable-automerge` will show as a
#    stale/absent context on any PR opened before this lands. It is not in
#    `protect-main`'s required list, so nothing is blocked by its disappearance.
#
# 2. THE POLICY MOVED OUT OF THIS FILE. The allow/deny lists and the matcher are
#    now `tools/ci/path-policy.mjs`, with a real test suite. They used to be two
#    heredocs and a hand-rolled `case`-glob loop that nothing could unit-test,
#    and — because they lived inside this job — they governed only what Actions
#    does. Two PRs were merged from a laptop with `gh pr merge` and a founder
#    token and walked straight past the deny-list. `.github/workflows/
#    path-policy.yml` now evaluates the same policy as a status check on every
#    PR; see its header for the honest limit of what that buys.
#
# 3. THIS JOB NOW CHECKS OUT CODE — AND IT MUST BE THE BASE, NEVER THE HEAD.
#    The previous version noted, correctly, that it contained no `actions/
#    checkout` and therefore never executed PR-authored code while holding a
#    `contents: write` + `pull-requests: write` token. Calling a module means
#    checking something out, so it checks out `base.sha` — the tip of `main`
#    that the PR targets — with a sparse checkout of `tools/ci` and no persisted
#    credentials. A PR CANNOT influence the policy that judges it: to change the
#    policy you must first merge a change to `tools/ci/`, which is a DENIED path
#    and therefore needs a human. That deny entry is what makes this safe;
#    do not remove it.

name: automerge-nightly

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  issues: write # labels are an issues-API resource

concurrency:
  group: automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # The check name a reader sees. "decision", not "enable": green means a
  # decision was reached and recorded, not that anything will merge.
  automerge-decision:
    # The fork clause is new (2026-08-16): every write below needs a write
    # token and a `pull_request` from a fork gets a read-only one, so this job
    # could only ever have failed on one. Skipping says "not applicable"; the
    # red job it replaces said "CI is broken".
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # BASE, not head. See point 3 in the header — this is the whole reason it
      # is safe for this job to run code at all.
      - name: Check out the policy from main (never from the PR)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: tools/ci
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Gather PR facts
        id: facts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # REST + --paginate, NOT `gh pr view --json files`: that one is a
          # single GraphQL page capped at 100 files, so a large PR would report
          # a truncated list and this job could arm on a diff whose 101st file
          # is `.github/workflows/ci.yml`. Truncation that fails OPEN is the one
          # failure mode a path allowlist cannot survive.
          gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename' > changed-files.txt
          gh pr view "$PR" --repo "$REPO" --json labels --jq '.labels[].name'  > pr-labels.txt
          echo "changed files: $(wc -l < changed-files.txt)"

      - name: Decide
        id: decide
        env:
          FREEZE: ${{ vars.AUTOMERGE_FREEZE }}
          PR: ${{ github.event.pull_request.number }}
        # Exits 0 whether or not it arms: "not armed" is a decision, and a red
        # check here would be indistinguishable from CI actually failing.
        run: |
          node tools/ci/path-policy.mjs decide \
            --files-from changed-files.txt \
            --labels-from pr-labels.txt \
            --freeze "${FREEZE:-}" \
            --pr "$PR" \
            --base main \
            --summary "$GITHUB_STEP_SUMMARY" \
            --github-output "$GITHUB_OUTPUT"

      - name: Enable auto-merge
        if: steps.decide.outputs.armed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: gh pr merge "$PR" --repo "$REPO" --squash --auto --delete-branch

      # NOTE: the `needs-founder` queue label is deliberately NOT written here,
      # even though `steps.decide.outputs.needs_founder` says exactly what it
      # should be. `pr-hygiene.yml` is its single writer.
      #
      # Two writers would oscillate. This job cannot see mergeability, so it
      # would queue a CONFLICTING PR to a founder; pr-hygiene deliberately does
      # not (a conflict needs the author, not an approval) and would remove the
      # label again. Each write fires a `labeled`/`unlabeled` event, which this
      # workflow listens to, so the pair would trade the label back and forth
      # for several runs before settling — noise, and a queue that reads
      # differently depending on which workflow ran last. One writer, one truth.
      # The output above stays because it is genuinely useful in the log.
