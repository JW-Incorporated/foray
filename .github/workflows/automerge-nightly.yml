# Auto-merge bot CONTENT PRs once their required checks pass — and, when it
# does not, say plainly why, and take the arming back off.
#
# Why this exists (2026-07-24): content PRs used to sit open awaiting a human
# merge, and in Swift2 the cloud agents babysat them with hourly self-check-in
# sessions — ~69% of ALL scheduled agent token spend, ~144 sessions/day whose
# entire output was "still open, still green, re-arm in 1h". Auto-merge deletes
# the thing they were waiting for, at zero token cost. See CLAUDE.md § Never
# babysit your own PR.
#
# THE SAFETY MODEL IS PATH-BASED, NOT BRANCH-NAME-BASED (starter-kit, 2026-08-11).
# This file previously gated on `startsWith(github.head_ref, 'nightly/')` alone,
# which was wrong in two directions and both mattered:
#   - Too loose: a bot can name its branch anything. Any PR from a `nightly/*`
#     branch auto-merged on green REGARDLESS of what it touched — app.js, CI
#     workflows, backend/. A bot cannot make app code look like a data file,
#     but it can absolutely name a branch `nightly/`.
#   - Too tight: the classification runners open `classify/*` branches, so their
#     PRs never auto-merged at all. PR #86 sat open for 8 days for this reason.
# Gating on paths fixes both. If a PR touches even one file outside
# ALLOWED_PREFIXES, this job does nothing and the PR waits for a human — the
# fail-safe direction.
#
# This only ENABLES auto-merge. `protect-main` still requires `backend` and
# `data-and-site` to pass, so a red PR never merges.
#
# Two escape hatches, both needed before a large fan-out:
#   - Label a PR `hold` or `founder-decision` to stop that one.
#   - Set repo variable AUTOMERGE_FREEZE to halt ALL of it instantly, with no
#     PR and no deploy needed. This is the kill switch for a runaway army.
#     It only reaches ALREADY-ARMED PRs via the pr-hygiene sweep — see point 4.
#
# ── WHAT CHANGED ON 2026-08-16, AND WHY ──────────────────────────────────────
#
# 1. THE JOB IS NO LONGER CALLED `enable-automerge`. PR #175 reported a GREEN
#    check named `enable-automerge` while auto-merge was never armed — the name
#    promised an action and delivered a job status, which is worse than no check
#    at all because it reads as reassurance. The job is now `automerge-decision`
#    and its FIRST line of output is ARMED or NOT ARMED, with the reason.
#    Renaming a check is a visible event: `enable-automerge` will show as a
#    stale/absent context on any PR opened before this lands. It is not in
#    `protect-main`'s required list, so nothing is blocked by its disappearance.
#
# 2. THE POLICY MOVED OUT OF THIS FILE. The allow/deny lists and the matcher are
#    now `tools/ci/path-policy.mjs`, with a real test suite. They used to be two
#    heredocs and a hand-rolled `case`-glob loop that nothing could unit-test,
#    and — because they lived inside this job — they governed only what Actions
#    does. Two PRs were merged from a laptop with `gh pr merge` and a founder
#    token and walked straight past the deny-list. `.github/workflows/
#    path-policy.yml` now evaluates the same policy as a status check on every
#    PR; see its header for the honest limit of what that buys.
#
# 3. THIS JOB NOW CHECKS OUT CODE — AND IT MUST NOT BE THE PR'S OWN. Calling a
#    module means checking something out, so it checks out the DEFAULT BRANCH,
#    sparsely, with no persisted credentials. A PR cannot influence the policy
#    that judges it: to change the policy you must first merge a change to
#    `tools/ci/`, which is a DENIED path and therefore needs a human. That deny
#    entry is what makes this safe; do not remove it.
#
#    Not `base.sha`, which was the first attempt at "not the head". That is the
#    base tip as of the last PR event, which fails two ways: a policy TIGHTENING
#    would not apply to any already-open PR until it re-synced, and on every PR
#    opened before this change landed `tools/ci/` does not exist at that commit,
#    so the job dies with "Cannot find module" — a permanently red gate that
#    pushing cannot fix, because pushing does not move `base.sha`.
#
# 4. IT NOW DISARMS, NOT JUST ARMS. `gh pr merge --auto` is STICKY: GitHub does
#    not clear it when a label is added, and does not clear it on a push. So the
#    old flow could re-decide NOT ARMED on a `labeled`/`synchronize` event, print
#    it, and let the PR merge anyway — `hold`, `founder-decision` and a
#    mid-flight `.github/` addition were all cosmetic once a PR was armed. The
#    decision is only honest if the NOT-ARMED branch does something. Two halves:
#      - the disarm step below, for anything that fires a PR event, and
#      - `--match-head-commit`, so arming approves ONE commit and a later push
#        cannot ride an old approval.
#    Setting AUTOMERGE_FREEZE fires no PR event at all, so already-armed PRs are
#    reached by the 6-hourly sweep in `pr-hygiene.yml`, which disarms every open
#    PR whose decision is NOT ARMED. That is what makes the kill switch a kill
#    switch rather than a "stop arming new ones" switch.

name: automerge-nightly

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  # No `issues: write`: this job no longer touches labels. pr-hygiene.yml is
  # the single writer of `needs-founder` and `merge-conflict`.

concurrency:
  group: automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # The check name a reader sees. "decision", not "enable": green means a
  # decision was reached and recorded, not that anything will merge.
  automerge-decision:
    # The fork clause is new (2026-08-16): every write below needs a write
    # token and a `pull_request` from a fork gets a read-only one, so this job
    # could only ever have failed on one. Skipping says "not applicable"; the
    # red job it replaces said "CI is broken".
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # The DEFAULT BRANCH, never the PR head. See point 3 in the header — this
      # is the whole reason it is safe for this job to run code at all.
      - name: Check out the policy from the default branch (never from the PR)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: tools/ci
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # THE BOOTSTRAP CASE, and the general "somebody deleted it" case.
      # We deliberately run the policy from the default branch, so on the PR
      # that INTRODUCES the policy — and on any PR opened while it is absent
      # from `main` — there is nothing to run. Without this the step below dies
      # with MODULE_NOT_FOUND and the check goes red for a reason that has
      # nothing to do with the PR. Fail-safe: no policy means nothing is armed,
      # and the disarm step still runs.
      - name: Is the policy installed on the default branch?
        id: policy
        run: |
          if [ -f tools/ci/path-policy.mjs ]; then
            echo "installed=true" >> "$GITHUB_OUTPUT"
          else
            echo "installed=false" >> "$GITHUB_OUTPUT"
            echo "tools/ci/path-policy.mjs is not on the default branch yet."
          fi

      - name: Gather PR facts
        if: steps.policy.outputs.installed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # REST + --paginate, NOT `gh pr view --json files`: that one is a
          # single GraphQL page capped at 100 files, so a large PR would report
          # a truncated list and this job could arm on a diff whose 101st file
          # is `.github/workflows/ci.yml`. Truncation that fails OPEN is the one
          # failure mode a path allowlist cannot survive.
          gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename' > changed-files.txt
          gh pr view "$PR" --repo "$REPO" --json labels --jq '.labels[].name' > pr-labels.txt

          # The REST endpoint has its OWN cap: 3000 files including pagination,
          # truncated SILENTLY. So paginating is necessary and not sufficient.
          # The PR object reports the true count — if the two disagree we did not
          # see the whole diff, and "every path I could see is allowlisted" is
          # then worth nothing. Refuse instead.
          expected=$(gh api "repos/$REPO/pulls/$PR" --jq '.changed_files')
          actual=$(wc -l < changed-files.txt | tr -d ' ')
          if [ "$expected" != "$actual" ]; then
            echo "INCOMPLETE changed-file list: API reports $expected, we read $actual"
            echo "TRUNCATED=--truncated" >> "$GITHUB_ENV"
          else
            echo "TRUNCATED=" >> "$GITHUB_ENV"
          fi
          echo "changed files: $actual of $expected"

      - name: No policy to apply
        if: steps.policy.outputs.installed != 'true'
        run: |
          {
            echo "## automerge-decision: NOT ARMED"
            echo ""
            echo "**\`tools/ci/path-policy.mjs\` is not on the default branch, so there is"
            echo "no policy to apply and nothing will be armed.**"
            echo ""
            echo "Expected exactly once — on the PR that introduces the policy."
            echo "Anywhere else it means the module was deleted from the default branch,"
            echo "which is a real problem: read it as \"the gate is missing\", not \"the gate passed\"."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "NOT ARMED: no policy module on the default branch."

      - name: Decide
        id: decide
        if: steps.policy.outputs.installed == 'true'
        env:
          FREEZE: ${{ vars.AUTOMERGE_FREEZE }}
          PR: ${{ github.event.pull_request.number }}
        # Exits 0 whether or not it arms: "not armed" is a decision, and a red
        # check here would be indistinguishable from CI actually failing.
        run: |
          set -uo pipefail
          node tools/ci/path-policy.mjs decide \
            --files-from changed-files.txt \
            --labels-from pr-labels.txt \
            --freeze "${FREEZE:-}" \
            --pr "$PR" \
            --base main \
            ${TRUNCATED:-} \
            --summary "$GITHUB_STEP_SUMMARY" \
            --github-output "$GITHUB_OUTPUT"

      - name: Enable auto-merge
        if: steps.decide.outputs.armed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # --match-head-commit binds the arming to the commit that was actually
        # judged. Without it, arming is open-ended: a later push could land any
        # diff at all on an approval given for a different one.
        run: |
          gh pr merge "$PR" --repo "$REPO" --squash --auto --delete-branch \
            --match-head-commit "$HEAD_SHA"

      - name: Disarm auto-merge
        if: steps.decide.outputs.armed != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        # The other half of an honest decision. `--disable-auto` errors when
        # auto-merge was not enabled, which is the common case and not a
        # problem — hence `|| true`. This is what makes `hold`, `founder-decision`
        # and a mid-flight governed-path addition actually stop a merge instead
        # of merely being reported.
        run: |
          set -uo pipefail
          if gh pr merge "$PR" --repo "$REPO" --disable-auto 2>/dev/null; then
            echo "auto-merge was enabled and has been turned OFF for #$PR"
          else
            echo "auto-merge was not enabled on #$PR — nothing to disarm"
          fi

      # NOTE: the `needs-founder` queue label is deliberately NOT written here,
      # even though `steps.decide.outputs.needs_founder` says exactly what it
      # should be. `pr-hygiene.yml` is its single writer.
      #
      # Two writers would oscillate. This job cannot see mergeability, so it
      # would queue a CONFLICTING PR to a founder; pr-hygiene deliberately does
      # not (a conflict needs the author, not an approval) and would remove the
      # label again. Each write fires a `labeled`/`unlabeled` event, which this
      # workflow listens to, so the pair would trade the label back and forth
      # for several runs before settling — noise, and a queue that reads
      # differently depending on which workflow ran last. One writer, one truth.
      # The output above stays because it is genuinely useful in the log.
