# Auto-merge bot CONTENT PRs once their required checks pass.
#
# Why this exists (2026-07-24): content PRs used to sit open awaiting a human
# merge, and in Swift2 the cloud agents babysat them with hourly self-check-in
# sessions — ~69% of ALL scheduled agent token spend, ~144 sessions/day whose
# entire output was "still open, still green, re-arm in 1h". Auto-merge deletes
# the thing they were waiting for, at zero token cost. See CLAUDE.md § Never
# babysit your own PR.
#
# THE SAFETY MODEL IS PATH-BASED, NOT BRANCH-NAME-BASED (starter-kit, 2026-08-11).
# This file previously gated on `startsWith(github.head_ref, 'nightly/')` alone,
# which was wrong in two directions and both mattered:
#   - Too loose: a bot can name its branch anything. Any PR from a `nightly/*`
#     branch auto-merged on green REGARDLESS of what it touched — app.js, CI
#     workflows, backend/. A bot cannot make app code look like a data file,
#     but it can absolutely name a branch `nightly/`.
#   - Too tight: the classification runners open `classify/*` branches, so their
#     PRs never auto-merged at all. PR #86 sat open for 8 days for this reason.
# Gating on paths fixes both. If a PR touches even one file outside
# ALLOWED_PREFIXES, this job does nothing and the PR waits for a human — the
# fail-safe direction.
#
# This only ENABLES auto-merge. `protect-main` still requires `backend` and
# `data-and-site` to pass, so a red PR never merges.
#
# Two escape hatches, both needed before a large fan-out:
#   - Label a PR `hold` or `founder-decision` to stop that one.
#   - Set repo variable AUTOMERGE_FREEZE to halt ALL of it instantly, with no
#     PR and no deploy needed. This is the kill switch for a runaway army.

name: automerge-nightly

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, ready_for_review]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enable-automerge:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    # NOTE: no actions/checkout anywhere in this job. It only calls `gh`
    # against the API and never executes PR-authored code.
    steps:
      - name: Decide and enable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          FREEZE: ${{ vars.AUTOMERGE_FREEZE }}
        run: |
          set -euo pipefail

          if [ -n "${FREEZE:-}" ] && [ "$FREEZE" != "false" ] && [ "$FREEZE" != "0" ]; then
            echo "AUTOMERGE_FREEZE is set (\"$FREEZE\") — not enabling auto-merge."
            exit 0
          fi

          # DENIED wins over ALLOWED and is checked first.
          #
          # These are the files that DEFINE the gates, the operating rules, or
          # the deploy. A bot that can auto-merge a change to its own checks has
          # no checks: one PR widens the allowlist, weakens a required job, or
          # rewrites the standing instructions every future session reads, and
          # every downstream guarantee is gone. Same reasoning as keeping the
          # Claude_Code_Remote connector off every routine but the auditor.
          #
          # .github/ and .claude/ are not in ALLOWED either — they are listed
          # here so that carelessly widening ALLOWED later cannot expose them.
          DENIED_PREFIXES='
          .github/
          .claude/
          CLAUDE.md
          docs/DECISIONS.md
          docs/adr/
          docs/roles.md
          docs/agents/routine-invariants.md
          backend/src/config/
          '

          # Paths a bot run may touch, by tier (docs/curation/... § auto-merge):
          #   T1 data/         generated content; covered by the data invariants
          #                    in ci.yml (refs, dupes, taxonomy, audio scheme,
          #                    tokened-URL leaks, DAI flags) + copy rules
          #   T2 docs/         low blast radius; governance paths denied above
          #   T3 player/ tools/ test/   covered by node --test suites in ci.yml
          #   T4 app.js styles.css search-engine.js
          #                    covered by test/app-security.test.js (esc/safeUrl
          #                    behaviour + CSP/href static invariants) and
          #                    node --check. See that file's header for what
          #                    this coverage does NOT include.
          # backend/ is deliberately absent: its suite is strong, but nothing
          # has asked for agent-authored backend PRs to land unread yet.
          ALLOWED_PREFIXES='
          data/
          docs/
          player/
          tools/
          test/
          app.js
          styles.css
          search-engine.js
          '

          labels=$(gh pr view "$PR" --repo "$REPO" --json labels --jq '.labels[].name')
          for blocker in hold founder-decision; do
            if grep -qx "$blocker" <<<"$labels"; then
              echo "PR #$PR carries the '$blocker' label — leaving it for a human."
              exit 0
            fi
          done

          files=$(gh pr view "$PR" --repo "$REPO" --json files --jq '.files[].path')
          if [ -z "$files" ]; then
            echo "No files reported for PR #$PR — refusing to auto-merge."
            exit 0
          fi

          while IFS= read -r f; do
            [ -z "$f" ] && continue

            # Denied first — it overrides the allowlist unconditionally.
            while IFS= read -r prefix; do
              [ -z "$prefix" ] && continue
              case "$f" in
                "$prefix"*)
                  echo "PR #$PR touches protected path '$f' — leaving it for a human."
                  exit 0
                  ;;
              esac
            done <<<"$(echo "$DENIED_PREFIXES" | tr -d ' ')"

            ok=0
            while IFS= read -r prefix; do
              [ -z "$prefix" ] && continue
              case "$f" in
                "$prefix"*) ok=1; break ;;
              esac
            done <<<"$(echo "$ALLOWED_PREFIXES" | tr -d ' ')"
            if [ "$ok" -eq 0 ]; then
              echo "PR #$PR touches non-allowlisted path '$f' — leaving it for a human."
              exit 0
            fi
          done <<<"$files"

          echo "PR #$PR is content-only and unlabelled for hold — enabling auto-merge."
          gh pr merge "$PR" --repo "$REPO" --squash --auto --delete-branch
