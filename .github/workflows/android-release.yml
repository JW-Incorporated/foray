# Produce the artefact Google Play actually accepts, and prove the app starts.
#
# Reads on from #245 (`android-build.yml`, the reproducible build), #37
# (`docs/android-shell-build.md`), #244 (`docs/android-native-code.md`) and #27
# (`docs/android-lock-screen.md`). The founder-facing half of this file is
# `docs/android-release.md`.
#
# ── THREE GAPS, AND WHY THEY NEEDED A SECOND WORKFLOW ────────────────────────
#
#   1. NO BUNDLE EXISTED. `android-build.yml` runs `assembleDebug` and
#      `assembleRelease`, which produce APKs. **Play requires an Android App
#      Bundle**; an APK cannot be submitted to a new listing at all. `bundleRelease`
#      is a different task with a different output directory, and until this file
#      nothing in the repo ran it.
#   2. NOTHING WAS SIGNED. `android-build.yml` says so in its own comments — "there
#      is no keystore in this repo and no Play account". An unsigned bundle is the
#      correct output for a build job with no credentials, and it is not
#      submittable.
#   3. THE APP HAD NEVER BEEN EXECUTED. Not on a device, not on an emulator. See
#      the smoke job's header, which since A-02 is `android-smoke.yml`'s.
#
# THIS IS A SECOND FILE RATHER THAN THREE MORE STEPS IN THE FIRST, and the reason
# is a property `android-workflow.test.mjs` pins by name: `android-build.yml`
# READS NO SECRET, so it runs on any fork with no credentials, and it BOOTS NO
# EMULATOR, because `docs/research/mp1-background-audio.md` §6.2 paid ~75 minutes
# to learn what an emulator costs. Both of those are still true of that file and
# should stay true — a job whose entire argument is "the build does not depend on
# one machine" must not acquire a credential requirement. This file is where the
# credentials live, and it is triggered far less often. The emulator lived here
# too until A-02 moved it to `android-smoke.yml`, which reads no secret.
#
# ── COST, MEASURED WHERE IT IS KNOWN AND ESTIMATED WHERE IT IS NOT ───────────
#
# `ubuntu-latest` bills at 1x and this repo is public, so GitHub-hosted minutes
# are free. That is a reason not to worry about the bill, NOT a reason to run
# this often — the sister project spent a build freeze suspecting exhausted
# Actions minutes (#1641 there), and a slow job that runs on every PR is a slow
# job everybody learns to ignore.
#
#   `android-bundle`  ~25 min. One Gradle configuration, one release compile.
#   `android-smoke`   ~40 min estimated here before it had ever run; 3m49s
#                     measured (run 36203157867). Since A-02 it lives in
#                     `android-smoke.yml` and runs on every app PR; this file
#                     calls it on `workflow_dispatch` only. It is still the ONLY
#                     part of this repo with a genuine flake surface: a cold
#                     emulator boot. MP1 §6.2 measured a
#                     cold API-36 x86_64 boot NOT COMPLETING in ~35 minutes on a
#                     laptop under WHPX, and its practical note for this exact
#                     job says to "pin an older API level, or use a snapshot". So
#                     the image here is API 34, not 36, and KVM is enabled
#                     explicitly rather than hoped for. It is still the step most
#                     likely to fail for reasons that have nothing to do with the
#                     app.
#
# SO THE TRIGGER IS NARROW ON PURPOSE. `pull_request` fires only when the RELEASE
# PIPELINE ITSELF changes — this file, the Gradle include, and the signing script
# — and NOT on every `mobile/**` change, which `android-build.yml` (the build)
# and `android-smoke.yml` (the launch, A-02) already cover.
# `workflow_dispatch` is the founder's "make me an .aab to submit by hand" button
# — the EXCEPTION PATH since R-05 (`docs/release-lockstep-plan.md`), not the
# process. THIS FILE NEVER UPLOADS TO A STORE: the one path to Play is
# `release.yml` via `.github/actions/android-bundle`, and what this file produces
# is an artifact, a PR-time check of the pipeline, and, on a dispatch, the
# emulator launch verdict from `android-smoke.yml`, which never uploads either
# (`tools/mobile/android-workflow.test.mjs` pins that both stay so). There
# is no `push` and no `schedule`: a merge re-running what already ran on the PR
# buys nothing, and a weekly emulator boot on days nothing changed buys less.
#
# NEITHER JOB IS A REQUIRED CHECK, and neither is named so it could become one by
# accident — `protect-main` matches required contexts BY NAME (`backend`,
# `data-and-site`, `path-policy`). A flaky required check is worse than no check;
# this one is deliberately advisory, and the smoke job's verdict is read by a
# human before a submission, not by a merge gate.
#
# ── NO THIRD-PARTY ACTIONS, INCLUDING THE OBVIOUS ONE ────────────────────────
#
# Every `uses:` here is `actions/*`, plus the call to this repo's own
# `android-smoke.yml`, whose `uses:` are `actions/*` too. The standard way to run
# an Android emulator in Actions is `reactivecircus/android-emulator-runner`, and it is not used, for
# the same reason `android-actions/setup-android` is not used in
# `android-build.yml`: a third-party action runs arbitrary code with the job's
# token on every run. THAT ARGUMENT GOT STRONGER HERE, NOT WEAKER — this is the
# one workflow in the repo that a signing key passes through. The emulator is
# driven with `sdkmanager`, `avdmanager`, `emulator` and `adb` directly, which is
# about thirty lines and is visible in `android-smoke.yml`.
#
# ── WHO CAN REACH THE KEY, SAID OUT LOUD RATHER THAN LEFT IMPLICIT ───────────
#
# GitHub makes secrets available to `pull_request` runs when the PR comes from a
# branch in THIS repository (they are withheld only from forks). So a run of this
# workflow on a same-repo PR can hold the upload key, and the workflow that run
# executes is the one on the PR BRANCH — which means anyone with write access
# here could, in principle, put a step in it that exfiltrates the key.
#
# THAT IS NOT A NEW HOLE THIS FILE OPENS; it is the property GitHub gives every
# repository secret, and it is why the deliberate choice is stated rather than
# discovered. It is accepted for two reasons: the alternative — materialising the
# key only on `workflow_dispatch` — means the SIGNED path cannot be exercised
# until after this file is on the default branch, and `workflow_dispatch` cannot
# be triggered on a branch before then; and this repo's write list is two
# founders plus agents operating under their authority, which is the same trust
# boundary `path-policy` already describes as "a norm with a receipt, not a
# wall".
#
# What follows from it, and is done: the key is decoded to a directory OUTSIDE
# the uploaded artifact path, the password never reaches a command line, the
# build log is scrubbed before anything reads it back, and a shred step runs on
# failure as well as success. If the trust boundary ever widens — an outside
# contributor with write access, a self-hosted runner — the right change is to
# gate the key on `github.event_name != 'pull_request'` and accept that the
# signed path is then only exercised post-merge.
#
# ── WHAT THIS STILL DOES NOT PROVE ───────────────────────────────────────────
#
# An emulator is not a phone, and `docs/research/mp1-background-audio.md` §6.4 is
# a whole section on exactly where that bites: Doze never engages, the cached-app
# freezer has no reason to fire, OEM battery managers are untestable by
# construction, and audio focus, Bluetooth routing and car head units are not
# reachable at all. So the smoke job settles LAUNCH and nothing about
# BACKGROUNDED PLAYBACK, which remains `HUMAN-ACTIONS.md` #11's device pass. The
# summary says so on the run itself, not only here.

name: android-release

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "versionCode for this bundle. Play REJECTS a versionCode it has already accepted, so bump it for every upload. Blank keeps Capacitor's template value of 1."
        required: false
        default: ""
      version_name:
        description: "versionName shown to users, e.g. 1.0.0. Blank keeps the template value of 1.0."
        required: false
        default: ""
  pull_request:
    # DELIBERATELY NOT `mobile/**`. `android-build.yml` covers ordinary shell
    # changes and `android-smoke.yml` launches them; this fires only when the
    # release pipeline itself changes, which is the only way a CI-only change can
    # be reviewed against real output — and the only way a release compile's
    # cost, and the key it decodes, land on the PRs that chose to pay for them.
    # `tools/mobile/webview-probe.mjs` LEFT THIS LIST IN A-02: only the smoke job
    # runs it, and that job now lives in `android-smoke.yml`, whose own filter
    # carries the probe. Keeping it here would build a signed bundle to test a
    # script the bundle never runs.
    paths:
      - ".github/workflows/android-release.yml"
      - "mobile/gradle/**"
      - "tools/mobile/wire-signing.mjs"

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # The submittable artefact.
  # ───────────────────────────────────────────────────────────────────────────
  android-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SDK_PLATFORM: platforms;android-36
      SDK_BUILD_TOOLS: build-tools;36.0.0
      # NO `runner.*` HERE. The `runner` context is not available in a job-level
      # `env:` block and an unavailable context is a workflow-COMPILE error, not
      # an empty string — the job would never start. $ART is set from
      # $RUNNER_TEMP in the first step, exactly as the other two shell workflows
      # do it.

    steps:
      - uses: actions/checkout@v4
        # Full history (blobless: commits and trees only, cheap). The bundle's seed
        # pointer is dated by the newest commit that touched a stamp input
        # (tools/ci/generate-manifest.mjs, stampTimestamp); a shallow clone cannot
        # see it, and the seed then ships without a pointer (PR #795 review).
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Release gate — the privacy tripwire (S-08)
        # THE FIRST STEP THAT CAN FAIL THIS JOB, DELIBERATELY. See
        # ios-build.yml's identical step for the full rationale:
        # test/release-gates.test.js fails a release build outright when
        # off-device Shows/playlist search (SHOWS_SEARCH_OFF_DEVICE) ships
        # while docs/legal/privacy-policy.md still promises none exists.
        # HUMAN-ACTIONS.md's G5 item is the human action that resolves it.
        run: node --test test/release-gates.test.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Toolchain versions (the first thing to read when this breaks)
        run: |
          set -euo pipefail
          echo "ART=$RUNNER_TEMP/android-release" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/android-release"
          # THE KEY DIRECTORY IS A SIBLING OF $ART, NEVER A CHILD OF IT, and that
          # is the single most important line in this file. $ART is uploaded as a
          # public artifact at the end of the run; anything inside it is
          # downloadable by anyone who can see the repo. A keystore written one
          # directory too deep is the founder's signing key published to the
          # internet, from a run that looks completely routine.
          echo "KEYDIR=$RUNNER_TEMP/android-keys" >> "$GITHUB_ENV"
          {
            echo "runner: $(uname -srm)"
            java -version 2>&1
            node --version
          } | tee "$RUNNER_TEMP/android-release/toolchain.txt"
          javac -version 2>&1 | grep -qE '^javac 21\.' \
            || { echo "javac is not 21 — Capacitor 8 will fail at compileDebugJavaWithJavac"; exit 1; }

      - name: The Android SDK, from the image plus exactly what we pin
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "Neither ANDROID_HOME nor ANDROID_SDK_ROOT points at an SDK on this runner."
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER=$(command -v sdkmanager 2>/dev/null || true)
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1 || true)
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "no sdkmanager on PATH or under $SDK/cmdline-tools/*/bin/"
            exit 1
          fi
          yes 2>/dev/null | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "$SDK_PLATFORM" "$SDK_BUILD_TOOLS"

      - name: Install the shell's dependencies
        working-directory: mobile
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund

      - name: Build the webDir and generate the Android project
        working-directory: mobile
        run: |
          set -euo pipefail
          npm run add:android 2>&1 | tee "$ART/cap-add-android.log"
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          chmod +x android/gradlew

      - name: Wire the signing include into the generated project
        # `mobile/android/app/build.gradle` is Capacitor TEMPLATE OUTPUT,
        # regenerated by the step above on every run, with no signingConfigs block
        # and a hardcoded `versionCode 1`. The decision lives in the tracked
        # `mobile/gradle/foray-signing.gradle`; this re-applies it after
        # generation, the same shape `cap sync` uses for `foray-audio`.
        #
        # `--check` IS A SECOND RUN, NOT DECORATION. The first invocation reports
        # what it did; the second re-reads both files off disk and fails if the
        # apply line or the copied include is not there. A build that is silently
        # not applying the signing config produces an unsigned bundle and prints
        # BUILD SUCCESSFUL, which is the failure this whole file is about.
        run: |
          set -euo pipefail
          node tools/mobile/wire-signing.mjs mobile/android
          node tools/mobile/wire-signing.mjs mobile/android --check
          tail -8 mobile/android/app/build.gradle | tee "$ART/app-build-gradle-tail.txt"

      - name: Materialise the upload key, if the founder has installed one
        # ABSENT IS A SUPPORTED STATE. With no `ANDROID_KEYSTORE_B64` secret —
        # every fork, and every PR opened from one — the step exports an empty path
        # and the build below produces an UNSIGNED bundle rather than failing. That
        # is not a degraded mode to be hidden: it is checked for explicitly two
        # steps down, so "unsigned" is a VERIFIED outcome rather than an assumed
        # one, and a wiring bug that inverted the two branches fails on either.
        #
        # THE STORE IS PKCS12 AND ITS SINGLE PASSWORD IS ONE SECRET. There is no
        # `ANDROID_KEY_PASSWORD`, because a PKCS12 entry cannot have a key password
        # that differs from the store password.
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "keyed=false" >> "$GITHUB_OUTPUT"
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "No ANDROID_KEYSTORE_B64 secret is available: this run will produce an UNSIGNED bundle."
            echo "That is expected on a fork. See docs/android-release.md for the three secret names."
            exit 0
          fi
          mkdir -p "$KEYDIR"
          chmod 700 "$KEYDIR"
          # `--decode` (not `-d`) because GNU and BSD base64 disagree on the short
          # flag, and a wrong-flag failure here writes a zero-byte file that Gradle
          # would then reject with a message about keystore format.
          # `if !`, NOT A BARE PIPELINE. GNU base64 exits 1 on invalid input and
          # `set -o pipefail` would abort the step there — so the message below,
          # which names the secret and the fix, was unreachable for the commonest
          # half of the case it was written for, and the founder would see
          # `base64: invalid input` instead.
          if ! printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYDIR/upload.p12"; then
            echo "ANDROID_KEYSTORE_B64 is not valid base64 — re-run the gh secret set line in docs/android-release.md §2"
            exit 1
          fi
          chmod 600 "$KEYDIR/upload.p12"
          if [ ! -s "$KEYDIR/upload.p12" ]; then
            echo "ANDROID_KEYSTORE_B64 decoded to an empty file — the secret is truncated"
            exit 1
          fi
          echo "keyed=true" >> "$GITHUB_OUTPUT"
          echo "path=$KEYDIR/upload.p12" >> "$GITHUB_OUTPUT"
          echo "upload key materialised ($(stat -c%s "$KEYDIR/upload.p12") bytes) outside the uploaded artifact directory"

      - name: bundleRelease — the .aab Play accepts
        # THE OUTPUT DIRECTORY IS NOT THE APK ONE. `app/build/outputs/bundle/release/`,
        # not `app/build/outputs/apk/release/`, and the file is `app-release.aab`
        # whether or not it is signed — unlike the APK, which renames itself to
        # `app-release-unsigned.apk`. So the filename cannot be used to tell the
        # two apart, which is why the verification step below reads the signature.
        id: bundle
        working-directory: mobile/android
        env:
          KEYED: ${{ steps.key.outputs.keyed }}
          # ENVIRONMENT, NEVER `-P`. A Gradle property is in the process's argv and
          # therefore in `ps`, in the daemon's record of the invocation, and in any
          # trace that echoes the command line. These are read by
          # `System.getenv` in `mobile/gradle/foray-signing.gradle` and handed
          # straight to `signingConfig`.
          FORAY_KEYSTORE_PATH: ${{ steps.key.outputs.path }}
          FORAY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FORAY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FORAY_VERSION_CODE: ${{ inputs.version_code }}
          FORAY_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          # ── THE LENGTH FLOOR COMES FIRST, BEFORE ANY BUILD ─────────────────
          # The scan further down is a SUBSTRING search. A three-letter password
          # occurs in an ordinary Gradle log by coincidence, so the scan would
          # delete a clean log and report a leak that did not happen. The honest
          # reading of that case is the other one: a password short enough to
          # collide with build output is not a password.
          #
          # IT IS FIRST BECAUSE IT USED TO SIT AFTER THE BUILD, and two reviewers
          # independently found the same hole: `exit 1` there left an UNSCANNED
          # log in $ART, which `if: always()` then published — the exact vector
          # the scan exists to close, reachable only through the one input that
          # makes the scan unusable. Ordering it first also makes the message true.
          if [ -n "${FORAY_KEYSTORE_PASSWORD:-}" ] && [ "${#FORAY_KEYSTORE_PASSWORD}" -lt 12 ]; then
            echo "the keystore password is under 12 characters. Refusing to build: it cannot be told apart"
            echo "from ordinary log text, so the leak scan below would be meaningless. Rotate to a longer one."
            exit 1
          fi
          # ── THE LOG IS WRITTEN OUTSIDE $ART AND COPIED IN ONLY ONCE CLEAN ──
          # ORDERING ALONE WAS NOT ENOUGH. `timeout-minutes`, a cancelled
          # concurrency group, or any future `exit` added between the build and
          # the scan all leave whatever is on disk for the `if: always()` upload
          # to publish — a scan that protects one code path of one step, against
          # an upload that is unconditional, is a scan with a gap in it. So the
          # log lives in $RUNNER_TEMP's root, which is NOT uploaded, until it has
          # been read. Same structural argument that puts $KEYDIR beside $ART
          # rather than inside it.
          LOG="$RUNNER_TEMP/gradle-bundleRelease.log"
          ./gradlew foraySigningStatus --no-daemon --console=plain -q \
            | tee "$ART/signing-status.txt"
          # AND THE TWO ANSWERS MUST AGREE, BEFORE 25 MINUTES ARE SPENT ON THEM.
          # The workflow decides `keyed` from the secret; the Gradle include
          # decides `signingRequested` from the environment it was handed. If those
          # disagree — a renamed variable, a `working-directory` that stops the
          # include being applied — the signature step catches it at the end of the
          # build. This catches it at the start, and names which half is wrong.
          # Until now nothing read `signing-status.txt`, so the file was evidence
          # for a human and a check for nobody.
          if [ "${KEYED:-false}" = "true" ]; then
            grep -q 'FORAY_SIGNING_STATUS=keyed' "$ART/signing-status.txt" \
              || { echo "a keystore was supplied but Gradle configured an UNSIGNED build — the signing include is not being applied"; exit 1; }
          fi
          # THE EXIT CODE IS CAPTURED, NOT INFERRED FROM `$?` AFTER A PIPE.
          #
          # GITHUB MASKS SECRETS IN LOGS AND NOT IN ARTIFACTS. This log is uploaded
          # at the end of the run and is downloadable by anyone who can see the
          # repo, so `***` in the web log is no protection at all for the copy in
          # the zip. AGP does not print the password today; a future AGP, a
          # `--stacktrace` added in haste, or a keystore error that echoes its
          # inputs all could. The check never prints what it is looking for.
          set +e
          ./gradlew bundleRelease --no-daemon --console=plain > "$LOG" 2>&1
          GRADLE_STATUS=$?
          set -e
          if [ -n "${FORAY_KEYSTORE_PASSWORD:-}" ] && grep -qF "$FORAY_KEYSTORE_PASSWORD" "$LOG"; then
            rm -f "$LOG"
            echo "the Gradle log contained the keystore password; it has been deleted rather than uploaded."
            echo "Find what printed it before running this again."
            exit 1
          fi
          # ONLY NOW does the log enter the directory that gets published.
          cp "$LOG" "$ART/gradle-bundleRelease.log"
          if [ "$GRADLE_STATUS" -ne 0 ]; then
            echo "::group::bundleRelease tail"; tail -300 "$ART/gradle-bundleRelease.log"; echo "::endgroup::"
            exit 1
          fi
          # A GREEN RELEASE BUILD THAT SKIPPED LINT PROVES LESS THAN IT LOOKS, and
          # `bundleRelease` depends on `lintVitalRelease` exactly as `assembleRelease`
          # does. Same two checks as android-build.yml — present in the task list, and
          # not SKIPPED/NO-SOURCE — because the same three ways to bypass it apply.
          LINTLINE=$(grep -E '^> Task :app:lintVitalRelease( |$)' "$ART/gradle-bundleRelease.log" | tail -1 || true)
          if [ -z "$LINTLINE" ]; then
            echo "bundleRelease did not run :app:lintVitalRelease — the release lint gate is not actually running"
            exit 1
          fi
          case "$LINTLINE" in
            *SKIPPED*|*NO-SOURCE*) echo "lintVitalRelease was registered but did not execute: $LINTLINE"; exit 1 ;;
          esac
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -f "$AAB" || { echo "no .aab at $AAB"; ls -R app/build/outputs || true; exit 1; }
          cp "$AAB" "$ART/foray-release.aab"
          echo "aab_bytes=$(stat -c%s "$AAB")" >> "$GITHUB_OUTPUT"

      - name: It is really a BUNDLE, and it really contains the app
        # DO NOT TRUST THAT THE TASK PRINTED SUCCESS. `android-build.yml` already
        # documents three ways `assembleRelease` says BUILD SUCCESSFUL without
        # having done the job; a bundle has its own. The file is opened and its
        # entries are read.
        #
        # THE STRUCTURAL CHECK IS THE ONE THAT MATTERS. An .aab and an .apk are
        # both zips and both end up in `app/build/outputs`, and a wrong `cp` or a
        # future task rename would produce a file with the right name and the
        # wrong contents. They are distinguishable by layout and by nothing else:
        # a BUNDLE has `BundleConfig.pb` and a `base/` module with a PROTOBUF
        # manifest and `resources.pb`; an APK has a top-level binary
        # `AndroidManifest.xml` and `resources.arsc` and neither of the above. Both
        # directions are asserted, so a renamed APK fails here rather than at
        # Play's upload form.
        id: verify
        run: |
          set -euo pipefail
          AAB="$ART/foray-release.aab"
          unzip -Z1 "$AAB" > "$ART/aab-entries.txt"
          echo "$(wc -l < "$ART/aab-entries.txt") entries"
          for needle in \
            'BundleConfig.pb' \
            'base/manifest/AndroidManifest.xml' \
            'base/dex/classes.dex' \
            'base/resources.pb' \
            'base/assets/public/index.html' \
            'base/assets/public/app.js' \
            'base/assets/public/ui/boot.js' \
            'base/assets/capacitor.plugins.json'
          do
            grep -qxF "$needle" "$ART/aab-entries.txt" \
              || { echo "this is not a usable app bundle: no $needle"; exit 1; }
          done
          # `if`, NOT `grep … && { exit 1; }`. Under `set -e` the `&&` form does not
          # abort on the *absent* case, which is the case we want, so it happens to
          # work — and "happens to work because of an exemption in the -e rules" is
          # not what a check that guards the shipped artefact should rest on.
          for forbidden in 'AndroidManifest.xml' 'resources.arsc' 'classes.dex'
          do
            if grep -qxF "$forbidden" "$ART/aab-entries.txt"; then
              echo "$forbidden at the archive root — this is an APK renamed to .aab, not a bundle"
              exit 1
            fi
          done
          # OUR OWN NATIVE CODE, INSIDE THE BUNDLE. `android-build.yml` reads the
          # merged manifest and the DEBUG APK; nothing had ever read the release
          # bundle. The manifest here is protobuf-encoded, so the needles are
          # matched as raw bytes (`grep -a`) — protobuf stores these strings
          # literally, and a manifest that lost the service would lose them.
          unzip -p "$AAB" base/manifest/AndroidManifest.xml > "$ART/aab-manifest.pb"
          for needle in \
            'ai.jwlabs.foura' \
            'ai.jwlabs.foura.audio.PlaybackKeepAliveService' \
            'mediaPlayback' \
            'android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK'
          do
            grep -qaF "$needle" "$ART/aab-manifest.pb" \
              || { echo "the bundle's manifest is missing: $needle"; exit 1; }
          done
          unzip -p "$AAB" base/assets/capacitor.plugins.json | tee "$ART/aab-capacitor.plugins.json"
          grep -qF 'ai.jwlabs.foura.audio.ForayAudioPlugin' "$ART/aab-capacitor.plugins.json" \
            || { echo "the bundle did not register ForayAudioPlugin"; exit 1; }

      - name: Signed, or verifiably not signed — never assumed either way
        # BOTH BRANCHES ASSERT. The failure this exists for is the quiet one: a
        # keystore secret is installed, something in the wiring stops working, and
        # the run stays green while emitting an unsigned bundle that Play rejects
        # two weeks later. So when a key was supplied the signature must VERIFY,
        # and when none was the archive must contain NO signature block — a wiring
        # bug that inverted the two would fail on whichever branch it took.
        #
        # `jarsigner`, not `apksigner`. A bundle carries a JAR signature; the APK
        # signature schemes v2/v3 are applied by Play to the APKs it generates
        # from the bundle, so `apksigner verify` on an .aab is the wrong question.
        # No `-strict`: an upload key is self-signed by design, and `-strict`
        # returns non-zero for a certificate chain it cannot validate.
        id: signature
        env:
          KEYED: ${{ steps.key.outputs.keyed }}
          # THE UPLOAD KEY'S PUBLIC IDENTITY, PINNED. This is a certificate
          # fingerprint: public by construction, displayed by Play on its own App
          # Signing page, and worth nothing to an attacker. Pinning it turns
          # "something signed this" into "THE upload key signed this" — the one
          # remaining silent failure after the checks above, because a bundle
          # signed by the wrong key verifies perfectly and is rejected at upload
          # with `Your Android App Bundle is signed with the wrong key`.
          #
          # IF THIS EVER GOES RED, DO NOT EDIT IT TO MATCH. A changed fingerprint
          # means the key changed, and for an app already on Play that is
          # unrecoverable without Google's key-reset process. Find out why first.
          EXPECTED_SIGNER_SHA256: "92:92:D8:5B:96:32:05:B4:00:45:BC:26:FC:00:9A:C4:10:B1:12:F6:85:C6:88:75:82:32:48:04:DA:1F:8C:19"
        run: |
          set -euo pipefail
          AAB="$ART/foray-release.aab"
          SIGBLOCKS=$(grep -cE '^META-INF/.*\.(RSA|DSA|EC)$' "$ART/aab-entries.txt" || true)
          if [ "${KEYED:-false}" = "true" ]; then
            # EXACTLY ONE, not "at least one". Two signature blocks means two
            # signers, and the fingerprint check below is a substring search over
            # a certificate dump that would then contain both — so a bundle signed
            # by the upload key AND something else would pass every check here.
            if [ "$SIGBLOCKS" -ne 1 ]; then
              echo "expected exactly one signature block in the bundle, found $SIGBLOCKS — the signing config was not applied, or something else signed it too"
              exit 1
            fi
            jarsigner -verify "$AAB" > "$ART/jarsigner.txt" 2>&1 || {
              cat "$ART/jarsigner.txt"; echo "jarsigner could not verify the bundle"; exit 1; }
            grep -q 'jar verified' "$ART/jarsigner.txt" \
              || { cat "$ART/jarsigner.txt"; echo "jarsigner did not report the bundle as verified"; exit 1; }
            # `keytool -printcert -jarfile` reads the certificate OUT OF THE
            # ARTEFACT, so this is a property of the file being uploaded rather
            # than of the keystore we think we used. Colons and case are
            # normalised away so a formatting change in keytool's output cannot
            # make a matching fingerprint look like a mismatch.
            keytool -printcert -jarfile "$AAB" > "$ART/signer-cert.txt" 2>&1 || {
              cat "$ART/signer-cert.txt"; echo "keytool could not read the bundle's certificate"; exit 1; }
            NORM=$(tr -d ':' < "$ART/signer-cert.txt" | tr 'a-f' 'A-F')
            WANT=$(printf '%s' "$EXPECTED_SIGNER_SHA256" | tr -d ':' | tr 'a-f' 'A-F')
            if ! printf '%s' "$NORM" | grep -qF "$WANT"; then
              echo "the bundle is signed by a certificate that is NOT the pinned upload key."
              echo "expected SHA-256 $EXPECTED_SIGNER_SHA256"
              # The whole certificate, printed: it is public information, and the
              # alternative is a mismatch nobody can diagnose without a rerun.
              cat "$ART/signer-cert.txt"
              exit 1
            fi
            echo "state=signed" >> "$GITHUB_OUTPUT"
            echo "the bundle is signed, jarsigner verifies it, and the signer is the pinned upload key"
          else
            if [ "$SIGBLOCKS" -ne 0 ]; then
              echo "no keystore was supplied but the bundle carries $SIGBLOCKS signature block(s) — something signed this and we do not know with what"
              exit 1
            fi
            echo "state=unsigned" >> "$GITHUB_OUTPUT"
            echo "no upload key on this run: the bundle is unsigned and NOT submittable. This is the expected state until HUMAN-ACTIONS.md's keystore item is done."
          fi

      - name: Shred the upload key
        # `if: always()`, AND IT IS THE REASON THIS IS ITS OWN STEP. A decoded
        # keystore that survives the job is a keystore in a workspace whose
        # lifetime nobody in this repo controls: on a GitHub-hosted runner the VM
        # is destroyed, which is why this is belt-and-braces rather than the only
        # defence — but self-hosted runners reuse the filesystem, and the day
        # someone adds one is not the day to discover the key was left behind.
        # A step that only runs on success cleans up on exactly the runs where
        # nothing went wrong.
        #
        # BEFORE the artifact upload, deliberately: ordering is what makes this a
        # guarantee rather than a race, even though $KEYDIR is outside the
        # uploaded path.
        if: always()
        run: |
          set -euo pipefail
          KEYDIR="${KEYDIR:-$RUNNER_TEMP/android-keys}"
          if [ -d "$KEYDIR" ]; then
            find "$KEYDIR" -type f -exec shred -u {} + 2>/dev/null || rm -rf "$KEYDIR"
            rm -rf "$KEYDIR"
          fi
          test ! -e "$KEYDIR" || { echo "could not remove $KEYDIR"; exit 1; }
          echo "no keystore remains on this runner"

      - name: What this run established
        if: always()
        env:
          BUNDLE_OUTCOME: ${{ steps.bundle.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          AAB_BYTES: ${{ steps.bundle.outputs.aab_bytes }}
          SIGN_STATE: ${{ steps.signature.outputs.state }}
        run: |
          set -euo pipefail
          ART="${ART:-$RUNNER_TEMP/android-release}"
          mkdir -p "$ART"
          {
            echo "## Android release bundle"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| \`bundleRelease\` (incl. \`lintVitalRelease\`) | **${BUNDLE_OUTCOME:-not reached}** |"
            echo "| bundle structure verified | **${VERIFY_OUTCOME:-not reached}** |"
            echo "| \`foray-release.aab\` | ${AAB_BYTES:-—} bytes |"
            echo "| signature | **${SIGN_STATE:-not reached}** |"
            echo
            if [ "${SIGN_STATE:-}" = "unsigned" ]; then
              echo "**This bundle cannot be submitted.** It is unsigned because"
              echo "\`ANDROID_KEYSTORE_B64\` was not available to this run — which is the"
              echo "expected state on a fork, and a configuration problem anywhere else."
              echo "\`docs/android-release.md\` lists the three secrets and how they are set."
            fi
            if [ "${SIGN_STATE:-}" = "signed" ]; then
              echo "**Ready to upload.** Download the \`foray-android-release\` artifact from"
              echo "this run, unzip it, and submit \`foray-release.aab\` in the Play Console."
              echo "The signer was checked against the pinned upload-key fingerprint, so this"
              echo "file is signed with the key Play expects."
            fi
            echo
            echo "**A launch is not a listening session.** The \`android-smoke\` job (called"
            echo "here on a dispatch; on a PR it runs from \`android-smoke.yml\`) says whether"
            echo "the app starts. Neither job says anything about"
            echo "backgrounded playback, Doze, the cached-app freezer, OEM battery managers"
            echo "or Bluetooth routing — \`docs/research/mp1-background-audio.md\` §6.4 is why"
            echo "an emulator cannot, and \`HUMAN-ACTIONS.md\` #11 is the device pass that can."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the bundle and everything this run learned
        # RETENTION IS 30 DAYS, not the 14 the build job uses. This artefact is
        # meant to be DOWNLOADED AND SUBMITTED by a human on his own schedule, and
        # a submission window that closes in a fortnight is an artefact that
        # quietly has to be rebuilt.
        #
        # THE PATH IS $ART EXACTLY. The upload key was written to a SIBLING
        # directory ($KEYDIR) precisely so that no widening of this path can
        # publish it; `${{ runner.temp }}` here would upload the keystore.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foray-android-release
          path: ${{ runner.temp }}/android-release
          if-no-files-found: warn
          retention-days: 30

  # ───────────────────────────────────────────────────────────────────────────
  # The launch.
  # ───────────────────────────────────────────────────────────────────────────
  android-smoke:
    # THE EMULATOR JOB MOVED TO `android-smoke.yml` (A-02), UNCHANGED, so it can
    # run on every PR that changes the app — `mobile/**`, `tools/mobile/**`,
    # `player/**`, `app.js`, `index.html` — without dragging the key-holding
    # bundle job along. Read that file's header for the job and its argument.
    #
    # THIS FILE STILL CALLS IT, on `workflow_dispatch` only. The founder's
    # by-hand bundle run keeps its launch verdict beside the bundle. On
    # `pull_request` it does not: `android-smoke.yml`'s own filter already
    # covers this file and the release pipeline's paths, so calling it here too
    # would boot two emulators for one PR.
    #
    # STILL NOT `needs: android-bundle`, in either direction, for the reason
    # this header gives: a flaked AVD must never stand between the founder and
    # a submittable `.aab`.
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/android-smoke.yml
