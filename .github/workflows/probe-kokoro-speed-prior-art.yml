name: probe-kokoro-speed-prior-art (throwaway)
on:
  push:
    branches: [probe/kokoro-speed-prior-art]
permissions:
  contents: read
jobs:
  fluidaudio:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, route: cpuOnly }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: sw_vers; uname -m; sysctl -n hw.ncpu machdep.cpu.brand_string; xcodebuild -version; swift --version
      - run: swift build -c release --package-path tools/probe-tmp/faprobe 2>&1 | tail -30
      - run: tools/probe-tmp/faprobe/.build/release/FaProbe ${{ matrix.route }} tools/mobile/kokoro-probe-passage.json || (ls -t ~/Library/Logs/DiagnosticReports/ | head; f=$(ls -t ~/Library/Logs/DiagnosticReports/*FaProbe* 2>/dev/null | head -1); [ -n "$f" ] && head -c 6000 "$f"; exit 1)
