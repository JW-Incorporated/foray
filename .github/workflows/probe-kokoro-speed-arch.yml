name: probe-kokoro-speed-arch (throwaway, not for merge)
on:
  push:
    branches: [probe/kokoro-speed-arch]
permissions:
  contents: read
jobs:
  kokoro:
    strategy:
      fail-fast: false
      matrix:
        threads: [0, 1, 2]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          mkdir -p models out
          curl -fsSL -o models/model.onnx "https://huggingface.co/onnx-community/Kokoro-82M-v1.0-ONNX/resolve/main/onnx/model.onnx"
          curl -fsSL -o models/af_heart.bin "https://huggingface.co/onnx-community/Kokoro-82M-v1.0-ONNX/resolve/main/voices/af_heart.bin"
          uname -m; sysctl -n machdep.cpu.brand_string hw.ncpu
      - run: pip install "onnxruntime==1.20.1" numpy
      - run: python -u tools/probe-tmp/kokoro_speed.py ${{ matrix.threads }} ${{ matrix.threads == 0 && 'save' || '' }}
      - if: matrix.threads == 0
        uses: actions/upload-artifact@v4
        with: { name: kokoro-wavs, path: out/*.wav }
  timepitch:
    needs: kokoro
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: kokoro-wavs, path: in }
      - run: |
          mkdir -p out
          python3 -c "import json;p=json.load(open('tools/mobile/kokoro-probe-passage.json'));open('passage.txt','w').write(' '.join(l['text'] for l in p['lines']))"
          swiftc -O tools/probe-tmp/timepitch.swift -o tp
          ./tp in/kokoro_speed1.0.wav passage.txt
          cp in/kokoro_speed1.5.wav out/ && cp in/kokoro_speed1.0.wav out/
      - uses: actions/upload-artifact@v4
        with: { name: ab-listen-kokoro-speed1.5-vs-timepitch1.5, path: out/*.wav }
  small:
    strategy:
      fail-fast: false
      matrix:
        model: [kitten-nano, kitten-mini, piper]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - if: startsWith(matrix.model, 'kitten')
        run: |
          brew install espeak-ng
          pip install https://github.com/KittenML/KittenTTS/releases/download/0.8.1/kittentts-0.8.1-py3-none-any.whl
      - if: matrix.model == 'piper'
        run: |
          pip install piper-tts numpy
          mkdir -p models
          curl -fsSL -o models/en_US-lessac-medium.onnx "https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx"
          curl -fsSL -o models/en_US-lessac-medium.onnx.json "https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx.json"
          ls -la models
      - run: python -u tools/probe-tmp/small_models.py ${{ matrix.model }}
