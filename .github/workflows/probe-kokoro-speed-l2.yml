name: probe-kokoro-speed-l2 (throwaway, lens 2 Apple-native)
on:
  push:
    branches: [probe/kokoro-speed-l2]
permissions:
  contents: read
jobs:
  quality:
    # Round 2: is the 7-stage Core ML chain's distance from ORT fp32 a Core ML
    # defect or ORT-vs-PyTorch? PyTorch (hexgrad KModel) is the reference.
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: node tools/mobile/fetch-models.mjs
      - run: |
          brew install espeak-ng
          pip install "onnxruntime==1.20.1" "coremltools>=8.3" numpy scipy soundfile huggingface_hub "kokoro>=0.9.4" torch
      - run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download("FluidInference/kokoro-82m-coreml", allow_patterns=["ANE/Kokoro*.mlpackage/**", "ANE/Kokoro*_v2.mlmodelc/**"], local_dir="hf")
          PY
          ls hf/ANE
      - run: python -u tools/probe-tmp/kokoro_coreml.py ort 1.0 ort_s1
      - run: python -u tools/probe-tmp/kokoro_coreml.py torch 1.0 torch_s1
      - run: python -u tools/probe-tmp/kokoro_coreml.py torch 1.0 torch_s1b
      - run: python -u tools/probe-tmp/kokoro_coreml.py coreml 1.0 cml_v1_s1 hf/ANE cpu
      - run: python -u tools/probe-tmp/kokoro_coreml.py coreml 1.0 cml_v2_s1 hf/ANE cpu-v2
        continue-on-error: true
      - run: python -u tools/probe-tmp/kokoro_coreml.py compare ort_s1
      - run: python -u tools/probe-tmp/kokoro_coreml.py compare torch_s1
      - uses: actions/upload-artifact@v4
        with:
          name: kokoro-l2-wavs
          path: wav/
          retention-days: 7
