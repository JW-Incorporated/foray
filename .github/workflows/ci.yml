name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Added 2026-08-16, and it is load-bearing rather than a convenience.
  # `.github/workflows/pr-hygiene.yml` updates PR branches that have fallen
  # behind `main`. That changes the PR's head SHA, and `protect-main`'s required
  # checks (`backend`, `data-and-site`) are matched against THAT SHA — but a
  # push made with the automatic GITHUB_TOKEN does not create a workflow run
  # (GitHub's anti-recursion rule), so the updated PR would sit forever at
  # "Expected — waiting for status to be reported". `workflow_dispatch` is one
  # of the two documented exceptions to that rule, so pr-hygiene dispatches this
  # workflow on the PR's head branch and the required checks report on the new
  # SHA. Removing this trigger would silently strand every auto-updated PR.
  workflow_dispatch: {}

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  ios-kit:
    # ForayKit is a pure-Swift package (no AVFoundation) precisely so its
    # state machine + intent grammar tests can run on a CI Mac — the only
    # Mac this project currently has.
    #
    # Skipped on `workflow_dispatch`, which exists solely so pr-hygiene can
    # re-report the REQUIRED checks (`backend`, `data-and-site`) on a PR head it
    # just updated. `ios-kit` is not required, and macOS runner minutes bill at
    # 10x — re-running it on every auto-update would be the largest single cost
    # of that feature for no gate. A push or PR still runs it normally.
    if: github.event_name != 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path ios/ForayKit

  data-and-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JSON data files
        run: |
          node -e "
            const files = ['data/session.json','data/taxonomy.json','data/validated-links.json','data/discover.json','data/catalog.json','data/personas.json','data/ladders.json','data/top-topics.json','data/topic-coverage-report.json','data/transcript-availability.json','data/segments.json','manifest.json'];
            for (const f of files) { require('./' + f); console.log('ok', f); }
            const s = require('./data/session.json');
            const refs = [...s.cards.flatMap(c=>[c.episode_id,...(c.alternates||[])]), ...s.categories.flatMap(c=>c.groups.flatMap(g=>g.episode_ids))];
            const missing = refs.filter(id=>!s.episodes[id]);
            if (missing.length) { console.error('missing episode refs:', missing); process.exit(1); }
            console.log('session refs ok');

            // Invariants from the architecture assessment (2026-07-09):
            const d = require('./data/discover.json');
            const t = require('./data/taxonomy.json');
            const tg = require('./data/item-tags.json');
            // 1. No episode may exist under two ids (session vs discover) — splits user state
            const tracks = new Map();
            Object.entries(s.episodes).forEach(([id,e])=>{ if(e.apple_track_id) tracks.set(e.apple_track_id, id); });
            const dupes = d.items.filter(i=>i.apple_track_id && tracks.has(i.apple_track_id));
            if (dupes.length) { console.error('duplicate episodes across files:', dupes.map(i=>i.id)); process.exit(1); }
            const seen = new Set();
            for (const i of d.items) { if (seen.has(i.id)) { console.error('duplicate discover id:', i.id); process.exit(1); } seen.add(i.id); }
            // 2. Every pool topic must have a taxonomy node — else stars/sliders silently no-op
            const nodeIds = new Set(t.nodes.map(n=>n.id));
            const poolTopics = new Set([...d.items.flatMap(i=>i.topics||[]), ...Object.values(s.episodes).flatMap(e=>e.topics||[])]);
            const orphans = [...poolTopics].filter(x=>!nodeIds.has(x));
            if (orphans.length) { console.error('topics without taxonomy nodes:', orphans); process.exit(1); }
            // 3. Every pool item should have tags (warn-level: new waves get tagged post-merge)
            const untagged = [...d.items.map(i=>i.id), ...Object.keys(s.episodes)].filter(id=>!tg.tags[id]);
            if (untagged.length) console.warn('WARN untagged items:', untagged.length);

            // 4. Audio provenance (issue #21). A null audio_url is ALLOWED —
            // the item still appears in discovery and links out to Apple
            // Podcasts instead of playing in-app. A malformed one is not:
            // it would reach the player and fail at playback time.
            const audioItems = [...d.items, ...Object.values(s.episodes)];
            const withAudio = audioItems.filter(i=>i.audio_url);
            const badScheme = withAudio.filter(i=>!/^https:\/\//.test(i.audio_url));
            if (badScheme.length) { console.error('audio_url must be https:', badScheme.map(i=>i.id||i.title).slice(0,10)); process.exit(1); }
            // Corner case #9: a tokened URL is a secret and must never be published.
            const tokened = withAudio.filter(i=>/[?&](token|auth|api_?key|secret|password|session)=/i.test(i.audio_url));
            if (tokened.length) { console.error('audio_url looks tokened (secret leak):', tokened.map(i=>i.id||i.title).slice(0,10)); process.exit(1); }
            const noAudio = audioItems.length - withAudio.length;
            console.log('audio coverage:', withAudio.length + '/' + audioItems.length, '(' + noAudio + ' link-out only)');

            // 5. DAI flag (issue #22). It gates seek precision in #30, so a
            // playable item MUST carry a verdict — a missing flag would be read
            // as falsy and silently promise exact seeking on a stitched feed.
            const unflagged = withAudio.filter(i=>typeof i.dai_suspected !== 'boolean');
            if (unflagged.length) { console.error('playable items missing dai_suspected:', unflagged.map(i=>i.id||i.title).slice(0,10)); process.exit(1); }
            // Conversely, an unplayable item must not carry one — there is
            // nothing to seek in, and a stale flag outlives the URL that earned it.
            const strayFlag = audioItems.filter(i=>!i.audio_url && i.dai_suspected !== undefined);
            if (strayFlag.length) { console.error('items without audio carry dai_suspected:', strayFlag.map(i=>i.id||i.title).slice(0,10)); process.exit(1); }
            const dai = withAudio.filter(i=>i.dai_suspected).length;
            console.log('dai_suspected:', dai + '/' + withAudio.length, '(' + (withAudio.length - dai) + ' precise-seek eligible)');
            // 6. Transcript availability index (issue #104). Two invariants,
            // both cheap and both expensive to discover late.
            const ta = require('./data/transcript-availability.json');
            const taEpisodes = ta.shows.flatMap(s => s.episodes || []);
            // (a) It is an INDEX. A transcript body landing here is ~400MB of
            // repo growth against a 44MB data/ directory, and the pipeline's
            // rule is fetch-extract-discard.
            const bodyish = taEpisodes.filter(e => Object.values(e).some(v => typeof v === 'string' && v.length > 2000));
            if (bodyish.length) { console.error('transcript-availability.json stores transcript-body-sized strings:', bodyish.length); process.exit(1); }
            // (b) has_timestamps must agree with the recorded format. It is what
            // decides whether a segment boundary can be anchored (ADR-0007); a
            // drifted flag promises an anchor that fails silently at playback.
            const TIMED = new Set(['text/vtt','application/srt','application/x-subrip','application/json']);
            const badFlag = taEpisodes.filter(e => e.has_timestamps !== TIMED.has(e.transcript_type));
            if (badFlag.length) { console.error('has_timestamps disagrees with transcript_type:', badFlag.slice(0,5)); process.exit(1); }
            console.log('transcript availability:', ta.summary.episodes_with_transcript + '/' + ta.summary.episodes_total, '(' + ta.summary.transcript_coverage_pct + '%,', ta.summary.episodes_with_timed_transcript, 'anchorable)');
            console.log('data invariants ok');
          "
      - name: Verify deploy manifest is current
        # M4 (#233 remainder): deploy-manifest.json is generated, never
        # hand-edited. --check regenerates it in memory and fails loudly if the
        # committed copy has drifted from the tree — a stale manifest is
        # exactly what would let sw.js promote a torn deploy.
        run: node tools/ci/generate-manifest.mjs --check
      - name: Syntax-check site JS
        run: |
          node --check app.js
          node --check search-engine.js
      - name: Test suites (all of them — discovered, not listed)
        # ONE step for every committed suite: player/, test/, and everything
        # under tools/, including packages that carry their own dependencies.
        #
        # This replaced six per-directory steps (issue #140). Those steps were
        # a list someone had to remember to extend: a suite landing in a new
        # tools/<dir>/ executed nowhere, while test/suite-integrity.test.js —
        # which scans tools/ RECURSIVELY — floored it immediately. Floored but
        # unrun is worse than unfloored: it reads as coverage and is not.
        #
        # tools/ci/run-suites.mjs discovers suites exactly the way
        # suite-integrity does, and suite-integrity asserts the two agree in
        # both directions. So the invariant now holds by construction:
        # anything floored is executed, anything executed is floored. Neither
        # this file nor that one names a suite directory any more.
        #
        # Dependency-carrying directories (tools/corpus today) are handled by
        # the runner, not by an exception here: it runs `npm ci` and `npm test`
        # inside any directory whose package.json declares a test script, so
        # that package owns its own flags (corpus needs --experimental-sqlite
        # on this job's Node 22). The repo root stays dependency-free.
        #
        # Same job as before, deliberately: `data-and-site` is the required
        # check in the protect-main ruleset, so a suite moved to a new job
        # would gate nothing until that ruleset changed.
        run: node tools/ci/run-suites.mjs

      - name: Validate data/segments.json
        # Schema gate on the segment pool (#106, ADR-0007). Every record
        # carries the provenance it was validated against, so everything
        # except verbatim-ness — which needs the transcript — is re-checkable
        # offline. A hand-edited or half-written segments file fails here.
        run: node tools/segments/merge-segments.mjs --check
      - name: Validate semantic-index.json
        run: node tools/validate-semantic-index.mjs
      - name: Search-quality battery
        run: node tools/test-search.mjs

  playwright:
    # Real-Chromium browser-integration coverage for sw.js's M4 deploy-
    # manifest promotion logic (kanban card t_504fd5fd), on top of (never
    # replacing) the fast node:vm-based test/sw-generation.test.js suite the
    # `data-and-site` job above already runs — see test/playwright/README.md
    # for the full split.
    #
    # ADVISORY-ONLY ON FIRST LANDING, DELIBERATELY. protect-main's required
    # checks are matched BY NAME (`backend`, `data-and-site`) — see this
    # file's own `workflow_dispatch` comment above for that mechanism — so
    # this job is simply never added to that list; nothing else is needed to
    # keep it non-blocking. The reason is flakiness risk, not runtime: a
    # brand-new real-browser suite has had zero CI runs to prove it is
    # stable, and gating every PR on an unproven suite the first time it
    # exists would be a self-inflicted destabilization exactly like
    # `android-build.yml`'s own argument against becoming a required check.
    # Revisit after one full cycle of green (or reliably explicable) runs —
    # promote it into protect-main's required-checks list at that point,
    # rather than leaving it advisory forever.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: test/playwright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: test/playwright/package-lock.json
      - run: npm ci
      - name: Install Chromium (with OS deps)
        run: npx playwright install --with-deps chromium
      - run: npm test
