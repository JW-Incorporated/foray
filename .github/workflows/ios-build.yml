# Build the iOS shell on a macOS runner, and settle three things we only believe.
#
# Issue #38 (MP4). Stacks on #209 (#36's `mobile/` scaffold), which must merge first.
#
# ── WHY THIS IS WORTH MORE THAN A BUILD ──────────────────────────────────────
#
# Nothing in #209 was ever generated, installed or compiled — its own §0 says so
# in a table. GitHub's macOS runners have Xcode AND the iOS Simulator, which
# means CI can do three things no one can do from the Windows machine this
# project is developed on, each of which is currently an unverified assumption
# blocking a decision:
#
#   1. PROVE THE SHELL BUILDS. `npx cap add ios` then `xcodebuild` turns "should
#      work" into "does work", and any failure found here is one a founder does
#      not have to discover on their own Mac.
#   2. MEASURE WHAT #209 ONLY REASONED. Capacitor injects its bridge as an INLINE
#      script and our CSP is `script-src 'self'` with no `'unsafe-inline'`. If it
#      is blocked there is no `window.Capacitor`, four plugins are dead, and the
#      shell loses one of the two signals that keep the service worker off.
#      `docs/mobile-shell.md` §5 argues iOS is *probably* fine (WKWebView injects
#      via `WKUserScript`, outside the document's CSP) and says plainly that
#      nothing was built to check. The bridge probe checks it. The RISK that
#      section names is Android's, by a different mechanism, and stays open.
#   3. ATTACK MP1's MOST LOAD-BEARING INFERENCE. MP1 (#207) concluded iOS keeps
#      backgrounded audio with one Info.plist line, but whether our OUT-POINT
#      still fires rests on `timeupdate` surviving backgrounding — explicitly the
#      least-verified claim in that document. A missed out-point costs a median
#      936.5 s: 15.6 minutes of the wrong episode. The out-point probe backgrounds
#      the Simulator and measures how far past `end_sec` playback gets.
#      SETTLED, run 32026332637: overshoot 0.0045 s over a 15.056 s hidden window
#      with the app never resumed. The inference HELD, and iOS needs no native
#      out-point. (An earlier run's `fired-on-resume` was a harness race with a
#      3 ms overshoot; see `docs/ios-ci.md` §4b. Do not re-quote it.)
#   4. MEASURE THE THING (3) DOES NOT COVER — THE SEAM TRANSITION. A Foray is 32
#      segments joined by 31 transitions, and a transition is a `setTimeout` beat
#      plus a fresh cross-episode load, not a media event. The SAME run that
#      settled (3) measured hidden DOM timers aligned to a median of 1000 ms — the
#      clock the beat runs on. If the chain breaks, a locked-screen listener hears
#      one segment and then silence for the commute, which no out-point accuracy
#      fixes. The seam probe drives the real `PlayerQueueManager` across three
#      bounded segments on three files and reports, per transition, whether the beat
#      fired, the next file loaded, and it became audible — all backgrounded, with
#      the app never resumed before the record is read.
#
# A SIMULATOR IS NOT A DEVICE. It does not model power management or true
# suspension, so a PASS on (3) is weaker evidence than a FAILURE would be. That
# caveat ships with every number this workflow prints; it is in
# `tools/mobile/ios-ci.mjs` as `SIMULATOR_CAVEAT` so it cannot be dropped from
# one report and kept in another.
#
# ── COST, AND WHY THIS IS NOT A REQUIRED CHECK ───────────────────────────────
#
# MEASURED, 2026-08-17: a full green run of the SINGLE-PASS version — both builds,
# simulator boot, the bridge and out-point probes, report and artifact upload —
# took 8 min 19 s of wall clock per run (run 32023924627). macOS runners bill at
# 10x Linux minutes, so ~85 billable minutes if this repo were private. The first
# estimate here said 12-18 minutes; it is replaced rather than kept, but the
# distinction is why `docs/ios-ci.md` labels every figure — an estimate quoted as a
# measurement is the specific mistake `docs/research/mp1-background-audio.md` §1
# keeps a whole table to avoid.
#
# ESTIMATED, and deliberately labelled as such: the seam pass added below is a
# second install + launch + a 15 s and 90 s window, about 95 s more, so ~10 minutes
# and ~100 billable minutes. Replace this line with the measured figure from the
# first run that includes it; do not quote it as one until then.
#
# It is PUBLIC, and GitHub charges nothing for standard runners on public repos,
# which is also why `ci.yml`'s `ios-kit` job can run `macos-latest` on every PR
# today. Both numbers are stated because the second one changes the moment the
# repo does: a sister project already suspected Actions-minutes exhaustion as the
# root cause of a build freeze, and "it was free when we wrote it" is not a design.
#
# So it is designed for infrequency: manual dispatch, plus a path filter narrow
# enough that ordinary data/docs/backend PRs never trigger it. It is NOT in the
# `protect-main` ruleset and must not become required — the required checks
# are `REQUIRED_CHECKS` in `tools/ci/path-policy.mjs`, and adding a 15-minute macOS job to
# that set would put every content PR behind an iOS build.
#
# It also does not touch `ci.yml`. `ios-kit` (`swift test --package-path
# ios/ForayKit`) keeps running exactly as before: `ios/` is the separate SwiftUI
# target #209 deliberately left in place, and `mobile/ios/` is the shell.
#
# ── R-05: THIS WORKFLOW NO LONGER SIGNS OR UPLOADS ANYTHING ──────────────────
#
# Retired 2026-09-07 (docs/release-lockstep-plan.md R-05), once R-03's
# `release.yml` had a green run on `main`. Before R-05 this file archived,
# signed and uploaded to TestFlight from any push or dispatch on `main` — a
# second, independently-drifting copy of exactly what `release.yml`'s
# `.github/actions/ios-archive` composite now does as the ONE upload path.
# `ios-build.yml` is CI now, not release: it proves the shell builds and runs
# the bridge/out-point/seam probes, and it stops there. The build stays
# UNSIGNED by construction (`CODE_SIGNING_ALLOWED=NO`), which is what keeps it
# runnable with no Apple account at all. See `docs/releases.md` for how a real
# release (and its TestFlight upload) actually happens now, and
# `docs/ios-ci.md` §5's old "download and submit by hand" text for why that is
# the exception path today, not the process.

name: ios-build

on:
  workflow_dispatch:
    inputs:
      probes:
        description: "Boot the iOS Simulator and run the bridge, out-point and seam-transition probes"
        type: boolean
        default: true
  pull_request:
    # Narrow on purpose — see the cost note above. `.github/workflows/ios-build.yml`
    # is in the list so a change to this file is exercised by the PR that makes it,
    # which is the only way a CI-only change can be reviewed against real output.
    paths:
      - "mobile/**"
      - "tools/mobile/**"
      - "index.html"
      - "app.js"
      - "player/**"
      # NE-06 (docs/native-engine-plan.md §6.8, G-1a): the native engine's
      # parity fixtures and their recorder are not what the shell is built
      # from. They are read by `swift test` on the engine core, which
      # ci.yml's `engine-parity` (Linux) and `ios-kit` (macOS) run on every
      # PR; a 15-minute Simulator build per re-record would learn nothing.
      # A NEGATION ONLY WORKS AFTER THE PATTERN IT NARROWS, so these stay
      # below `player/**`. `tools/parity/**` matches nothing above today; it
      # is listed so that a later widening (to `tools/**`, say) cannot pull
      # the recorder in without deleting a line that says why not.
      - "!player/parity/**"
      - "!tools/parity/**"
      - ".github/workflows/ios-build.yml"
      # The inject sequence this job runs (and the release archive runs too):
      # a change to it is exercised here, on the PR that makes it.
      - ".github/actions/ios-prepare/**"

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios-shell:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      APP_ID: ai.jwlabs.foura
      # IOS_DIR, INFO_PLIST, APPICONSET and SPLASHSET are set by
      # .github/actions/ios-prepare, which owns every edit to those paths.
      # $XC_FLAG and $XC_PATH are NOT set here: what xcodebuild gets pointed at
      # depends on what `cap add ios` generated, and the first run of this workflow
      # is what established that Capacitor 8 uses Swift Package Manager and emits
      # NO `.xcworkspace`. See the "Which Xcode container" step.
      # DELIBERATELY NOT `${{ runner.temp }}` HERE. The `runner` context is not
      # available in a job-level `env:` block (GitHub's availability table allows
      # github/needs/strategy/matrix/vars/secrets/inputs there and nothing else),
      # and an unavailable context is a workflow-compile error, not an empty
      # string — the whole job would never start. The paths are set from
      # $RUNNER_TEMP in the first step instead.
      #
      # `false` only via an explicit dispatch input; every other trigger probes.
      # Note this reads `github.event.inputs.probes`, which for a typed boolean is
      # the STRING "false" — truthy in a GitHub expression, so `a && b || c`
      # yields "false" and the step guards below match on it. Switching to the
      # `inputs.probes` context (a real boolean) would make `a && false || 'true'`
      # evaluate to 'true' and silently re-enable the probes.
      PROBES: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.probes || 'true' }}

    steps:
      - uses: actions/checkout@v4
        # Full history (blobless: commits and trees only, cheap). The bundle's seed
        # pointer is dated by the newest commit that touched a stamp input
        # (tools/ci/generate-manifest.mjs, stampTimestamp); a shallow clone cannot
        # see it, and the seed then ships without a pointer (PR #795 review).
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Release gate — the privacy tripwire (S-08)
        # THE FIRST STEP THAT CAN FAIL THIS JOB, DELIBERATELY. Off-device
        # Shows/playlist search shipping while docs/legal/privacy-policy.md
        # still promises no such thing is a legal-accuracy defect, not a
        # build defect, and this repo's rule (4a-shows-pipeline-plan.md D4,
        # card S-08) is that no release build may even START in that state.
        # See test/release-gates.test.js's own header for the full mechanism
        # (the SHOWS_SEARCH_OFF_DEVICE flag, the two ways it can be set, and
        # why the check is an AND rather than either condition alone) and
        # HUMAN-ACTIONS.md's G5 item for the human action that resolves it.
        run: node --test test/release-gates.test.js

      - name: Toolchain versions (the first thing to read when this breaks)
        run: |
          set -euo pipefail
          echo "ART=$RUNNER_TEMP/ios-ci"   >> "$GITHUB_ENV"
          echo "DD_SIM=$RUNNER_TEMP/dd-sim" >> "$GITHUB_ENV"
          echo "DD_DEV=$RUNNER_TEMP/dd-dev" >> "$GITHUB_ENV"
          # ONE resolved SwiftPM tree for both builds, at a path this workflow
          # chooses rather than one Xcode derives from a hash of the project path.
          # The MinimumOSVersion patch below has to find the downloaded binary
          # xcframeworks (ONNX Runtime's, until CH-20; Capacitor's and Cordova's),
          # and "wherever DerivedData put it" is not a location a build step can
          # assert against.
          echo "SPM_DIR=$RUNNER_TEMP/ios-spm" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/ios-ci"
          { sw_vers; xcodebuild -version; echo "sqlite3 $(sqlite3 --version)"; pod --version; } \
            | tee "$RUNNER_TEMP/ios-ci/toolchain.txt"

      # ── the parts a Mac is actually needed for ──────────────────────────────

      - name: Install the shell's dependencies
        # `mobile/` carries its own package.json precisely so the repo root stays
        # dependency-free (#209 §2.4), and mobile/package-lock.json IS committed,
        # so this is `npm ci` (ci-release-12), as on every Android path. It still
        # prints the resolved versions.
        working-directory: mobile
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm ls --depth=0 | tee "$ART/mobile-deps.txt"

      - name: Build the webDir and generate the iOS project
        # `npm run add:ios` is the committed script (prepare:webdir && cap add ios),
        # used rather than re-spelling the commands so this workflow cannot drift
        # from what HUMAN-ACTIONS.md #16 tells a human on a Mac to run.
        working-directory: mobile
        run: |
          set -euo pipefail
          set -o pipefail
          npm run add:ios 2>&1 | tee "$ART/cap-add-ios.log"
          # No `test -f .../App.xcworkspace` here any more, and the first run of
          # this workflow is why: Capacitor 8's iOS template is Swift Package
          # Manager, so there is no CocoaPods workspace to assert. The tree is
          # recorded instead, and the next step decides what to build.
          find ios -maxdepth 4 -not -path '*/public/*' | sort | tee "$ART/ios-tree.txt"

      - name: The iOS inject sequence (.github/actions/ios-prepare)
        # ONE COPY, RUN BY BOTH iOS BUILD PATHS (CH2-16, T2-01). The edits `cap
        # add ios` does not make (seam jingle, UIBackgroundModes, the encryption
        # declaration, the privacy manifest, the REAL icon and splash), each with
        # its second opinions (PlistBuddy, plutil, json.tool, --check), the
        # SwiftUI-scaffold guard, the Xcode container detection, and the
        # MinimumOSVersion patch on the resolved SwiftPM tree. The release
        # composite (.github/actions/ios-archive) runs the same action, so this
        # PR-time build exercises exactly what the TestFlight archive does; the
        # two used to be hand copies, and the archive's had lost the second
        # opinions. AFTER `cap add ios` (it edits what that generated) and
        # BEFORE either build (a build before it compiles the placeholders).
        # Reads $ART and $SPM_DIR from the toolchain step; leaves $XC_FLAG,
        # $XC_PATH and the project paths in $GITHUB_ENV for the builds below.
        uses: ./.github/actions/ios-prepare

      - name: Build for the iOS Simulator (unsigned by construction)
        # The primary build verdict, and the artefact the probes run in. A
        # simulator build needs no signing identity at all, which is why it is
        # first: it is the build that can always run.
        id: build_sim
        run: |
          set -euo pipefail
          if ! xcodebuild \
              "$XC_FLAG" "$XC_PATH" -scheme App -configuration Debug \
              -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath "$DD_SIM" -clonedSourcePackagesDirPath "$SPM_DIR" \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
              build > "$ART/xcodebuild-simulator.log" 2>&1; then
            echo "::group::xcodebuild (simulator) tail"; tail -300 "$ART/xcodebuild-simulator.log"; echo "::endgroup::"
            exit 1
          fi
          grep -E "^\*\* BUILD (SUCCEEDED|FAILED)" "$ART/xcodebuild-simulator.log" | tail -1
          APP="$DD_SIM/Build/Products/Debug-iphonesimulator/App.app"
          test -d "$APP"
          test -f "$APP/public/index.html"
          # NE-34's jingle reached the BUILT bundle where InterludePlayer looks
          # (tools/mobile/inject-interlude.mjs; not a SwiftPM resource, which
          # breaks the signed archive).
          test -f "$APP/public/player/assets/interlude-placeholder.wav"
          echo "app=$APP" >> "$GITHUB_OUTPUT"
          du -sh "$APP" | tee -a "$ART/app-size.txt"

      - name: Assert the icon really reached the BUILT asset catalog
        # THE SECOND OPINION ON THE ICON, and it is a different claim from the
        # `--check` in ios-prepare. That one says our bytes are in the SOURCE catalog; this
        # one says Xcode compiled them into the BUNDLE. Between the two sits
        # `actool`, which can leave an icon out for reasons no source-side check can
        # see -- a wrong ASSETCATALOG_COMPILER_APPICON_NAME, a catalog Xcode never
        # looked at -- and every one of those failures produces a green build and a
        # placeholder on the home screen and the store listing alike.
        #
        # NEVER EXECUTED before this PR, like everything else in this workflow that
        # only a Mac can run. If it goes red on the first run, read
        # $ART/assets-car.txt and $ART/built-info-plist-icon.txt before assuming the
        # icon is missing -- the likelier fault is which key Xcode wrote.
        run: |
          set -euo pipefail
          APP="${{ steps.build_sim.outputs.app }}"
          # The compiled catalog itself. An .app whose Assets.car is missing has no
          # icon at all, whatever the source directory said.
          test -f "$APP/Assets.car"
          # Xcode names the asset it took the icon from in the BUILT Info.plist.
          # Both spellings are accepted because Xcode writes both and has moved
          # between them; failing to find EITHER is still fatal.
          NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIconName" "$APP/Info.plist" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName" "$APP/Info.plist")
          echo "$NAME" | tee "$ART/built-info-plist-icon.txt"
          test "$NAME" = "AppIcon"
          # And Apple's own catalog reader, as the equivalent of PlistBuddy above.
          xcrun assetutil --info "$APP/Assets.car" | tee "$ART/assets-car.txt" > /dev/null
          grep -qi "AppIcon" "$ART/assets-car.txt"

      - name: Build for a real device's architecture, unsigned
        id: build_dev
        # Not the same compile as the simulator one — arm64-device, Release, and
        # the configuration a TestFlight build would use. It proves the shipping
        # target compiles without needing any of the credentials that do not
        # exist yet. It cannot prove it INSTALLS; that needs signing.
        run: |
          set -euo pipefail
          if ! xcodebuild \
              "$XC_FLAG" "$XC_PATH" -scheme App -configuration Release \
              -sdk iphoneos -destination 'generic/platform=iOS' \
              -derivedDataPath "$DD_DEV" -clonedSourcePackagesDirPath "$SPM_DIR" \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
              build > "$ART/xcodebuild-device.log" 2>&1; then
            echo "::group::xcodebuild (device) tail"; tail -300 "$ART/xcodebuild-device.log"; echo "::endgroup::"
            exit 1
          fi
          grep -E "^\*\* BUILD (SUCCEEDED|FAILED)" "$ART/xcodebuild-device.log" | tail -1

      - name: Every embedded framework carries what App Store Connect requires
        # THE GUARD, and it is a different claim from ios-prepare's patch step. That
        # one says our bytes are in the resolved SwiftPM artifact; this one says
        # Xcode EMBEDDED them — read off the arm64/Release `App.app`, which is the
        # same assembly a TestFlight archive produces. Between the two sits the
        # embed phase, which can copy a slice we never patched.
        #
        # RUN HERE, ON EVERY PR THAT TOUCHES mobile/, because this is the cheapest
        # place the check exists at all: the release path has the same step, but a
        # release run happens on a tag, after review, which is precisely when
        # finding this is most expensive. The next embedded binary with a thin
        # plist goes red here rather than at Apple.
        #
        # macOS-ONLY, and honestly so: it reads BINARY plists through `plutil`.
        # The decisions it makes are unit-tested on Windows in
        # tools/mobile/ios-embedded-frameworks.test.mjs; only the read is not.
        run: |
          set -euo pipefail
          node tools/mobile/ios-embedded-frameworks.mjs verify \
            "$DD_DEV/Build/Products/Release-iphoneos/App.app" | tee "$ART/embedded-frameworks.txt"

      - name: Assert the privacy manifest really reached the BUILT bundle
        # The second opinion on #948, and a different claim from ios-prepare's `--check`:
        # that one says the project LISTS the manifest; this one says Xcode COPIED
        # it to the root of the arm64/Release App.app (the same assembly an archive
        # makes) and that it still says what we declare. The copy lands in the
        # uploaded evidence so #948 can be closed on an artifact, not a belief.
        # Xcode's "Generate Privacy Report" stays a human step on a Mac.
        run: |
          set -euo pipefail
          APP="$DD_DEV/Build/Products/Release-iphoneos/App.app"
          node tools/mobile/inject-privacy-manifest.mjs --bundle "$APP" | tee "$ART/privacy-manifest-bundle.txt"
          cp "$APP/PrivacyInfo.xcprivacy" "$ART/built-PrivacyInfo.xcprivacy"

      - name: List every privacy manifest in the BUILT bundle, and fail on an uncovered plugin
        # #948's aggregate half, without a Mac: one row per bundle in the
        # arm64/Release App.app (the app, each framework and resource bundle),
        # whether it carries a PrivacyInfo.xcprivacy, and which Required Reason
        # API types it declares. Red when a bundled plugin known to call one
        # (@capacitor/preferences: UserDefaults) is covered by neither its own
        # manifest nor the app target's. `--mobile mobile` makes a stale plugin
        # class name a failure instead of a silent "not bundled". Xcode's
        # Generate Privacy Report stays the human step #948 is open for.
        run: |
          set -euo pipefail
          node tools/mobile/privacy-manifest-report.mjs \
            "$DD_DEV/Build/Products/Release-iphoneos/App.app" --mobile mobile \
            | tee "$ART/privacy-manifest-report.txt"

      # ── the two measurements ────────────────────────────────────────────────

      - name: Choose and boot a simulator
        id: sim
        if: env.PROBES != 'false'
        # A simulator that will not boot is a MEASUREMENT failure, not a build
        # failure, and turning a successful build red for it would be the exact
        # conflation this workflow argues against. The dependent steps guard on
        # `steps.sim.outcome == 'success'`, so the chain degrades to "we learned
        # nothing today" and the verdict step says so.
        continue-on-error: true
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > "$ART/simctl-devices.json"
          node tools/mobile/ios-ci.mjs pick-simulator "$ART/simctl-devices.json" | tee "$ART/simulator.txt"
          UDID=$(sed -n 's/^udid=//p' "$ART/simulator.txt")
          test -n "$UDID"
          xcrun simctl bootstatus "$UDID" -b

      - name: Install the probed app
        # The probe goes into a COPY of the built .app, not into `mobile/www`:
        # the build verdict above is therefore of the CLEAN bundle, and this needs
        # no second xcodebuild. `install-probe.mjs` refuses to write anywhere that
        # looks like a source checkout.
        id: probe_install
        if: env.PROBES != 'false' && steps.sim.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          UDID="${{ steps.sim.outputs.udid }}"
          PROBED="${{ runner.temp }}/App-probe.app"
          rm -rf "$PROBED"
          cp -R "${{ steps.build_sim.outputs.app }}" "$PROBED"
          # `--phase outpoint` is the FIRST of two passes. See the probe step: both
          # measurements need the same scarce resource — a window in which the app is
          # backgrounded — and running them on one page would have a JavaScript
          # <audio> element and a native AVPlayer audible at once, after which "what
          # stopped the audio" stops being answerable.
          node tools/mobile/probe/install-probe.mjs "$PROBED/public" --phase outpoint
          # Editing resources invalidates the ad-hoc signature. The Simulator does
          # not enforce it, but re-signing costs nothing and removes a variable.
          codesign --force --sign - "$PROBED" || true
          xcrun simctl install "$UDID" "$PROBED"
          # NE-36: PIN THE JS-LANE PASSES TO THE LEGACY LANE. The native engine is
          # the build default since the M1 flip; the out-point and seam passes drive
          # the JS player on purpose and must not run with a native engine holding
          # the session under them. The engine decides its lane once per process, at
          # launch, so the seed goes in with the app not running. Its own file, NOT
          # native-steps.txt: that file's presence is what tells the verdict the
          # native pass ran. The bridge record's engineHello answer (`legacy` /
          # `override`) is the smoke that proves the seed took.
          node tools/mobile/ios-ci.mjs seed-mode "$UDID" "$APP_ID" web >> "$ART/lane-seeds.txt"
          echo "probed=$PROBED" >> "$GITHUB_OUTPUT"

      - name: Run the probes (two passes — the out-point, then the SEAM TRANSITION)
        id: probe_run
        if: env.PROBES != 'false' && steps.probe_install.outcome == 'success'
        continue-on-error: true
        # TWO PASSES IN ONE STEP, ONE CONTAINER READ AT THE END.
        #
        # Pass 1 answers "does the STOP survive backgrounding". Run 32026332637
        # answered it: yes, 4 ms late over a 15.056 s hidden window. Pass 2 answers
        # the question that result does NOT settle — "does the TRANSITION survive
        # backgrounding" — and it is a different mechanism: a `setTimeout` for the
        # seam beat (SEAM_GAP_SEC, 0.5 s), then a fresh media load of a DIFFERENT file, then a seek, then
        # play. Pass 1's own numbers are why it is worth asking separately: the same
        # page measured hidden DOM timers aligned to a median of 1000 ms, so the beat
        # is scheduled on the one clock that IS throttled.
        #
        # They cannot share one page: both need the same scarce resource, a window in
        # which the app is backgrounded, and pass 1 spends its whole window proving a
        # single boundary. So the app is reinstalled with the other phase between
        # them. The container SURVIVES the reinstall, which is why one read at the end
        # collects both records — the localStorage keys are distinct.
        #
        # COST: about 95 s more than a single pass, on a runner that bills at 10x —
        # roughly 16 more billable minutes. Stated because the alternative is one
        # measurement and one inference, and inferences quoted as measurements are
        # what this whole workflow exists to stop.
        #
        # THE TIMELINE — AND NOTE WHAT IT NO LONGER DECIDES.
        #   t+0   launch. probe-bridge.js snapshots window.Capacitor immediately,
        #         re-checks at 3 s (in case the bridge is injected late), reads
        #         navigator.serviceWorker.getRegistrations(), then navigates to
        #         the out-point probe, which starts playing the tone.
        #   t+14  BACKGROUNDED by foregrounding Settings. There is no simctl
        #         "press home"; launching another app is how you background one.
        #   t+64  50 s later. Screenshot, then read WebKit's local storage.
        #
        # THE BOUNDARY IS NOT ON THIS CLOCK, and that is the fix for the defect the
        # first two runs exposed. `simctl launch com.apple.Preferences` returns as
        # soon as the launch is ACCEPTED; on a cold-booted simulator Settings took
        # about ten more seconds to actually reach the foreground. With a fixed
        # `end_sec = 25` that left a hidden window of 0.446 s on one run, and a
        # boundary crossed while still visible on the next — two different verdicts
        # from identical code, neither of them a measurement.
        #
        # So probe-outpoint.js arms the out-point at `currentTime + 15` on the first
        # `visibilitychange` to hidden. However long backgrounding takes, the
        # boundary is 15 s INSIDE the hidden window, and `outPointVerdict` refuses
        # to call anything a pass below 5 s of observed hidden playback. The sleeps
        # below only need to be generous, not accurate.
        #
        # ~80 s total against a 150 s tone — the audio must never be the thing that
        # stops playback, or a natural end would be mistaken for a boundary.
        # The app is NOT relaunched to read the results: `simctl launch` on a
        # running app can restart it, and a restart would erase the very
        # measurement it was launched to collect. (probe-outpoint.js also refuses
        # to clobber a completed record, so a restart is survivable — but not
        # relying on that is cheaper than relying on it.)
        run: |
          set -euo pipefail
          UDID="${{ steps.sim.outputs.udid }}"
          # NARROWED TWICE, and run 32036295743 is why the second time was needed.
          #
          # First narrowing: `log stream --level debug` with no predicate is a
          # whole-device firehose, and the reporting step's `grep -o` over the
          # result ran for more than seven minutes on a runner that bills at 10x.
          #
          # SECOND NARROWING — MEASURED ON 32036295743'S OWN ARTIFACT. The old
          # predicate was `processImagePath CONTAINS "App"`, which matches most of
          # the system: the capture hit the 20 MB cap in **73 seconds** and covered
          # 13:45:30-13:46:44 only, so pass 2 -- the SEAM measurement, the entire
          # point of that run -- began at 13:47:08 and was **never logged at all**.
          # Signal ratio in what it did capture: **1,153 of 99,491** timestamped
          # lines came from our process (~1.2%).
          #
          # MATCH ON THE PROCESS NAME, WHICH IS `App`. A first attempt at this fix
          # used `processImagePath CONTAINS` THE BUNDLE ID -- `$APP_ID`, set at the
          # top of this job; named by reference rather than quoted as a literal so
          # that the next id change cannot stale this paragraph, which is what
          # happened on 2026-08-24 -- and it would
          # have matched NOTHING: for a simulator app `processImagePath` is the host
          # path to the executable inside the *Bundle* container
          # (.../Application/<UUID>/App.app/App), and the bundle id appears only in
          # the Data container's WebKit subdirectory. That would have silently
          # degraded the capture to the `WebKit` clause alone and dropped every
          # UIKit, BackBoard and runningboard line -- including the RBS assertion
          # lines section 4c now cites as evidence. `process == "App"` is exact and
          # is what the log's own `App[19964:...]` prefix shows.
          #
          # NEITHER PREDICATE HAS BEEN EXECUTED. There is no Mac here; the next run
          # of this workflow is the first test of it. If `simulator-log-seam.txt`
          # comes back tiny or empty, suspect this line first and check what the
          # `App[<pid>]` prefix actually is in the run's own log.
          #
          # Each pass also gets its OWN file and its own cap: a cap shared across
          # passes is spent by whichever runs first, which is never the interesting
          # one.
          start_log() {   # $1 = destination file
            xcrun simctl spawn "$UDID" log stream --style compact \
              --predicate 'process == "App" OR senderImagePath CONTAINS "WebKit"' \
              2>&1 | head -c 20000000 > "$1" &
            LOG_PID=$!
          }
          stop_log() { kill "${LOG_PID:-}" 2>/dev/null || true; }
          start_log "$ART/simulator-log.txt"
          trap 'stop_log' EXIT

          background_it() {
            echo "--- backgrounding by foregrounding Settings ---"
            xcrun simctl launch "$UDID" com.apple.Preferences \
              || xcrun simctl launch "$UDID" com.apple.mobilesafari
          }

          # ── PASS 1: the JavaScript out-point (phase `outpoint`) ───────────────
          xcrun simctl launch "$UDID" "$APP_ID"
          sleep 14
          xcrun simctl io "$UDID" screenshot "$ART/01-playing.png" || true
          background_it
          sleep 60
          xcrun simctl io "$UDID" screenshot "$ART/02-backgrounded.png" || true

          # ── PASS 2: the SEAM TRANSITION (phase `seam`) ────────────────────────
          #
          # THE APP IS NEVER BROUGHT BACK BEFORE THE RECORD IS COLLECTED. `simctl
          # terminate` kills the outgoing app rather than foregrounding it, and the
          # localStorage read below touches files on disk. That matters because the
          # failure being looked for is "playback stops after one segment while the
          # screen is locked", and an app that gets resumed would complete the
          # transition on resume and look fine.
          #
          # `probe-seam.js` carries pass 1's hard-won lesson: it arms the first
          # boundary at `currentTime + 15` on the first `visibilitychange` to hidden,
          # so however long `simctl launch com.apple.Preferences` takes to actually
          # foreground Settings (39 s in run 32025079276, ~33 s in 32026332637), the
          # whole chain — boundary, beat, cross-file load, seek, play, second
          # boundary, second beat — happens INSIDE the hidden window, and
          # `seamTransitionVerdict` refuses a pass on too small a hidden window.
          echo "--- pass 2: reinstalling with the seam probe phase ---"
          # A FRESH LOG FILE FOR THE SEAM PASS. See the capture comment above: on
          # 32036295743 the single shared capture was exhausted by pass 1 and the
          # seam pass had no log coverage whatsoever. The two passes answer
          # different questions and each gets its own budget.
          stop_log
          start_log "$ART/simulator-log-seam.txt"
          xcrun simctl terminate "$UDID" "$APP_ID" || true
          node tools/mobile/probe/install-probe.mjs \
            "${{ steps.probe_install.outputs.probed }}/public" --phase seam
          codesign --force --sign - "${{ steps.probe_install.outputs.probed }}" || true
          xcrun simctl install "$UDID" "${{ steps.probe_install.outputs.probed }}"
          # NE-36: the seam pass is a JS-lane pass too — re-pin it to legacy after
          # the reinstall, before its launch (see the install step).
          node tools/mobile/ios-ci.mjs seed-mode "$UDID" "$APP_ID" web >> "$ART/lane-seeds.txt"
          xcrun simctl launch "$UDID" "$APP_ID"
          sleep 15
          xcrun simctl io "$UDID" screenshot "$ART/03-seam-playing.png" || true
          background_it
          # 90 s: 15 s of hidden playback before the first boundary, then two beats
          # (2 s each) and two more segments (8 s and 6 s) — about 33 s of hidden
          # chain — with the rest absorbing however late Settings foregrounds (39 s,
          # measured, in run 32025079276). `ios-workflow.test.mjs` pins this floor.
          # 90 s, AND THE DERIVATION BELOW IS THE MEASURED ONE, NOT THE DESIGNED ONE.
          # The first version of this comment budgeted "two beats (2 s each) and two
          # more segments (8 s and 6 s) - about 33 s of hidden chain". The beat is
          # not 2 s: run 32036295743 measured **9,153 ms** for it, because the beat
          # is `max(gap, load)` (queue-manager.js section 10) and the load dominated.
          # Re-derived at the measured beat:
          #
          #   15.000 s  hidden playback before boundary 1 (ARM_AFTER_HIDDEN_SEC)
          #    9.153 s  beat 1                    <- measured, not assumed
          #    8.000 s  seg-b (12 -> 20)
          #    9.153 s  beat 2 (same assumption)
          #    0.000 s  seg-c becomes audible = transition 2 completes
          #   --------
          #   41.306 s, call it ~45 s with a save interval and margin.
          #
          # (Unrounded on purpose: 15 + 9.2 + 8 + 9.2 sums to 41.4, and this file is
          # in a PR about not mislabelling arithmetic.)
          #
          # 90 s therefore still clears MIN_HIDDEN_TRANSITIONS = 2 with ~2x headroom
          # -- even two worst-case beats at SEAM_BAD_MS = 15 s need only 53 s by the
          # same method (15 + 15 + 8 + 15), or 59 s if seg-c must also play out --
          # so it
          # is NOT raised here -- macOS minutes bill at 10x and this workflow's cost
          # section is explicit about that. What changed is that the number now has a
          # derivation that matches reality.
          #
          # IF YOU CHANGE `SEAM_GAP_SEC` OR THE TONE LENGTHS, redo this arithmetic.
          # `ios-workflow.test.mjs` pins the floor so it cannot be trimmed silently.
          sleep 90
          xcrun simctl io "$UDID" screenshot "$ART/04-seam-backgrounded.png" || true

          # ── collect, once, with the app still in the background ───────────────
          #
          # WebKit batches localStorage writes, so give it a beat, then copy the
          # databases before reading them — never read a file another process has
          # open.
          sleep 3
          CONTAINER=$(xcrun simctl get_app_container "$UDID" "$APP_ID" data)
          echo "container=$CONTAINER"
          # THE RAW DATABASES STAY OUT OF $ART, AND THAT IS A SECURITY BOUNDARY,
          # NOT TIDINESS. A `.localstorage` file holds every value the app ever
          # wrote, including `cp_sb_session` — a live Supabase access token, and
          # per STATE.md the only credential that can reach that account's server
          # rows. This repo is PUBLIC and the upload step below is `if: always()`,
          # so anything under $ART shipped to anyone who clicks the run. The
          # databases are copied to a work directory instead, read there, and
          # never uploaded; only the redacted JSON crosses into $ART. Do not
          # "helpfully" put the .sqlite copies back in the artifact for
          # debugging — ls-files.txt and container-tree.txt already answer the
          # question they were there for (did the pattern match anything).
          WORK="$RUNNER_TEMP/ios-ci-ls-work"
          rm -rf "$WORK" && mkdir -p "$WORK"
          # DELIBERATELY LOOSE PATTERNS. WebKit has moved and renamed this file
          # more than once (`*.localstorage`, `local-storage.sqlite3`,
          # `localstorage.sqlite3`, under a salted WebsiteData path), and a
          # runner-image bump can change it again. A pattern that stops matching
          # produces an empty read, two `inconclusive` verdicts and a GREEN job —
          # #38 producing nothing forever with no error anywhere. So match on the
          # substring, and dump the whole tree as a fallback for a human.
          find "$CONTAINER" \( -iname '*localstorage*' -o -iname '*local-storage*' \) -print \
            > "$ART/ls-files.txt" || true
          find "$CONTAINER" -type f > "$ART/container-tree.txt" 2>/dev/null || true
          cat "$ART/ls-files.txt"
          i=0
          while IFS= read -r db; do
            [ -n "$db" ] || continue
            case "$db" in *-wal|*-shm) continue ;; esac
            i=$((i+1))
            # `-wal`/`-shm` too: an unflushed write lives in the write-ahead log,
            # and copying the main file alone would silently drop it.
            cp "$db" "$WORK/db-$i.sqlite" || continue
            [ -f "$db-wal" ] && cp "$db-wal" "$WORK/db-$i.sqlite-wal" || true
            [ -f "$db-shm" ] && cp "$db-shm" "$WORK/db-$i.sqlite-shm" || true
            sqlite3 -json "$WORK/db-$i.sqlite" "select key, hex(value) as hexval from ItemTable" \
              > "$WORK/ls-rows-$i.json" 2>>"$ART/ls-errors.txt" || true
            # Redact IN THE WORK DIR, then move. The unredacted array never
            # exists at any path under $ART, not even for an instant, because
            # the upload runs `if: always()` and a failure in between would
            # publish whatever was there.
            #
            # A redaction failure is FAIL-CLOSED AND LOUD, in that order. Closed
            # because the alternative is publishing a token; loud because the
            # quiet version of this — no rows, two `inconclusive` verdicts, a
            # green job — is the exact silent-nothing failure the loose glob
            # above exists to avoid. Redaction is our own tested code, so it
            # failing is a bug here and deserves a red run, not a shrug.
            if node tools/mobile/ios-ci.mjs redact-localstorage "$WORK/ls-rows-$i.json" \
                 2>>"$ART/ls-errors.txt"; then
              mv "$WORK/ls-rows-$i.json" "$ART/ls-rows-$i.json"
            else
              echo "REDACTION FAILED for db-$i - refusing to publish its rows" \
                | tee -a "$ART/ls-errors.txt"
              REDACT_FAILED=1
            fi
          done < "$ART/ls-files.txt"
          # `done < file` is a redirect, not a pipe, so the loop ran in this
          # shell and the flag survives it.
          if [ -n "${REDACT_FAILED:-}" ]; then
            echo "::error::localStorage redaction failed; no rows were published"
            exit 1
          fi
          echo "read $i local-storage database(s)"
          ls -l "$ART" || true

      - name: Run the native-engine probe (NE-36 — playForay, > 90 s backgrounded, WebContent kill, reload)
        # NE-36 (docs/native-engine-plan.md), landed from the staged
        # tools/mobile/probe/ios-build-native-pass.yml. AFTER the two-pass probe
        # step, whose localStorage read must already have happened (this pass
        # boots probe-bridge.js again, which rewrites `foray_probe_bridge`), and
        # BEFORE the reporting step, which reads native-rows.json,
        # native-steps.txt and simulator-log-native.txt from $ART by default.
        # (Other steps' names are not quoted here: the suites find a step by a
        # fragment of its text, and a quoted name would shadow the real step.)
        #
        # COST: about 200 s more on a runner that bills at 10x (15 + 125 + 8 + 40 s
        # of sleeps, plus an in-place install). The 125 s is the card's "more than
        # 90 s" with the ~35 s Settings has taken to come forward on a cold
        # Simulator.
        #
        # SECURITY: the defaults export holds every `CapacitorStorage.` value the
        # app wrote (a session token included), so it goes to a work directory that
        # is never uploaded; `native-rows` lets out only `cp_pos:*`, `cp_foray:*`
        # and the probe's own record — the same boundary the localStorage read
        # keeps.
        #
        # `continue-on-error` like the other measurement steps: a pass that could
        # not run is no-coverage in the report. A pass that RAN and measured a
        # failure is not hidden by this flag — the gate step at the end of the job
        # turns a `fail` verdict red.
        id: probe_native
        if: env.PROBES != 'false' && steps.probe_install.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          UDID="${{ steps.sim.outputs.udid }}"
          STEPS="$ART/native-steps.txt"
          WORK="$RUNNER_TEMP/ios-ci-native-work"
          rm -rf "$WORK" && mkdir -p "$WORK"
          # Its own capture and its own cap, like each pass above.
          xcrun simctl spawn "$UDID" log stream --style compact \
            --predicate 'process == "App" OR senderImagePath CONTAINS "WebKit"' \
            2>&1 | head -c 20000000 > "$ART/simulator-log-native.txt" &
          LOG_PID=$!
          trap 'kill "$LOG_PID" 2>/dev/null || true' EXIT

          # The engine decides its lane once per process, at launch: terminate, then seed.
          xcrun simctl terminate "$UDID" "$APP_ID" || true
          # IN PLACE, in the installed bundle: the engine's AVPlayer opens the three
          # segments as files, and this is the only path they have.
          APPDIR=$(xcrun simctl get_app_container "$UDID" "$APP_ID" app)
          node tools/mobile/probe/install-probe.mjs "$APPDIR/public" --phase native --audio-base "file://$APPDIR/public/"
          node tools/mobile/ios-ci.mjs seed-mode "$UDID" "$APP_ID" native >> "$STEPS"

          echo "launch=$(xcrun simctl launch "$UDID" "$APP_ID")" >> "$STEPS"
          sleep 15
          xcrun simctl io "$UDID" screenshot "$ART/05-native-playing.png" || true
          xcrun simctl launch "$UDID" com.apple.Preferences \
            || xcrun simctl launch "$UDID" com.apple.mobilesafari
          echo "backgrounded_at=$(date +%s)" >> "$STEPS"
          sleep 125

          # A-3: kill the Simulator's WebContent process(es) mid-Foray, app still hidden.
          KILLED=$(ps -axo pid=,command= | awk '/com\.apple\.WebKit\.WebContent/ && /CoreSimulator/ {print $1}')
          N=0
          for P in $KILLED; do if kill -9 "$P" 2>/dev/null; then N=$((N+1)); fi; done
          echo "webcontent_killed=$N" >> "$STEPS"
          sleep 8

          # Foreground. The pid must not change: a relaunch is not a WebContent kill.
          echo "foreground=$(xcrun simctl launch "$UDID" "$APP_ID")" >> "$STEPS"
          echo "foreground_at=$(date +%s)" >> "$STEPS"
          # The page settles 4 s, pauses, reads the rows, loads index.html (W-8), and
          # the real page stamps its record 15 s later.
          sleep 40
          xcrun simctl io "$UDID" screenshot "$ART/06-native-after-reload.png" || true

          # THE APP'S OWN PLIST, in its data container. `simctl spawn defaults export`
          # reads the device-wide domain instead: trial run 36176555294 got one key
          # back (the seed) and none of the app's `CapacitorStorage.` writes. It is
          # the fallback only.
          DATA=$(xcrun simctl get_app_container "$UDID" "$APP_ID" data)
          if [ -f "$DATA/Library/Preferences/$APP_ID.plist" ]; then
            cp "$DATA/Library/Preferences/$APP_ID.plist" "$WORK/defaults.plist"
          else
            xcrun simctl spawn "$UDID" defaults export "$APP_ID" - > "$WORK/defaults.plist"
          fi
          plutil -convert xml1 "$WORK/defaults.plist"
          node tools/mobile/ios-ci.mjs native-rows "$WORK/defaults.plist" > "$ART/native-rows.json"
          xcrun simctl terminate "$UDID" "$APP_ID" || true

      # ── signing and TestFlight upload: retired here, R-05 ────────────────────
      #
      # This job no longer signs or uploads anything — that is `release.yml`'s
      # job via `.github/actions/ios-archive`, exercised on a tag or a manual
      # dispatch on `main`, not on every PR that touches the shell. See this
      # file's own header for why, and `docs/releases.md` for the operational
      # walkthrough of a real release.

      - name: Report what the probes established
        # R-05: this step no longer sets SIGNING_STATE. The signing gate and
        # the TestFlight upload live in `.github/actions/ios-archive` now
        # (consumed by `release.yml`), not in this workflow, so there is no
        # `steps.signing` output here to read — `ios-ci.mjs verdict` receives
        # no signingState and Section 4 of its report reads `not reported`,
        # which is correct for a CI-only run rather than a stale reference to
        # a step this file no longer has.
        #
        # NOT `continue-on-error`. `ios-ci.mjs verdict` exits 0 for every verdict
        # including the bad ones, by design, so the only thing the flag could hide
        # is a crash in the reporter — a green run with no summary at all, which
        # reads as "fine".
        id: verdict
        if: always()
        env:
          IOS_BUILD_STATUS: >-
            simulator=${{ steps.build_sim.outcome }},
            device=${{ steps.build_dev.outcome }},
            probes=${{ steps.probe_run.outcome }},
            native=${{ steps.probe_native.outcome }}
        run: |
          set -euo pipefail
          # `if: always()` means this can run even when the very first step failed
          # and $ART was never exported, so it re-derives rather than dying on an
          # unbound variable and leaving no report at all.
          ART="${ART:-$RUNNER_TEMP/ios-ci}"
          mkdir -p "$ART"
          # A `for` over a glob rather than a bash array: macOS ships bash 3.2,
          # where `${#arr[@]}` on an empty array is an unbound-variable error under
          # `set -u`. Combined with an unguarded reporter that would have been a
          # silent, report-free green run.
          : > "$ART/ls-rows-all.txt"
          for f in "$ART"/ls-rows-*.json; do
            [ -e "$f" ] || continue
            echo "$f" >> "$ART/ls-rows-all.txt"
          done
          if [ -s "$ART/ls-rows-all.txt" ]; then
            # shellcheck disable=SC2046
            node tools/mobile/ios-ci.mjs decode-localstorage $(cat "$ART/ls-rows-all.txt") \
              > "$ART/localstorage.json"
          else
            echo '{}' > "$ART/localstorage.json"
          fi
          # BOTH CAPTURES, pass 1's and the seam pass's. Reading only the first was
          # a real defect: on run 32036295743 the seam pass had no coverage in it at
          # all, so `probe-console.txt` came out EMPTY and the console fallback below
          # was silently useless on the one pass that mattered.
          #
          # WHOLE LINES, NOT `grep -o` WITH A COUNTED CONTEXT. The first run spent
          # >7 minutes here: `grep -a -i -o '.\{0,120\}…\.\{0,200\}'` over a
          # multi-hundred-megabyte debug log is pathological. A bounded line count is
          # all any human reads anyway.
          : > "$ART/probe-console.txt"
          : > "$ART/csp-messages.txt"
          for LOGF in "$ART/simulator-log.txt" "$ART/simulator-log-seam.txt"; do
            [ -f "$LOGF" ] || continue
            wc -c "$LOGF"
            grep -a -F 'FORAY_PROBE_' "$LOGF" | tail -400 \
              >> "$ART/probe-console.txt" || true
            grep -a -i -F 'Content Security Policy' "$LOGF" | head -200 \
              >> "$ART/csp-messages.txt" || true
          done
          # AN EMPTY probe-console.txt IS NOT EVIDENCE OF ANYTHING, and it was read
          # as evidence once. On 32036295743 it was 0 bytes and zero `FORAY_PROBE_`
          # lines appeared in 110,579 captured lines -- so a WKWebView `console.log`
          # has never once been observed reaching the simulator system log through
          # this predicate. Until one is, treat the console channel as UNPROVEN and
          # localStorage as the only working path. The same caution applies to
          # `csp-messages.txt`: empty means "nothing was captured", which is only
          # "no CSP violations" for a window the log actually covered.
          if [ ! -s "$ART/probe-console.txt" ]; then
            echo "NOTE: no FORAY_PROBE_ line was captured in any log; the console" \
                 "channel is unproven, not clean. localStorage is the measurement." \
              >> "$ART/probe-console-note.txt"
          fi
          # The console log is the SECOND channel, and it is passed in rather than
          # merely archived: if WebKit's local-storage filename moves under us, the
          # records are still in the system log, and an earlier version captured
          # them into the artifact and then never read them.
          node tools/mobile/ios-ci.mjs verdict "$ART/localstorage.json" "$ART/probe-console.txt"

      - name: Upload everything this run learned
        # Always: a failed build's log is the most useful thing in the run, and
        # the probe screenshots are the only human-readable form of the two
        # measurements.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-shell-evidence
          path: ${{ runner.temp }}/ios-ci
          if-no-files-found: warn
          retention-days: 14

      - name: Fail the job on a failing probe assertion (NE-36)
        # THE REPORT IS NOT A GATE; THIS IS. `ios-ci.mjs verdict` exits 0 for every
        # verdict so that a crash in the reporter is the only thing that can turn
        # its own step red — and that left run 36194671642 GREEN with a `fail`
        # row in section 5 ("JS-lane passes pinned to legacy") and a native pass
        # that never ran. A MEASURED failure must not read as a green run.
        #
        # SCOPE: section 5's verdict (`native`), which is `fail` when ANY of its
        # assertions — the legacy smoke, the native lane, playForay, the
        # WebContent kill, the seams, Now Playing, the forbidden WebKit/MediaRemote
        # and setNowPlaying lines, HTMLMediaElement, the W-8 reload clobber — is a
        # measured `fail`. `no-coverage` / `incomplete` stay non-fatal, exactly as
        # a Simulator that will not boot does: silence is reported as silence, not
        # as a pass and not as a broken build.
        #
        # AFTER THE UPLOAD, so the evidence of the failure is always published.
        if: always() && steps.verdict.outcome == 'success'
        env:
          NATIVE_VERDICT: ${{ steps.verdict.outputs.native }}
          NATIVE_FAILED: ${{ steps.verdict.outputs.native_failed }}
          LEGACY_SMOKE: ${{ steps.verdict.outputs.legacy_smoke }}
        run: |
          set -euo pipefail
          echo "native=${NATIVE_VERDICT:-unset} legacy_smoke=${LEGACY_SMOKE:-unset}"
          if [ "${NATIVE_VERDICT:-}" = "fail" ]; then
            echo "::error::NE-36 native-lane assertion(s) FAILED: ${NATIVE_FAILED:-see the job summary}. Section 5 of the summary has the evidence."
            exit 1
          fi
