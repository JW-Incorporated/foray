name: probe-kokoro-arm64 (throwaway)
on:
  push:
    branches: [probe/kokoro-arm64]
permissions:
  contents: read
jobs:
  arm64:
    strategy:
      fail-fast: false
      matrix:
        variant: [model, mm8, mmgemm8, lstm8]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: node tools/mobile/fetch-models.mjs
      - run: mkdir -p models && curl -fsSL -o models/model.onnx "https://huggingface.co/onnx-community/Kokoro-82M-v1.0-ONNX/resolve/main/onnx/model.onnx"
      - run: pip install "onnxruntime==1.20.1" numpy onnx
      - if: matrix.variant != 'model'
        run: python tools/probe-tmp/quantize.py models/model.onnx models/${{ matrix.variant }}.onnx ${{ matrix.variant }}
      - run: python -u tools/probe-tmp/kokoro_arm64.py ${{ matrix.variant }} cpu
