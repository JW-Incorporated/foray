# The release watchdog — piece 2 of docs/release-reliability-plan.md.
#
# WHY THIS WORKFLOW EXISTS
# On 2026-09-22 a release failed at 00:28 UTC — Apple's ingestion server
# returned one 500 — and it was found SIXTEEN HOURS later, by the founder
# noticing two fixes missing from the app. Three of the first 24 release runs
# failed, all three PARTIALLY: one store got the build and the other did not,
# and nothing in the system said so afterwards.
#
# A red run is not a channel here. When this was written, nightly-refresh and
# nightly-watch had both been red for over a week and nobody had seen either.
# So this job's red goes to ONE sticky GitHub issue, because opening or
# reopening an issue notifies the founder and a red run does not. The issue is
# edited as the picture changes and closes itself when every gate is green —
# one alarm with one history, which is what docs/DECISIONS.md already asks for
# ("one evolving issue rather than one per run").
#
# WHAT IT CHECKS — tools/release/watch-release.mjs, whose header and suite carry
# the reasoning. In one line each:
#   G1 the newest completed release failed, over an hour ago;
#   G2 the two stores got different builds, both having had credentials;
#   G3 a release-relevant commit has waited over 6h to reach the stores;
#   G4 a release run has been queued or running for over an hour;
#   L  release-trigger.yml is disabled, or has not completed a scheduled run
#      in 8h (TRIGGER_STALE_HOURS: GitHub skipped most slots of both schedules
#      on their first day, measured in watch-release.mjs) — the two workflows
#      watch each other, because HUMAN-ACTIONS #46 was a scheduled watchdog
#      that silently stopped firing.
#
# WHAT THE RUN COLOUR MEANS
# Green = the watchdog evaluated and the issue says what it found. Red = the
# watchdog itself could not work (an API it could not read, an issue it could
# not write). That split is what lets release-trigger.yml read "no recent green
# run" as "the watchdog is down" without confusing it with "the watchdog found
# a problem". The one failure that liveness cannot see is one the two workflows
# SHARE — they run the same module — so the issue step also runs after a failed
# step, and raises the issue itself when this is the second failed scheduled run
# in a row (selfBrokenVerdict()). Once is a blip; twice is broken.
#
# NOTHING HERE DISPATCHES OR RE-RUNS ANYTHING. Acting is release-trigger.yml's
# job; a watchdog that can change the thing it watches is not a watchdog.

name: release-watch

on:
  schedule:
    # Hourly at :23 — off the top of the hour, where GitHub's scheduling
    # contention lives, and away from release-trigger's :47.
    - cron: "23 * * * *"
  workflow_dispatch: {}

# ci-release-9 (round-3 audit): its OWN group. It used to share `release-alarm`
# with release-trigger.yml, but GitHub keeps one RUNNING and one PENDING run per
# group and cancels the older pending one when a third arrives — so a sharing
# group silently dropped whole watchdog or trigger runs, cancel-in-progress:
# false notwithstanding. The sticky issue needs no lock: planIssue always
# picks the OLDEST marked issue, so even a simultaneous double-create converges
# on one alarm the next hour (the stray duplicate is closed by hand, if ever).
concurrency:
  group: release-watch
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  # The alarm. Issues only — no pull-requests, no contents write.
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history: G3 walks `git log <last released commit>..origin/main`.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Everything the judge reads, fetched into files by the composite both
      # workflows share (CH2-34a): the release history, the newest release's
      # jobs and summary log, the waiting commits and the trigger's pulse. A
      # fetch that fails after its retries fails the JOB, except the summary
      # log, which expires — the composite's header says why.
      - name: Fetch the release history, the waiting commits and the trigger's pulse
        uses: ./.github/actions/release-facts
        with:
          for: watch
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Judge the five gates
        run: |
          node tools/release/watch-release.mjs --mode watch \
            --runs runs.json \
            --jobs jobs.json \
            --summary-log summary.log \
            --commits commits.txt \
            --peer-workflow peer-workflow.json \
            --peer-runs peer-runs.json \
            --verdict-out verdict.json

      # `always()`: this step ALSO runs when an earlier one failed, because the
      # peer's liveness check cannot see a failure the two workflows share (they
      # run the same module). Then there is no verdict.json, and the question
      # becomes "has the watchdog now failed twice running?" — see
      # selfBrokenVerdict(). The job stays red either way; this only decides
      # whether a person is told.
      - name: Keep the one issue in step with the verdict
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -s verdict.json ]; then
            VERDICT=verdict.json; MAY_CLOSE=--may-close
          else
            gh api "repos/$REPO/actions/workflows/release-watch.yml/runs?event=schedule&per_page=5" > own-runs.json
            node tools/release/watch-release.mjs --mode self-broken --runs own-runs.json \
              --current "$GITHUB_RUN_ID" --verdict-out self.json
            # Never closes: a broken watchdog has no standing to call anything green.
            VERDICT=self.json; MAY_CLOSE=
          fi
          # Issues this workflow's token opened, open or closed. The sticky one
          # is found by its marker, not its title, so a person retitling it
          # cannot orphan the alarm.
          gh api "repos/$REPO/issues?state=all&creator=github-actions%5Bbot%5D&per_page=100" > issues.json
          # --apply: watch-release.mjs makes the `gh issue` create/reopen/edit/close
          # it planned — ONE write path, shared with release-trigger.yml, so the
          # two can never maintain the sticky issue with different semantics.
          # Without --apply the same command only prints the plan (a dry run).
          node tools/release/watch-release.mjs --mode issue --verdict "$VERDICT" \
            --issues issues.json $MAY_CLOSE --apply --repo "$REPO" --body-out body.md
