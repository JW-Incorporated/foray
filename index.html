<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<!-- media-src is required for in-app playback (issue #24): with default-src
     'none' and no media-src, every <audio> load is blocked outright. Scoped to
     https: because episode audio comes from ~41 different podcast CDNs that we
     neither control nor can enumerate — and because cleartext is rejected at
     ingest anyway (tools/refresh/enclosure.mjs upgrades http to https), so a
     broader allowance would buy nothing. -->
<!-- img-src carries 'self' as well as https: because of the native shell (issue
     #36 §3). On the web the page origin is https://…, so every local icon is
     already covered by `https:`. Inside the iOS shell the origin is
     `capacitor://localhost` — a custom scheme, and one WKWebView requires
     (you cannot register a scheme handler for https) — so the app's OWN bundled
     icons match neither `https:` nor `data:` and are blocked outright. Android's
     shell defaults to `https://localhost` and never showed the problem, which is
     exactly why this is worth a comment: it fails on one platform only.
     'self' widens this to same-origin, which is the app's own bundle. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' https: data:; media-src https:; connect-src 'self' https://qjdllvqdcgacvujhclny.supabase.co; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<title>Foray</title>
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Foray">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎙️</text></svg>">
</head>
<body>
<header class="topbar">
  <button id="menu-btn" aria-label="Menu">☰</button>
  <h1><a href="#/">Foray</a> <span class="topbar-tag">a daily podcast picker</span></h1>
  <button id="refresh-btn" aria-label="New suggestions">↻</button>
</header>

<div id="drawer-overlay" hidden></div>
<nav id="drawer" hidden>
  <a class="drawer-section" href="#/">Home</a>
  <a class="drawer-section" href="#/playlists">Playlists</a>
  <div id="drawer-playlists"></div>
  <div class="drawer-section-label">Settings</div>
  <button class="drawer-item as-btn" id="family-toggle"></button>
  <button class="drawer-item as-btn" id="player-toggle"></button>
</nav>

<main id="view"></main>

<script src="search-engine.js"></script>
<script src="app.js"></script>
<!-- ES module; deferred by spec, so app.js checks window.ForayPlayer lazily on click. -->
<script type="module" src="player/client.js"></script>
</body>
</html>
