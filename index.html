<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- NO ZOOM, BY FOUNDER RULING (Wyatt, 2026-09-23, docs/DECISIONS.md): "I can
     zoom by double tapping. This is super annoying and gets me trapped in
     certain parts of the app. Remove the zoom functionality." This reverses
     the 2026-09-17 choice to keep pinch (test/no-horizontal-scroll.test.js
     pinned it; it now pins this). maximum-scale=1 + user-scalable=no is the
     declaration WKWebView honours; styles.css (touch-action on html/body)
     and app.js (gesturestart) are the two belts behind it, because Safari
     itself ignores this meta for accessibility and a WebView may some day. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!-- DARK IS THE DESIGN (styles.css, body.ui-v2): the page ships one palette,
     so it declares one scheme. "dark light" let the browser paint its own
     surfaces — the focus ring, form-control chrome, scrollbars, the default
     link colour — in the LIGHT palette over a #151119 page whenever the OS
     was set to Light (visual pass 1, 2026-09-23). -->
<meta name="color-scheme" content="dark">
<!-- media-src is required for in-app playback (issue #24): with default-src
     'none' and no media-src, every <audio> load is blocked outright. Scoped to
     https: because episode audio comes from ~41 different podcast CDNs that we
     neither control nor can enumerate — and because cleartext is rejected at
     ingest anyway (tools/refresh/enclosure.mjs upgrades http to https), so a
     broader allowance would buy nothing. -->
<!-- img-src carries 'self' as well as https: because of the native shell (issue
     #36 §3). On the web the page origin is https://…, so every local icon is
     already covered by `https:`. Inside the iOS shell the origin is
     `capacitor://localhost` — a custom scheme, and one WKWebView requires
     (you cannot register a scheme handler for https) — so the app's OWN bundled
     icons match neither `https:` nor `data:` and are blocked outright. Android's
     shell defaults to `https://localhost` and never showed the problem, which is
     exactly why this is worth a comment: it fails on one platform only.
     'self' widens this to same-origin, which is the app's own bundle. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' https: data:; media-src https:; connect-src 'self' https://qjdllvqdcgacvujhclny.supabase.co https://foray-web-seven.vercel.app; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<title>4a</title>
<!-- LINK PREVIEWS (sh-3-1071). A shared 4a link unfurls with the name, one
     plain line and the icon. These tags are inert: no script reads them and the
     CSP above is untouched. og:url and og:image are absolute on the public web
     origin (SH-1), and the image is icon-512.png, which tools/web/prepare-dist.mjs
     ships. The line is the Play short description (docs/store/play/README.md).
     Per-item previews are out of scope. test/link-preview-meta.test.js pins it. -->
<meta name="description" content="Podcast playlists stitched across shows, plus new episodes picked for you">
<meta property="og:site_name" content="4a">
<meta property="og:title" content="4a">
<meta property="og:description" content="Podcast playlists stitched across shows, plus new episodes picked for you">
<meta property="og:type" content="website">
<meta property="og:url" content="https://foray-web-seven.vercel.app/">
<meta property="og:image" content="https://foray-web-seven.vercel.app/icon-512.png">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#151119">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="4a">
<!-- This page's deploy id. Committed as "unstamped"; the deploy build stamps it
     (tools/ci/generate-manifest.mjs, next to sw.js's BUILD_ID) so app.js can
     tell whether the worker's "4a updated" names the deploy it already runs
     (round-3 audit, app-3-3). -->
<meta name="foray-deploy-id" content="unstamped">

<link rel="apple-touch-icon" href="icon-180.png">
<!-- THE FIRST PAINT IS ALREADY THE DESIGN (round-2 audit, perf-5 / perf-1).
     The two roman faces are asked for before styles.css is parsed, so the first
     paint can use them rather than swap to them; the italic is left to its
     @font-face. The player's whole module graph (player/client.js and every
     module it imports, transitively) is fetched in parallel here instead of
     one import level at a time — five serial round trips, each a
     service-worker revalidation, that app.js's boot waits on for hydration.
     The list is that import closure exactly, not every player/*.js: a module
     nothing imports is not preloaded (CH-07). test/boot-path.test.js fails
     when it drifts from tools/ci/generate-manifest.mjs's playerSources(). -->
